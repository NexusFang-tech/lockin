<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060a">
<title>LOCK IN</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#05060a;--surface:#0d0f1a;--surface2:#161a2b;--border:#28304d;
  --text:#e9ecff;--text2:#8790b8;
  --yellow:#fcee0a;--cyan:#00f0ff;--pink:#ff2d78;--magenta:#ff00ff;
  --green:#00ff9c;--green2:#00c47a;--amber:#ffb020;--red:#ff3860;--purple:#b026ff;--blue:#3b82f6;
  --font-display:'Orbitron','Segoe UI',system-ui,sans-serif;
  --font-ui:'Rajdhani','Segoe UI',system-ui,sans-serif;
  --font-mono:'Share Tech Mono','Consolas',monospace;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:
  radial-gradient(1200px 620px at 50% -12%,rgba(252,238,10,.05),transparent 60%),
  radial-gradient(900px 560px at 100% 108%,rgba(255,45,120,.06),transparent 60%),
  var(--bg);
  color:var(--text);min-height:100dvh;overflow-x:hidden;padding-bottom:82px}
body::before{content:'';position:fixed;inset:0;background-image:
  linear-gradient(rgba(0,240,255,.035) 1px,transparent 1px),
  linear-gradient(90deg,rgba(0,240,255,.035) 1px,transparent 1px);
  background-size:36px 36px;pointer-events:none;z-index:0}
#app{position:relative;z-index:1}
.hdr{text-align:center;padding:18px 16px 6px;background:linear-gradient(180deg,rgba(252,238,10,.07),transparent)}
.hdr-title{font-family:var(--font-display);font-size:30px;font-weight:900;letter-spacing:8px;
  background:linear-gradient(90deg,var(--yellow),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 14px rgba(0,240,255,.35))}
.hdr-sub{font-family:var(--font-mono);font-size:12px;color:var(--cyan);margin-top:3px;letter-spacing:1px;opacity:.85}
.date-nav{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 16px 4px}
.date-nav button{background:none;border:none;color:var(--yellow);font-size:22px;cursor:pointer;padding:4px 10px}
.date-nav-label{font-family:var(--font-ui);font-size:15px;font-weight:700;color:var(--text);cursor:pointer;padding:5px 12px;border-radius:6px;background:var(--surface);border:1px solid var(--border);min-width:150px;text-align:center;letter-spacing:.5px}
.date-nav-label.past{border-color:var(--amber);color:var(--amber)}
.date-nav-today{font-family:var(--font-ui);font-size:12px;font-weight:700;color:var(--cyan);cursor:pointer;padding:5px 10px;border:1px solid var(--cyan);border-radius:6px;background:none;text-transform:uppercase;letter-spacing:1px}
.content{padding:12px 16px 16px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(9,11,20,.92);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom));z-index:100}
.tab-btn{flex:1;background:none;border:none;color:var(--text2);font-family:var(--font-ui);font-weight:600;font-size:9px;letter-spacing:.5px;text-transform:uppercase;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:8px;transition:all .2s}
.tab-btn.active{color:var(--cyan);background:rgba(0,240,255,.1);box-shadow:inset 0 -2px 0 var(--cyan)}
.tab-icon{font-size:18px}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:14px}
.card::before,.card::after{content:'';position:absolute;width:11px;height:11px;pointer-events:none;opacity:.55}
.card::before{top:-1px;left:-1px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan)}
.card::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--pink);border-right:2px solid var(--pink)}
.card-title{font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(40,48,77,.6)}
.stat-row:last-child{border-bottom:none}
.stat-label{font-size:14px;color:var(--text2)}
.stat-value{font-family:var(--font-mono);font-size:18px;font-weight:400}
.btn{width:100%;padding:14px;border:none;border-radius:6px;font-family:var(--font-ui);font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--green);color:#04120c;box-shadow:0 0 16px rgba(0,255,156,.3)}
.btn-primary:active{background:var(--green2);transform:scale(.98)}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:active{background:var(--border)}
.btn-sm{padding:8px 14px;font-size:13px;width:auto;border-radius:6px}
.btn-danger{background:rgba(255,56,96,.15);color:var(--red);border:1px solid rgba(255,56,96,.35)}
input,select,textarea{width:100%;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:16px;font-family:inherit;-webkit-appearance:none}
input[type="date"]{color-scheme:dark}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
textarea{resize:vertical;min-height:60px;font-family:inherit}
label{display:block;font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.form-group{margin-bottom:14px}
.progress-bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:4px;transition:width .5s ease}
.streak-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(252,238,10,.1);border:1px solid rgba(252,238,10,.35);border-radius:20px;padding:6px 14px;font-family:var(--font-ui);font-size:14px;font-weight:700;color:var(--yellow);letter-spacing:.5px}
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.heatmap-cell{aspect-ratio:1;border-radius:2px;background:var(--surface2);position:relative}
.heatmap-cell.l1{background:rgba(0,255,156,.22)}
.heatmap-cell.l2{background:rgba(0,255,156,.42)}
.heatmap-cell.l3{background:rgba(0,255,156,.68)}
.heatmap-cell.l4{background:var(--green);box-shadow:0 0 6px rgba(0,255,156,.5)}
.heatmap-cell.today{box-shadow:0 0 0 2px var(--yellow)}
.heatmap-labels{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--text2);margin-top:4px;padding:0 2px}
.workout-group{margin-bottom:16px}
.workout-group-title{font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.workout-card{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.workout-card:active{transform:scale(.98)}
.workout-card.selected{border-color:var(--green);background:rgba(0,255,156,.08)}
.workout-card-name{font-family:var(--font-ui);font-weight:700;font-size:15px;margin-bottom:4px;letter-spacing:.5px}
.workout-card-desc{font-size:12px;color:var(--text2)}
.exercise-list{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.exercise-item{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.exercise-name{color:var(--text)}
.exercise-detail{color:var(--text2);font-family:var(--font-mono);font-size:12px}
.coach-note{font-size:11px;color:var(--amber);font-style:italic;margin-top:4px;padding:6px 8px;background:rgba(255,176,32,.06);border-radius:6px}
.core-addon{background:rgba(176,38,255,.08);border:1px solid rgba(176,38,255,.28);border-radius:6px;padding:12px;margin-top:12px}
.core-addon-title{font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.focus-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;margin-bottom:8px}
.focus-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:14px;color:#04120c}
.focus-check.done{background:var(--green);border-color:var(--green)}
.focus-text{flex:1;font-size:15px}
.focus-text.done{text-decoration:line-through;opacity:.5}
.focus-delete{color:var(--text2);font-size:18px;cursor:pointer;padding:4px 8px}
.energy-selector{display:flex;gap:6px;margin-top:6px}
.energy-btn{flex:1;padding:10px 4px;border:1px solid var(--border);background:var(--surface2);border-radius:6px;text-align:center;cursor:pointer;font-size:12px;color:var(--text2);transition:all .2s}
.energy-btn.active{border-color:var(--green);color:var(--green);background:rgba(0,255,156,.1)}
.quality-stars{display:flex;gap:8px;margin-top:6px}
.star{font-size:28px;cursor:pointer;opacity:.3;transition:all .15s}
.star.filled{opacity:1}
.chart-container{position:relative;width:100%;height:210px}
.chart-legend{display:flex;gap:14px;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--text2);margin-top:6px}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.meal-item{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--surface2);border-radius:6px;margin-bottom:6px}
.meal-info{flex:1}
.meal-name{font-size:14px;font-weight:600}
.meal-macros{font-family:var(--font-mono);font-size:12px;color:var(--text2)}
.meal-delete{color:var(--text2);cursor:pointer;padding:4px 8px;font-size:16px}
.chips-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;white-space:nowrap;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:9px 12px;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:.3px;cursor:pointer;transition:all .15s}
.chip:active{transform:scale(.95);border-color:var(--yellow);color:var(--yellow)}
.chip-macro{color:var(--text2);font-family:var(--font-mono);font-size:11px;margin-left:4px}
.fav-row{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;background:var(--surface2);border-radius:6px;margin-top:6px;font-size:13px}
.water-ring{flex-shrink:0;line-height:0}
.water-btn{flex:1;min-width:56px;background:var(--surface2);border:1px solid var(--border);color:var(--cyan);font-family:var(--font-ui);font-weight:700;font-size:15px;letter-spacing:.5px;padding:12px 0;border-radius:6px;cursor:pointer;transition:all .15s}
.water-btn:active{transform:scale(.95);background:rgba(0,240,255,.12);border-color:var(--cyan)}
.checkbox-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;cursor:pointer}
.checkbox-row input{width:20px;height:20px;flex-shrink:0}
.checkbox-row label{margin-bottom:0;text-transform:none;cursor:pointer}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px 12px 0 0;padding:20px;width:100%;max-width:500px;max-height:82dvh;overflow-y:auto}
.modal-title{font-family:var(--font-ui);font-size:18px;font-weight:700;letter-spacing:.5px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-close{font-size:24px;cursor:pointer;color:var(--text2);padding:4px}
.empty-state{text-align:center;padding:30px;color:var(--text2);font-size:14px}
.tag{display:inline-block;padding:4px 10px;border-radius:5px;font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.tag-green{background:rgba(0,255,156,.15);color:var(--green)}
.tag-amber{background:rgba(255,176,32,.15);color:var(--amber)}
.tag-red{background:rgba(255,56,96,.15);color:var(--red)}
.log-entry{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(40,48,77,.4);font-size:13px}
.log-entry:last-child{border-bottom:none}
.inline-stat{display:flex;gap:12px;flex-wrap:wrap}
.inline-stat-item{flex:1;min-width:80px;text-align:center;padding:12px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:6px}
.inline-stat-num{font-family:var(--font-mono);font-size:22px;font-weight:400}
.inline-stat-label{font-family:var(--font-ui);font-size:11px;font-weight:600;color:var(--text2);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.photo-card{background:var(--surface2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.photo-card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.photo-card-info{padding:8px 10px}
.photo-card-date{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--cyan)}
.photo-card-note{font-size:11px;color:var(--text2);margin-top:2px;word-break:break-word}
.photo-card-delete{font-size:11px;color:var(--red);cursor:pointer;margin-top:4px;opacity:.7}
.photo-full-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column}
.photo-full-overlay img{max-width:95%;max-height:75vh;object-fit:contain;border-radius:6px}
.photo-full-close{color:#fff;font-size:32px;position:absolute;top:16px;right:20px;cursor:pointer}
.pill-label{font-family:var(--font-ui);font-size:10px;font-weight:700;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;margin:2px 0 6px}
.pill-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pill-row::-webkit-scrollbar{display:none}
.pill{font-family:var(--font-ui);font-weight:600;font-size:11px;padding:6px 11px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.pill.active-pose{border-color:var(--cyan);background:rgba(0,240,255,.15);color:var(--cyan)}
.pill.active-week{border-color:var(--pink);background:rgba(255,45,120,.15);color:var(--pink)}

/* ── v7: SVG icon alignment + phase card + disciplined polish ── */
.tab-icon{font-size:20px;display:flex;align-items:center;justify-content:center;line-height:0}
.tab-icon svg{width:21px;height:21px}
.tab-btn{gap:3px;font-weight:700;letter-spacing:.6px}
.tab-btn.active svg{filter:drop-shadow(0 0 6px currentColor)}
.workout-group-title{display:flex;align-items:center;gap:8px}
.workout-group-title svg{width:17px;height:17px}
.core-addon-title{display:flex;align-items:center;gap:8px}
.core-addon-title svg{width:16px;height:16px}
.card-title svg{width:15px;height:15px}
.streak-badge svg{width:15px;height:15px}
/* Header — sharper, more "system readout" */
.hdr-title{letter-spacing:10px}
.hdr-sub{text-transform:uppercase;letter-spacing:2px;font-size:11px}
/* Phase card */
.phase-card::before{border-top-color:var(--green)}
.phase-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:10px}
.phase-label{font-family:var(--font-display);font-size:26px;font-weight:900;letter-spacing:3px;line-height:1}
.phase-tag{font-family:var(--font-ui);font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:1.5px;margin-top:4px}
.phase-track{flex:1;max-width:52%}
.phase-track-bar{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
.phase-track-fill{height:100%;border-radius:4px;transition:width .6s ease}
.phase-track-cap{font-family:var(--font-mono);font-size:10px;color:var(--text2);margin-top:5px;text-align:right;letter-spacing:.5px}
.phase-blurb{font-size:12.5px;color:var(--text2);line-height:1.5;margin-bottom:10px}
.phase-guide{font-family:var(--font-mono);font-size:11px;color:var(--cyan);background:rgba(0,240,255,.06);border:1px solid rgba(0,240,255,.18);border-radius:6px;padding:8px 10px;letter-spacing:.5px}
.phase-flip{margin-top:12px;padding:12px;border:1px solid rgba(0,255,156,.3);background:rgba(0,255,156,.06);border-radius:8px}
.phase-flip-msg{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--text);line-height:1.45}
.phase-flip-msg svg{width:16px;height:16px;color:var(--green);margin-top:1px;flex-shrink:0}
.phase-next{margin-top:12px;font-family:var(--font-mono);font-size:11px;color:var(--text2);letter-spacing:.5px}
.phase-switch{display:flex;gap:6px;margin-top:12px}
.phase-pill{flex:1;padding:8px 4px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);border-radius:6px;font-family:var(--font-ui);font-weight:700;font-size:11px;letter-spacing:1px;cursor:pointer;transition:all .15s}
.phase-pill.active{background:rgba(255,255,255,.03)}

/* ── v8: body map ── */
.bm-card::before{border-top-color:var(--cyan)}
.bm-toggle{display:flex;gap:6px;margin-bottom:6px}
.bm-tog{flex:1;padding:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);border-radius:6px;font-family:var(--font-ui);font-weight:700;font-size:11px;letter-spacing:2px;cursor:pointer;transition:all .15s}
.bm-tog.active{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 10px rgba(0,240,255,.2)}
.bm-frame{position:relative;background:radial-gradient(circle at 50% 25%,rgba(0,240,255,.04),transparent 70%);border:1px solid var(--border);border-radius:8px;margin:8px 0;overflow:hidden}
.bm-frame::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(0,240,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px);background-size:20px 20px;pointer-events:none}
.bm-prompt{text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--text2);letter-spacing:1px;padding:10px 0 2px}
.bm-panel{margin-top:6px}
.bm-panel-head{font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.bm-installing{font-family:var(--font-mono);font-size:10px;letter-spacing:2px;opacity:.7;animation:bmpulse 1.4s ease-in-out infinite}
@keyframes bmpulse{0%,100%{opacity:.35}50%{opacity:.9}}
.modality-sep{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:3px;color:var(--text2);text-transform:uppercase;text-align:center;margin:18px 0 12px;position:relative}
.modality-sep::before,.modality-sep::after{content:'';position:absolute;top:50%;width:28%;height:1px;background:var(--border)}
.modality-sep::before{left:0}.modality-sep::after{right:0}

/* ── v9: Goals / Cookie Jar (repurposed Focus tab) ── */
.goal-term-switch{display:flex;gap:8px;margin-bottom:14px}
.goal-term-btn{flex:1;padding:12px 4px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);border-radius:6px;font-family:var(--font-ui);font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .15s}
.goal-term-btn.active-short{border-color:var(--cyan);color:var(--cyan);background:rgba(0,240,255,.1);box-shadow:0 0 12px rgba(0,240,255,.18)}
.goal-term-btn.active-long{border-color:var(--pink);color:var(--pink);background:rgba(255,45,120,.1);box-shadow:0 0 12px rgba(255,45,120,.18)}
.goal-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;margin-bottom:8px}

// ═══════════════════════════════════════════
// LOCK IN v11 — Cyberpunk Wellness Command Center

// v9 changes:
//   • Focus tab repurposed into GOALS — Short-Term / Long-Term goals with a pill toggle.
//     Completed goals drop into a colorful "Cookie Jar" (David Goggins, Can't Hurt Me).
//     Stats tab tracks short-term & long-term goals completed.
//   (Prior focus history is preserved in the data model so old streaks/momentum stay intact.)
// v6 changes:
//   • Photos: multi-select WEEK filter alongside the pose filter (compare Week 1 vs Week 5 of one pose)
//   • Projections: robust Theil–Sen trend (28-day window) replaces least-squares — water spikes no longer
//     blow up the ETA. Adds a sanity guard + an ETA window (robust pace ↔ since-start pace).
// Goal date + label are user-settable (see config.goalDate / config.goalLabel)
function goalDateStr(){return (state.data&&state.data.config&&state.data.config.goalDate)||'';}
function goalLabelStr(){return (state.data&&state.data.config&&state.data.config.goalLabel)||'goal';}
function daysToGoalDate(){const gd=goalDateStr();if(!gd)return null;const n=daysBetween(getToday(),gd);return isNaN(n)?null:n;}
const STORE_KEY='lockin-data';
const TABS=['today','fuel','train','goals','recharge','photos','charts'];
const TAB_ICONS={today:'today',fuel:'fuel',train:'train',goals:'goals',recharge:'recharge',photos:'photos',charts:'stats'};
const TAB_LABELS={today:'Today',fuel:'Fuel',train:'Train',goals:'Goals',recharge:'Rest',photos:'Photos',charts:'Charts'};

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let state={tab:'today',modal:null,selectedWorkout:null,data:null,viewDate:null,photoFilter:'all',photoWeeks:[],editingPhoto:-1,bodyRegion:null,bodyView:'front',goalTerm:'short',wRange:'90',liftSel:null,reviewWeek:null,lxOpen:{},lxExtra:{},editWeight:false};
let tempSleepQuality=0,tempEnergy=0;
let QUICK=[]; // current quick-add meal list (rebuilt each render that shows chips)

function defaults(){
  const sd='2026-07-08';
  const gd=new Date(sd+'T12:00:00');gd.setDate(gd.getDate()+90); // neutral 90-day default, not anyone's specific date
  return{config:{startWeight:305,goalWeight:270,startDate:sd,goalDate:gd.toISOString().slice(0,10),goalLabel:'goal',calorieTarget:2100,proteinTarget:150,sleepTarget:7.5,waterTarget:110,phase:'cut',leanTarget:225,restingBase:2583,activeHaircut:0.18,typicalActive:500,birthdayDate:'2027-01-28',birthdayLabel:'34th birthday',waistTarget:36,deficitTarget:500,scoreBasis:'calibrated'},weights:{},meals:{},workouts:{},focus:{},sleep:{},water:{},active:{},resting:{},waist:{},lifts:{},photos:[],favorites:[],goals:{short:[],long:[]}};
}

function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){
      const d=JSON.parse(raw);
      const def=defaults();
      state.data={
        config:{...def.config,...(d.config||{})},
        weights:{...def.weights,...(d.weights||{})},
        meals:{...def.meals,...(d.meals||{})},
        workouts:{...def.workouts,...(d.workouts||{})},
        focus:{...def.focus,...(d.focus||{})},
        sleep:{...def.sleep,...(d.sleep||{})},
        water:{...def.water,...(d.water||{})},
        active:{...def.active,...(d.active||{})},
        waist:{...def.waist,...(d.waist||{})},
        resting:{...def.resting,...(d.resting||{})},
        lifts:{...def.lifts,...(d.lifts||{})},
        photos:Array.isArray(d.photos)?d.photos:[],
        favorites:Array.isArray(d.favorites)?d.favorites:[],
        goals:(d.goals&&typeof d.goals==='object')?{short:Array.isArray(d.goals.short)?d.goals.short:[],long:Array.isArray(d.goals.long)?d.goals.long:[]}:{short:[],long:[]}
      };
    }else{state.data=defaults();}
  }catch(e){state.data=defaults();}
  state.viewDate=getToday();
}

let photosInIDB=false;
function save(){
  bustCaches();
  try{
    if(photosInIDB){const {photos,...rest}=state.data;localStorage.setItem(STORE_KEY,JSON.stringify(rest));}
    else{localStorage.setItem(STORE_KEY,JSON.stringify(state.data));}
  }catch(e){console.warn('LOCK IN: localStorage save failed',e);}
}
// ── IndexedDB photo store (base64 photos are too big for localStorage's ~5MB cap) ──
const IDB_NAME='lockin-db',IDB_STORE='photos';
function genPhotoId(ts){return 'p_'+(ts||Date.now())+'_'+Math.random().toString(36).slice(2,7);}
function idbOpen(){return new Promise((res,rej)=>{try{const req=indexedDB.open(IDB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE,{keyPath:'id'});};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);}catch(e){rej(e);}});}
function idbAll(){return idbOpen().then(db=>new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readonly');const r=t.objectStore(IDB_STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);}));}
function idbPut(photo){return idbOpen().then(db=>new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readwrite');t.objectStore(IDB_STORE).put(photo);t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error);}));}
function idbPutAll(arr){return idbOpen().then(db=>new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readwrite');const s=t.objectStore(IDB_STORE);arr.forEach(p=>s.put(p));t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error);}));}
function idbDelete(id){return idbOpen().then(db=>new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readwrite');t.objectStore(IDB_STORE).delete(id);t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error);}));}
function persistPhoto(p){idbPut(p).catch(e=>{console.warn('photo save failed',e);alert('That photo could not be saved — your device storage may be full. Your other data is safe.');});}
function localDateStr(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function getToday(){return localDateStr(new Date())}
function getVD(){return state.viewDate||getToday()}
function isViewingToday(){return getVD()===getToday()}
function daysBetween(a,b){return Math.ceil((new Date(b)-new Date(a))/(864e5))}
function round1(n){return Math.round(n*10)/10}
function fmtDate(d){const dt=new Date(d+'T12:00:00');return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function fmtShort(d){const dt=new Date(d+'T12:00:00');return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})}

function shiftDate(days){
  const d=new Date(getVD()+'T12:00:00');
  d.setDate(d.getDate()+days);
  const ds=localDateStr(d);
  const today=getToday();
  if(ds>today) return; // can't go into future
  state.viewDate=ds;
  render();
}

// GOALS / COOKIE JAR  (repurposed Focus tab)
// ═══════════════════════════════════════════
// Inspired by David Goggins' "Cookie Jar" (Can't Hurt Me): every completed goal is a
// win you can reach back into when things get hard. Short-term & long-term, each a list.
function escapeHTML(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function genGoalId(){return 'g_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function ensureGoals(){
  if(!state.data.goals||typeof state.data.goals!=='object')state.data.goals={short:[],long:[]};
  if(!Array.isArray(state.data.goals.short))state.data.goals.short=[];
  if(!Array.isArray(state.data.goals.long))state.data.goals.long=[];
}
// Stable, varied neon color per completed goal (hashed from its id → always the same badge color)
const GOAL_BADGE_PALETTE=[
  {hex:'#00f0ff',rgb:'0,240,255'},   // cyan
  {hex:'#ff2d78',rgb:'255,45,120'},  // pink
  {hex:'#fcee0a',rgb:'252,238,10'},  // yellow
  {hex:'#00ff9c',rgb:'0,255,156'},   // green
  {hex:'#b026ff',rgb:'176,38,255'},  // purple
  {hex:'#ffb020',rgb:'255,176,32'},  // amber
  {hex:'#ff00ff',rgb:'255,0,255'},   // magenta
  {hex:'#3b82f6',rgb:'59,130,246'}   // blue
];
function badgeColorFor(id){
  const s=String(id);let h=0;
  for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
  return GOAL_BADGE_PALETTE[h%GOAL_BADGE_PALETTE.length];
}
function mergeGoals(a,b){
  const seen=new Set(),out=[];
  [...(a||[]),...(b||[])].forEach(g=>{
    if(!g)return;
    const id=g.id||genGoalId();
    if(seen.has(id))return;
    seen.add(id);out.push({...g,id});
  });
  return out;
}

// ═══════════════════════════════════════════
// STREAK / MOMENTUM
// ═══════════════════════════════════════════
function getActivityLevel(date){
  let s=0;const d=state.data;
  if(d.weights[date])s++;
  if(d.meals[date]&&d.meals[date].length>0)s++;
  if(d.workouts[date]&&d.workouts[date].length>0)s++;
  if(d.focus[date]&&d.focus[date].length>0)s++;
  if(d.sleep[date])s++;
  return Math.min(s,4);
}

function getCurrentStreak(){
  let streak=0;let d=new Date();
  if(getActivityLevel(getToday())>0)streak++;
  d.setDate(d.getDate()-1);
  while(true){
    const ds=localDateStr(d);
    if(getActivityLevel(ds)>0){streak++;d.setDate(d.getDate()-1);}
    else break;
    if(streak>365)break;
  }
  return streak;
}

function getLongestStreak(){
  const allDates=new Set([...Object.keys(state.data.weights),...Object.keys(state.data.meals),...Object.keys(state.data.workouts),...Object.keys(state.data.focus),...Object.keys(state.data.sleep)]);
  if(allDates.size===0)return 0;
  const sorted=[...allDates].sort();
  let longest=1,current=1;
  for(let i=1;i<sorted.length;i++){
    if(daysBetween(sorted[i-1],sorted[i])===1){current++;longest=Math.max(longest,current);}
    else current=1;
  }
  return longest;
}

function getLatestWeight(){
  const dates=Object.keys(state.data.weights).sort();
  return dates.length>0?state.data.weights[dates[dates.length-1]]:null;
}

// ═══════════════════════════════════════════
// ENERGY BALANCE + EXECUTION ENGINE (v10)
// ═══════════════════════════════════════════
function dayEnergy(date){
  const d=state.data,cfg=d.config;
  const intake=dayIntake(date);
  const hasMeals=(d.meals[date]||[]).length>0;
  const wt=watchTdee(date);
  const cal=calibrationAt(date);
  const calTdee=cal?Math.round(cal.maint+(wt.tdee-cal.watchAvg)):null;
  const useCal=(cfg.scoreBasis||'calibrated')==='calibrated'&&calTdee!=null;
  const tdee=useCal?calTdee:wt.tdee;
  const deficit=hasMeals?(tdee-intake):null;
  return{intake,hasMeals,activeRaw:wt.activeRaw,usedActive:wt.usedActive,isEstimated:wt.isEstimated,adjActive:wt.adjActive,
    rest:wt.rest,restLogged:wt.restLogged,watchTdee:wt.tdee,calTdee,cal,calibrated:useCal,tdee,deficit};
}
function rollingDeficit(days){
  const today=new Date();let totalDef=0,counted=0,estDays=0;
  for(let i=0;i<days;i++){
    const dt=new Date(today);dt.setDate(dt.getDate()-i);
    const ds=localDateStr(dt);
    const e=dayEnergy(ds);
    if(e.deficit!=null){totalDef+=e.deficit;counted++;if(e.isEstimated)estDays++;}
  }
  const avgDef=counted>0?Math.round(totalDef/counted):null;
  const projectedWeeklyLoss=avgDef!=null?Math.round((avgDef*7/3500)*10)/10:null;
  return{avgDef,counted,estDays,projectedWeeklyLoss};
}
function executionScore(date){
  const d=state.data,cfg=d.config;
  const meals=d.meals[date]||[];
  if(meals.length===0)return null;
  const protein=meals.reduce((s,m)=>s+(m.protein||0),0);
  const water=d.water[date]||0;
  const workouts=d.workouts[date]||[];
  const sleep=d.sleep[date];
  const e=dayEnergy(date);
  const parts={};
  if(e.deficit!=null){
    const T=cfg.deficitTarget||500; // full credit at the target deficit; monotonic everywhere below it
    if(e.deficit>=T)parts.deficit=30;
    else if(e.deficit>=0)parts.deficit=Math.round(9+(e.deficit/T)*21);
    else parts.deficit=Math.max(0,Math.round(9+e.deficit/40));
  }else parts.deficit=0;
  const proT=cfg.proteinTarget||150;
  parts.protein=Math.min(30,Math.round((protein/proT)*30));
  const waterT=cfg.waterTarget||110;
  parts.water=Math.min(20,Math.round((water/waterT)*20));
  parts.training=workouts.length>0?10:0;
  const sleepT=cfg.sleepTarget||7.5;
  parts.sleep=sleep?Math.min(10,Math.round((sleep.hours/sleepT)*10)):0;
  const score=Math.min(100,parts.deficit+parts.protein+parts.water+parts.training+parts.sleep);
  return{score,parts};
}
function weeklyExecution(){
  const today=new Date();let sum=0,n=0;
  for(let i=0;i<7;i++){
    const dt=new Date(today);dt.setDate(dt.getDate()-i);
    const ds=localDateStr(dt);
    const s=executionScore(ds);
    if(s){sum+=s.score;n++;}
  }

}
function waterFlagFor(date){

  if(idx<1)return null;

// ═══════════════════════════════════════════
// TRAJECTORY / TREND ENGINE
// ═══════════════════════════════════════════
function sortedWeightEntries(){
  return Object.keys(state.data.weights).sort().map(d=>({date:d,w:state.data.weights[d]}));
}
// Rolling average of the last `win` values, aligned per entry
function rollingAvgSeries(entries,win){
  return entries.map((e,i)=>{
    const s=Math.max(0,i-win+1);
    const slice=entries.slice(s,i+1);
    const avg=slice.reduce((a,b)=>a+b.w,0)/slice.length;
    return {date:e.date,avg:avg};
  });
}
// Least-squares slope in lbs/day over given entries (x = days since first). Kept as a degenerate fallback.
function trendSlope(entries){
  if(entries.length<2)return null;
  const x0=new Date(entries[0].date+'T12:00:00').getTime();
  const pts=entries.map(e=>({x:(new Date(e.date+'T12:00:00').getTime()-x0)/864e5,y:e.w}));
  const n=pts.length;
  const sx=pts.reduce((a,p)=>a+p.x,0);
  const sy=pts.reduce((a,p)=>a+p.y,0);
  const sxy=pts.reduce((a,p)=>a+p.x*p.y,0);
  const sxx=pts.reduce((a,p)=>a+p.x*p.x,0);
  const denom=(n*sxx-sx*sx);
  if(denom===0)return null;
  return (n*sxy-sx*sy)/denom;
}
// Theil–Sen robust slope (median of ALL pairwise slopes), lbs/day.
// Median-of-slopes resists outliers: a 3–4 day water spike is a minority of the pairs,
// so it can't drag the trend the way least-squares does. This is the fix for the
// "goal in 2.5 years" artifact that appears after a salty weekend.
function theilSenSlope(entries){
  if(!entries||entries.length<2)return null;
  const pts=entries.map(e=>({x:new Date(e.date+'T12:00:00').getTime()/864e5,y:e.w}));
  const slopes=[];
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    const dx=pts[j].x-pts[i].x;
    if(dx!==0)slopes.push((pts[j].y-pts[i].y)/dx);
  }
  if(!slopes.length)return null;
  slopes.sort((a,b)=>a-b);
  const m=Math.floor(slopes.length/2);
  return slopes.length%2?slopes[m]:(slopes[m-1]+slopes[m])/2;
}
function getTrajectory(){
  const entries=sortedWeightEntries();
  if(entries.length<3)return null;
  const today=getToday();

  // ── Robust pace: Theil–Sen over the last 28 days (needs ≥5 pts, else last 10 entries) ──
  const win=entries.filter(e=>daysBetween(e.date,today)<=28);
  const recent=win.length>=5?win:entries.slice(-Math.min(entries.length,10));
  let slope=theilSenSlope(recent);
  if(slope===null)slope=trendSlope(recent); // degenerate fallback only

  const roll=rollingAvgSeries(entries,7);
  const smoothedLatest=round1(roll[roll.length-1].avg);
  const goal=state.data.config.goalWeight;
  const weekly=round1(slope*7);

  // ── Since-start endpoint pace (naive: total lost / total weeks) ──
  const firstE=entries[0],lastE=entries[entries.length-1];
  const elapsed=Math.max(1,daysBetween(firstE.date,lastE.date));
  const sinceStartDaily=(lastE.w-firstE.w)/elapsed;
  const sinceStartWeekly=round1(sinceStartDaily*7);

  const gd=state.data.config.goalDate;
  const daysToGoalDt=gd?daysBetween(today,gd):null;

  // ── ETA helpers with sanity guard ──
  const CAP=730; // never project further than ~2 years; beyond that we call it "flat" instead of a scary number
  const etaDays=(dailySlope)=>{
    if(smoothedLatest<=goal)return 0;
    if(dailySlope>=-0.005)return null;              // flat or gaining → no finite ETA
    const d=Math.ceil((smoothedLatest-goal)/(-dailySlope));
    return (d>CAP||!isFinite(d))?null:d;
  };
  const etaDate=(days)=>{
    if(days==null)return null;
    const dt=new Date(today+'T12:00:00');dt.setDate(dt.getDate()+days);
    return dt.toISOString().slice(0,10);
  };

  const daysToGoal=etaDays(slope);
  const projGoalDate=etaDate(daysToGoal);

  // ── ETA window: robust pace ↔ since-start pace (brackets reality) ──
  const dR=etaDays(slope),dS=etaDays(sinceStartDaily);
  const both=[dR,dS].filter(v=>v!=null);
  const etaEarly=both.length?etaDate(Math.min(...both)):null;
  const etaLate=both.length?etaDate(Math.max(...both)):null;

  // ── Projected weight on the goal date (robust slope) ──
  let projGoal=null;
  if(daysToGoalDt!=null&&!isNaN(daysToGoalDt))projGoal=round1(smoothedLatest+slope*daysToGoalDt);

  const flat=slope>=-0.02 && smoothedLatest>goal; // water-dominated stall right now

  return {smoothedLatest,weekly,slope,sinceStartWeekly,
          projGoalDate,daysToGoal,projGoal,goalTargetDate:gd,goal,
          reachedGoal:smoothedLatest<=goal,etaEarly,etaLate,flat};
}

function workoutMuscles(w){

}
// Last date each muscle was trained (on or before `asOf`). role 'p' = primary-only, 'any' = either.
function muscleRecency(asOf){

// ── Next Up recommender ─────────────────────────────────────

}
function nextUp(){

  const planDay=doneToday.length?addDays(today,1):today;

  const yesterdayOfPlan=addDays(planDay,-1);

  });

}

// ── Strength log ────────────────────────────────────────────
// data.lifts = { 'YYYY-MM-DD': { 'Flat Bench Press': {mode:'load'|'assist'|'bw', sets:[{w,r}]} } }
function parseScheme(s){
  if(!s)return null;const t=String(s).replace(/x/gi,'×').trim();
  let m=t.match(/^(\d+)\s*×\s*(\d+)(?:\s*-\s*(\d+))?\s*(?:\/\s*(?:side|leg))?\s*(?:each)?$/i);
  if(m)return {sets:+m[1],lo:+m[2],hi:+(m[3]||m[2])};
  m=t.match(/^(\d+)\s*×\s*(max|amrap)$/i);
  if(m)return {sets:+m[1],lo:null,hi:null,max:true};
  return null;
}
function defaultLiftMode(name){
  const n=name.toLowerCase();
  if(/assist/.test(n)||/pull-?ups?|chin-?ups?/.test(n))return 'assist';
  if(/push-?ups?|bodyweight|burpee|chair\/bed dips|bed dips/.test(n))return 'bw';
  return 'load';
}
function liftIncrement(name,mode){
  if(/squat|deadlift|leg press|hack|hip thrust|romanian|rdl|calf/i.test(name))return 10;
  return 5;
}
function epley(w,r){if(!(w>0)||!(r>0))return 0;return r===1?w:w*(1+Math.min(r,15)/30);}

  if(LIFT_CACHE)return LIFT_CACHE;
  const L=state.data.lifts||{};const by={};
  Object.keys(L).sort().forEach(d=>{
    Object.entries(L[d]||{}).forEach(([name,e])=>{
      const sets=(e.sets||[]).filter(s=>s&&s.r>0);
      if(!sets.length)return;
      (by[name]=by[name]||[]).push(sessionMetrics(name,d,e.mode||defaultLiftMode(name),sets));
    });
  });
  return (LIFT_CACHE=by);
}
function sessionMetrics(name,date,mode,sets){
  const bw=bodyweightOn(date);

  sets.forEach(s=>{
    const w=+s.w||0,r=+s.r||0;
    const eff=mode==='assist'?Math.max(0,bw-w):mode==='bw'?bw+w:w;
    best=Math.max(best,epley(eff,r));
    bestReps=Math.max(bestReps,r);

function liftHistory(name,before){const h=allLiftHistory()[name]||[];return before?h.filter(s=>s.date<before):h;}

  const h=allLiftHistory()[name]||[];const cur=h.find(s=>s.date===date);if(!cur)return false;

// Double progression: own the rep range at a weight, then add load (or remove assistance).
function liftSuggestion(name,scheme,before){
  const h=liftHistory(name,before);
  const last=h[h.length-1];
  const sc=scheme||{sets:3,lo:8,hi:12};
  if(!last){
    if(sc.max)return {w:null,text:'First log — go to failure with clean reps. That number becomes the one to beat.'};
    return {w:null,text:`First log — pick a weight you can do for ${sc.lo}${sc.hi!==sc.lo?'–'+sc.hi:''} clean reps with 1–2 left in the tank.`};
  }
  const mode=last.mode,inc=liftIncrement(name,mode);
  if(sc.max||mode==='bw'){

  }

    if(allHit){const nw=Math.max(0,W-inc);return {w:nw,text:nw===0?`You owned ${W} lb assist — try it UNASSISTED.`:`Hit ${sc.hi} on every set → drop assistance to ${nw} lb.`};}
    return {w:W,text:`Stay at ${W} lb assist — chase ${sc.hi} reps on all ${sc.sets} sets, then drop ${inc} lb.`};
  }
  const W=last.topW;const atW=last.sets.filter(s=>+s.w===W);

  if(allHit)return {w:W+inc,text:`Hit ${sc.hi} on all ${sc.sets} sets at ${W} → go ${W+inc} today.`};

function lastModeFor(name){const h=allLiftHistory()[name]||[];return h.length?h[h.length-1].mode:defaultLiftMode(name);}
function liftEntry(vd,name,create){

function pruneLifts(vd){

// ── Calibration: maintenance measured from YOUR log + YOUR scale ──
// maintenance ≈ avg logged intake − (robust weight slope × 3500). It absorbs every error at once:
// watch over-count, resting-estimate error AND logging under-count. It's in "your logged-calorie units".
function avgRestingRecent(asOf){
  const r=state.data.resting||{};const vals=[];
  for(let i=0;i<21;i++){const d=addDays(asOf,-i);if(r[d])vals.push(r[d]);}
  return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null;
}
function watchTdee(date){
  const d=state.data,cfg=d.config;
  const restLogged=(d.resting&&d.resting[date])||null;
  const rest=restLogged||avgRestingRecent(date)||cfg.restingBase||2583;
  const activeRaw=(d.active&&d.active[date]!=null)?d.active[date]:null;
  const usedActive=activeRaw!=null?activeRaw:(cfg.typicalActive||500);
  const haircut=cfg.activeHaircut!=null?cfg.activeHaircut:0.18;
  const adjActive=Math.round(usedActive*(1-haircut));
  return {tdee:rest+adjActive,rest,restLogged,activeRaw,usedActive,adjActive,isEstimated:activeRaw==null};
}
function calibrationEnding(end){
  if(CAL_CACHE[end]!==undefined)return CAL_CACHE[end];
  const start=addDays(end,-27);
  const intakeDays=[];
  for(let i=0;i<28;i++){const d=addDays(start,i);const c=dayIntake(d);if(c>=800)intakeDays.push(d);}
  const weighs=Object.keys(state.data.weights).filter(d=>d>=start&&d<=end).sort().map(d=>({date:d,w:state.data.weights[d]}));
  let res=null;
  if(intakeDays.length>=10&&weighs.length>=6&&daysBetween(weighs[0].date,weighs[weighs.length-1].date)>=14){
    const slope=theilSenSlope(weighs);
    const avgIntake=intakeDays.reduce((a,d)=>a+dayIntake(d),0)/intakeDays.length;
    const watchAvg=intakeDays.reduce((a,d)=>a+watchTdee(d).tdee,0)/intakeDays.length;
    const maint=Math.round(avgIntake-slope*3500);
    res={maint,avgIntake:Math.round(avgIntake),slopeWk:round1(slope*7),watchAvg:Math.round(watchAvg),gap:Math.round(watchAvg-maint),days:intakeDays.length,weighs:weighs.length,start,end};
  }
  return (CAL_CACHE[end]=res);
}
// For any day, use a window roughly centred on it (ends ≤ today) — best knowledge for that day.
function calibrationAt(date){const today=getToday();const e=addDays(date,14);return calibrationEnding(e>today?today:e);}

// ── Daily Debrief ───────────────────────────────────────────
const ESTIMATE_RX=/pizza|pasta|rigatoni|farfalle|mac|burger|fries|fried|wing|cook ?out|zaxby|zaki|chick-?fil|cfa|sandwich|sub\b|jimmy|taco|burrito|nacho|calamari|mozz|cake|pudding|cookie|brownie|ice cream|dessert|pulled pork|bbq|shawarma|gyro|restaurant|takeout|out\b|sushi|poke|pad thai|hibachi|lo mein|fried rice|grilled cheese|biscuit|donut|muffin/i;
const SALTY_RX=/pizza|sausage|bacon|pepperoni|cook ?out|zaxby|zaki|fries|wing|soy|ramen|pulled pork|bbq|pickle|feta|deli|ham\b|salami|jerky|shawarma|gyro|calamari|mozz|mac|sushi|poke|pad thai|hibachi|chinese|lo mein|fried rice|chips/i;
const ALCOHOL_RX=/\bbeers?\b|\bipa\b|lager|\bale\b|stout|pilsner|\bwine\b|cocktail|margarita|seltzer|whiskey|bourbon|\bshots?\b|\bpints?\b|mimosa|\bvodka\b(?!\s*(rigatoni|pasta|sauce))|tequila|\brum\b/i;
function dayDebrief(date){
  const d=state.data,cfg=d.config;
  const meals=d.meals[date]||[];
  const today=getToday();
  const inProgress=date===today&&new Date().getHours()<21;
  const protein=dayProtein(date),intake=dayIntake(date);
  const proT=cfg.proteinTarget||150,waterT=cfg.waterTarget||110,sleepT=cfg.sleepTarget||7.5;
  const water=d.water[date]||0,sleep=d.sleep[date],workouts=d.workouts[date]||[];
  const e=dayEnergy(date),defT=cfg.deficitTarget||500;
  const wins=[],fixes=[],heads=[];
  if(!meals.length&&!workouts.length&&!water&&!sleep)return null;
  // Protein
  if(protein>=proT)wins.push(`Protein ${protein}g — goal hit${protein>=proT*1.3?' with room to spare':''}.`);
  else if(meals.length)(inProgress?heads:fixes).push(inProgress?`${proT-protein}g protein to go — a shake (~40g) or 5 oz chicken (~45g) closes it.`:`Protein ${protein}/${proT}g — ${proT-protein}g short. Easiest fix: a shake or 5 oz chicken.`);
  // Deficit (calibrated when available)
  if(e.deficit!=null){
    const basis=e.calibrated?'calibrated':'watch-based';
    if(inProgress){
      const room=Math.round(e.tdee-defT-intake);
      heads.push(room>0?`~${room} cal left to land a ${defT} deficit (${basis} burn ~${e.tdee}).`:`Already past the ${defT}-deficit budget by ~${-room} — keep the rest of today lean & high-protein.`);
    }else if(e.deficit>=defT)wins.push(`Deficit ~${e.deficit} (${basis}) — fat-loss day.`);
    else if(e.deficit>=0)fixes.push(`Deficit only ~${e.deficit} (${basis}) vs your ${defT} target — near maintenance.`);
    else fixes.push(`Surplus ~${-e.deficit} (${basis}). One day won't matter — the pattern does.`);
  }
  // Estimate-heavy & salty & alcohol
  const est=meals.filter(m=>ESTIMATE_RX.test(m.name||''));
  const estCal=est.reduce((a,m)=>a+(m.calories||0),0);
  if(est.length>=2||(intake&&estCal/intake>=0.4&&est.length)){
    fixes.push(`Estimate-heavy: ${est.map(m=>m.name).slice(0,3).join(', ')}${est.length>3?'…':''}. This is where logs under-count — if not already padded, real intake is likely ~${Math.round(estCal*0.25/10)*10} higher.`);
  }
  const salty=meals.filter(m=>SALTY_RX.test(m.name||''));
  if(salty.length)heads.push(`Salty day (${salty.map(m=>m.name).slice(0,2).join(', ')}) — expect a 1–3 lb water bump tomorrow. Not fat.`);
  const booze=meals.filter(m=>ALCOHOL_RX.test(m.name||''));
  if(booze.length)heads.push(`Alcohol (~${booze.reduce((a,m)=>a+(m.calories||0),0)} cal) — fat burning pauses while it clears. Extra water tonight.`);
  // Water
  if(water>=waterT)wins.push(`Water ${water} oz — target hit.`);
  else if(inProgress)heads.push(`${waterT-water} oz water to go.`);
  else if(water)fixes.push(`Water ${water}/${waterT} oz — front-load it tomorrow (32 oz by noon).`);
  // Sleep
  if(sleep){
    if(sleep.hours>=sleepT)wins.push(`Slept ${sleep.hours}h.`);
    else if(sleep.hours<sleepT-0.5)fixes.push(`Slept ${sleep.hours}h vs ${sleepT}h — short sleep raises hunger and water retention.`);
  }else if(date!==today)heads.push('No sleep logged — log it for a complete score.');
  // Training + PRs
  if(workouts.length){
    wins.push(`Trained: ${workouts.map(w=>w.routine?`${w.name} (${w.routine})`:w.name).join(', ')}.`);
    const prs=prsOn(date);
    if(prs.length)wins.push(`PR${prs.length>1?'s':''}: ${prs.join(', ')}.`);
  }else{
    const recent=[1,2].every(i=>!(d.workouts[addDays(date,-i)]||[]).length);
    if(recent&&!inProgress)fixes.push('Third straight day without training logged.');
    else if(!inProgress)heads.push('Rest day — recovery counts.');
  }
  const rec=muscleRecency(date);const legDs=daysSinceDate(rec.legs.p,date);
  if(legDs==null||legDs>=7)heads.push(`Legs ${legDs==null?'never trained':`untouched ${legDs} days`} — your biggest muscles are sitting idle.`);
  if(!inProgress&&e.isEstimated&&meals.length)heads.push('Active calories not logged — burn is estimated.');
  // Focus: the single most valuable fix
  let focus='';
  const f=fixes.join(' ');
  if(/Protein/.test(f))focus=`Protein first: build tomorrow around ${proT}g — plan the shake and the chicken before you plan anything else.`;
  else if(/Surplus|near maintenance/.test(f))focus='Tighten the ledger: weigh the add-ons (oils, cheese, sauces) and pad restaurant meals ~25%.';
  else if(/Estimate-heavy/.test(f))focus='Make tomorrow a "known numbers" day — weighed chicken, rice, yogurt. Let the estimates rest.';
  else if(/Slept/.test(f))focus=`Protect sleep: lights out early enough for ${sleepT}h.`;
  else if(/Water/.test(f))focus='Water: 32 oz before noon, 80 by 5 PM.';
  else if(/training/.test(f))focus='Get a session in — even 30 minutes keeps the streak and the muscle.';
  else if(inProgress)focus='On track — finish the day the way you started it.';
  else focus='Clean day. Repeat it.';
  return {wins,fixes,heads,focus,inProgress};
}

// ── Weekly Review (Mon–Sun) ─────────────────────────────────
function weekStart(ds){const d=new Date(ds+'T12:00:00');const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return localDateStr(d);}
function weeklyReview(offset){
  const today=getToday();
  let ws=weekStart(today);
  ws=addDays(ws,-7*offset);
  const we=addDays(ws,6);
  const days=[];for(let i=0;i<7;i++)days.push(addDays(ws,i));
  const past=days.filter(d=>d<=today);
  const d=state.data,cfg=d.config;
  const wavg=(arr)=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null;
  const wThis=past.map(x=>d.weights[x]).filter(Boolean);
  const wPrev=days.map(x=>d.weights[addDays(x,-7)]).filter(Boolean);
  const logged=past.filter(x=>(d.meals[x]||[]).length);
  const intakeAvg=wavg(logged.map(dayIntake));
  const proAvg=wavg(logged.map(dayProtein));
  const proHit=logged.filter(x=>dayProtein(x)>=(cfg.proteinTarget||150)).length;
  const waterDays=past.filter(x=>d.water[x]);
  const waterHit=waterDays.filter(x=>d.water[x]>=(cfg.waterTarget||110)).length;
  const sleeps=past.map(x=>d.sleep[x]).filter(Boolean);
  const execs=past.map(x=>executionScore(x)).filter(Boolean).map(s=>s.score);
  const defs=logged.map(x=>dayEnergy(x)).filter(e=>e.deficit!=null);
  const defAvg=wavg(defs.map(e=>e.deficit));
  const sess={};let total=0;
  past.forEach(x=>(d.workouts[x]||[]).forEach(w=>{const t=sessionTypeOf(w);const k=t?SESSION_TYPES.find(s=>s.key===t).label:(workoutMuscles(w).some(([m])=>m==='cardio')?'Cardio':workoutMuscles(w).some(([m])=>m==='core')?'Core':'Other');sess[k]=(sess[k]||0)+1;total++;}));
  const prs=[];past.forEach(x=>prsOn(x).forEach(n=>prs.push(n)));
  const waistIn=Object.keys(d.waist||{}).filter(x=>x>=ws&&x<=we).sort();
  const thisAvg=wavg(wThis),prevAvg=wavg(wPrev);
  const change=(thisAvg!=null&&prevAvg!=null)?round1(thisAvg-prevAvg):null;
  const execAvg=execs.length?Math.round(wavg(execs)):null;
  // Focus for next week
  let focus='';
  const missingLegs=!(sess['Legs']>0);
  if(logged.length&&proHit<logged.length*0.7)focus=`Protein consistency: hit ${cfg.proteinTarget}g on 6 of 7 days.`;
  else if(defAvg!=null&&defAvg<(cfg.deficitTarget||500)*0.6)focus='Close the ledger gap: weigh add-ons and pad restaurant meals ~25% every day this week.';
  else if(missingLegs&&total)focus='Two leg days. Non-negotiable.';
  else if(sleeps.length&&wavg(sleeps.map(s=>s.hours))<(cfg.sleepTarget||7.5)-0.4)focus='Sleep: protect the window — it drives hunger and water.';
  else if(waterDays.length&&waterHit<waterDays.length*0.7)focus='Water every day — front-load before noon.';
  else focus='Same week again. Consistency is the cheat code.';
  return {ws,we,complete:we<today,daysIn:past.length,thisAvg:thisAvg!=null?round1(thisAvg):null,prevAvg:prevAvg!=null?round1(prevAvg):null,change,
    intakeAvg:intakeAvg!=null?Math.round(intakeAvg):null,proAvg:proAvg!=null?Math.round(proAvg):null,proHit,logged:logged.length,
    waterHit,waterDays:waterDays.length,sleepAvg:sleeps.length?round1(wavg(sleeps.map(s=>s.hours))):null,
    execAvg,defAvg:defAvg!=null?Math.round(defAvg):null,sess,total,prs,
    waist:waistIn.length?{first:d.waist[waistIn[0]],last:d.waist[waistIn[waistIn.length-1]]}:null,focus};
}

// ── Chart engine (canvas, time-scaled x, tap/hover tooltip) ──
const CHARTS={};
function dayNum(ds){return Math.round(new Date(ds+'T12:00:00').getTime()/864e5);}
function dayStr(n){return localDateStr(new Date(n*864e5));}
function niceTicks(min,max,n){const span=max-min||1;const step0=span/n;const mag=Math.pow(10,Math.floor(Math.log10(step0)));const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0)||10*mag;const lo=Math.floor(min/step)*step;const out=[];for(let v=lo;v<=max+1e-9;v+=step)if(v>=min-1e-9)out.push(Math.round(v*100)/100);return {ticks:out,step};}
function drawChart(id,cfg,hoverX){

  let xMin=cfg.xMin!=null?cfg.xMin:Math.min(...pts.map(p=>p.x)),xMax=cfg.xMax!=null?cfg.xMax:Math.max(...pts.map(p=>p.x));
  if(xMax===xMin){xMin-=1;xMax+=1;}
  const hasBars=cfg.series.some(s=>s.type==='bars');

  cfg.series.forEach(s=>{
    const data=s.data.filter(p=>p.y!=null&&isFinite(p.y));
    if(s.type==='bars'){
      const bw=Math.max(2,Math.min(18,pw/span*0.62));const base=toY(Math.max(yMin,0));

        const r=Math.min(3,bw/2);ctx.beginPath();ctx.moveTo(x-bw/2,top+h);ctx.lineTo(x-bw/2,top+r);ctx.quadraticCurveTo(x-bw/2,top,x-bw/2+r,top);ctx.lineTo(x+bw/2-r,top);ctx.quadraticCurveTo(x+bw/2,top,x+bw/2,top+r);ctx.lineTo(x+bw/2,top+h);ctx.closePath();ctx.fill();ctx.globalAlpha=1;});

function drawAllCharts(){
  const d=state.data,cfg=d.config,today=getToday();
  // Weight
  const range=state.wRange||'90';
  let entries=sortedWeightEntries();
  const roll=rollingAvgSeries(entries,7);
  const rmap={};roll.forEach(r=>rmap[r.date]=r.avg);
  if(range!=='all'){const cut=addDays(today,-(+range));entries=entries.filter(e=>e.date>=cut);}
  drawChart('weight-chart',{height:210,
    series:[{type:'dots',color:'#00ff9c',alpha:.6,r:2.5,data:entries.map(e=>({x:dayNum(e.date),y:e.w}))},
            {type:'line',color:'#00f0ff',width:2.5,glow:true,data:entries.map(e=>({x:dayNum(e.date),y:round1(rmap[e.date])}))}],
    refs:[{y:cfg.goalWeight,color:'#fcee0a',label:'Goal '+cfg.goalWeight}],
    yFmt:v=>Math.round(v),empty:'Log 2+ weigh-ins to see your trend',
    tip:x=>{const ds=dayStr(x);return `<b>${fmtDate(ds)}</b><span class="sw" style="background:#00ff9c"></span>${d.weights[ds]!=null?d.weights[ds]+' lb':'—'}<br><span class="sw" style="background:#00f0ff"></span>7-day ${rmap[ds]!=null?round1(rmap[ds]):'—'}`;}});
  // Strength
  const sel=state.liftSel&&allLiftHistory()[state.liftSel];
  if(sel){
    const mode=sel[sel.length-1].mode;
    const series=[{type:'line',color:'#ff2d78',width:2,points:true,data:sel.map(s=>({x:dayNum(s.date),y:s.metric}))}];
    if(mode==='load')series.push({type:'dots',color:'#00f0ff',r:3,data:sel.map(s=>({x:dayNum(s.date),y:s.topW}))});
    drawChart('lift-chart',{height:190,series,empty:'Log this lift twice to chart it',
      tip:x=>{const s=sel.find(q=>dayNum(q.date)===x);if(!s)return '';return `<b>${fmtDate(s.date)}</b>${fmtSets(s.sets,s.mode)}<br>${s.mode==='load'?'e1RM '+s.e1rm:s.mode==='assist'?'assist '+s.minAssist+' lb':'best '+s.bestReps+' reps'}`;}});
  }
  // Intake vs burn (28d)
  const days=[];for(let i=27;i>=0;i--)days.push(addDays(today,-i));
  const intakeData=days.filter(x=>(d.meals[x]||[]).length).map(x=>({x:dayNum(x),y:dayIntake(x)}));
  const maintData=days.map(x=>{const c=calibrationAt(x);return {x:dayNum(x),y:c?c.maint:null};});
  const watchData=days.filter(x=>(d.meals[x]||[]).length).map(x=>({x:dayNum(x),y:watchTdee(x).tdee}));
  drawChart('intake-chart',{height:190,yZero:false,
    series:[{type:'bars',color:'#ffb020',alpha:.75,data:intakeData},{type:'line',color:'#ff2d78',width:1.5,dash:[4,3],data:watchData},{type:'line',color:'#00f0ff',width:2.5,glow:true,data:maintData}],
    refs:[{y:cfg.calorieTarget,color:'#fcee0a',label:'Target '+cfg.calorieTarget}],xMin:dayNum(days[0]),xMax:dayNum(today),
    tip:x=>{const ds=dayStr(x);const c=calibrationAt(ds);const it=dayIntake(ds);return `<b>${fmtDate(ds)}</b><span class="sw" style="background:#ffb020"></span>ate ${it||'—'}<br><span class="sw" style="background:#00f0ff"></span>calibrated ${c?c.maint:'—'}<br><span class="sw" style="background:#ff2d78"></span>watch ${watchTdee(ds).tdee}`;}});
  // Execution (28d)
  const ex=days.map(x=>{const s=executionScore(x);return s?{x:dayNum(x),y:s.score,color:s.score>=85?'#00ff9c':s.score>=65?'#ffb020':'#ff3860'}:null;}).filter(Boolean);
  drawChart('exec-chart',{height:150,yZero:true,series:[{type:'bars',color:'#00ff9c',alpha:.85,data:ex}],refs:[{y:85,color:'#00ff9c',label:'85'}],xMin:dayNum(days[0]),xMax:dayNum(today),
    tip:x=>{const ds=dayStr(x);const s=executionScore(ds);if(!s)return `<b>${fmtDate(ds)}</b>no log`;const p=s.parts;return `<b>${fmtDate(ds)}</b>score ${s.score}<br>def ${p.deficit} · pro ${p.protein} · h2o ${p.water}<br>train ${p.training} · sleep ${p.sleep}`;}});
  // Waist
  const wd=Object.keys(d.waist||{}).sort();
  if(wd.length>=2)drawChart('waist-chart',{height:140,series:[{type:'line',color:'#00f0ff',width:2,points:true,data:wd.map(x=>({x:dayNum(x),y:d.waist[x]}))}],refs:[],yFmt:v=>v+'"',tip:x=>{const ds=dayStr(x);return `<b>${fmtDate(ds)}</b>${d.waist[ds]}"`;}});
}

function renderTrajectory(full){
  const t=getTrajectory();
  if(!t){return `<div class="card"><div class="card-title">📉 Trajectory</div><div class="empty-state">Log a few more weigh-ins to unlock your smoothed trend & projection.</div></div>`;}
  const rateColor=t.weekly<0?'var(--green)':'var(--amber)';
  const rateTxt=`${t.weekly>0?'+':''}${t.weekly}/wk`;
  const sinceTxt=`${t.sinceStartWeekly>0?'+':''}${t.sinceStartWeekly}/wk`;
  const etaTxt=t.reachedGoal?'🎯 Hit':(t.flat?'flat':(t.projGoalDate?fmtShort(t.projGoalDate):'—'));
  const onTrack=t.projGoal!=null && t.projGoal<=t.goal;
  const honeyColor=onTrack?'var(--green)':'var(--amber)';
  const gLabel=goalLabelStr();
  const hasWindow=t.etaEarly&&t.etaLate&&t.etaEarly!==t.etaLate;
  return `<div class="card"><div class="card-title">📉 Trajectory <span style="font-family:var(--font-ui);font-weight:600;color:var(--text2);font-size:11px;letter-spacing:.5px">· robust trend</span></div>
    <div class="inline-stat">
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--cyan)">${t.smoothedLatest}</div><div class="inline-stat-label">Trend wt</div></div>
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:${rateColor}">${rateTxt}</div><div class="inline-stat-label">Trend pace</div></div>
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--yellow);font-size:16px">${etaTxt}</div><div class="inline-stat-label">Hit ${t.goal}</div></div>
    </div>
    <div class="stat-row" style="margin-top:10px"><span class="stat-label">Avg since start</span><span class="stat-value" style="color:var(--text2)">${sinceTxt}</span></div>
    ${full&&hasWindow?`<div class="stat-row"><span class="stat-label">ETA window</span><span class="stat-value" style="color:var(--cyan);font-size:15px">${fmtShort(t.etaEarly)} – ${fmtShort(t.etaLate)}</span></div>`:''}
    ${t.goalTargetDate&&t.projGoal!=null?`<div class="stat-row"><span class="stat-label">Projected on ${fmtShort(t.goalTargetDate)}</span><span class="stat-value" style="color:${honeyColor}">${t.projGoal} lbs ${onTrack?'✓':'⚠'}</span></div>`:''}
    ${full&&t.daysToGoal?`<div class="stat-row"><span class="stat-label">Days to ${t.goal} at this pace</span><span class="stat-value">${t.daysToGoal}</span></div>`:''}
    ${full?`<p style="font-size:12px;color:var(--text2);margin-top:10px">${
      t.flat
        ? `Trend is flat right now. Some of that can be water — but check the calibrated deficit on the Energy card: if it's near zero, this is a real stall and the fix is the ledger (weigh add-ons, pad restaurant meals), not more cardio.`
        : (onTrack
            ? `On pace to reach ${t.goal} before your ${gLabel} date. The trend pace is a median-based (robust) fit over the last 28 days, so one salty weekend no longer throws the projection off.`
            : `Current robust pace lands you near ${t.projGoal} on your ${gLabel} date — above ${t.goal}. The trend is what your body is actually doing; close the gap through intake accuracy before adding training volume.`)
    } ${hasWindow?`<span style="color:var(--text2)">The ETA window brackets your robust recent pace against your since-start average — reality usually lands inside it.</span>`:''}</p>`:''}
  </div>`;
}

      <div class="heatmap">${cells.join('')}</div>
      <div class="heatmap-labels"><span>5 weeks ago</span><span>Today</span></div>

// Region -> which split/routines it installs. Front & back views expose different regions.
const BODY_REGIONS={
  chest:{label:'Chest & Triceps',split:'Chest & Triceps',accent:'var(--pink)'},
  back:{label:'Back & Biceps',split:'Back & Biceps',accent:'var(--cyan)'},
  shoulders:{label:'Shoulders & Arms',split:'Shoulders & Arms',accent:'var(--amber)'},
  arms:{label:'Shoulders & Arms',split:'Shoulders & Arms',accent:'var(--amber)'},
  legs:{label:'Legs',split:'Legs',accent:'var(--green)',pf:true},
  core:{label:'Core',split:null,core:true,accent:'var(--purple)'}
};
const FRONT_REGIONS=['shoulders','chest','arms','core','legs'];
const BACK_REGIONS=['back','arms','core','legs'];
function selectBodyRegion(r){ state.bodyRegion = (state.bodyRegion===r? null : r); render(); }
function setBodyView(v){ state.bodyView=v; state.bodyRegion=null; render(); }
// geometric mannequin — symmetric humanoid, tappable segments
let REC_NOW={};
function bodySVG(){
  REC_NOW=muscleRecency(getToday());
  const active=state.bodyRegion;
  const on=state.bodyView==='front'?FRONT_REGIONS:BACK_REGIONS;
  const seg=(id,pts)=>{
    const usable=on.includes(id);
    const isOn=active===id;
    const acc=BODY_REGIONS[id]?BODY_REGIONS[id].accent:'var(--cyan)';
    const rk=readiness(regionDays(id,REC_NOW,getToday())).key,rc=READY_HEX[rk];
    const fill=isOn?acc:(usable?rc+'26':'rgba(255,255,255,0.02)');
    const stroke=isOn?acc:(usable?rc+'b0':'rgba(255,255,255,0.08)');
    const style=isOn?`filter:drop-shadow(0 0 8px ${acc});`:'';
    const click=usable?`onclick="selectBodyRegion('${id}')"`:'';
    const op=isOn?'0.9':(usable?'1':'0.5');
    return `<polygon points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="1.4" ${click} style="cursor:${usable?'pointer':'default'};${style}transition:all .2s" opacity="${op}"/>`;
  };
  // coords: viewBox 0 0 220 400, center x=110
  return `<svg viewBox="0 0 220 400" width="100%" height="330" style="display:block;margin:0 auto" xmlns="http://www.w3.org/2000/svg">
    <defs><radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(0,240,255,0.05)"/><stop offset="100%" stop-color="transparent"/></radialGradient></defs>
    <rect x="0" y="0" width="220" height="400" fill="url(#bgGlow)"/>
    <!-- head + neck (visual only) -->
    <circle cx="110" cy="40" r="22" fill="rgba(255,255,255,0.02)" stroke="rgba(0,240,255,0.25)" stroke-width="1.4"/>
    <rect x="100" y="60" width="20" height="12" fill="rgba(255,255,255,0.02)" stroke="rgba(0,240,255,0.2)" stroke-width="1"/>
    ${seg('shoulders','52,74 88,68 92,90 56,96')}
    ${seg('shoulders','168,74 132,68 128,90 164,96')}
    ${seg('chest','76,92 144,92 140,140 80,140')}
    ${seg('core','82,142 138,142 132,208 88,208')}
    ${seg('arms','44,92 62,94 58,168 40,164')}
    ${seg('arms','176,92 158,94 162,168 180,164')}
    <!-- forearms visual -->
    <polygon points="40,166 56,170 50,232 36,226" fill="rgba(255,255,255,0.02)" stroke="rgba(0,240,255,0.12)" stroke-width="1"/>
    <polygon points="180,166 164,170 170,232 184,226" fill="rgba(255,255,255,0.02)" stroke="rgba(0,240,255,0.12)" stroke-width="1"/>
    ${state.bodyView==='back'?seg('back','78,92 142,92 138,204 82,204'):''}
    ${seg('legs','84,212 106,212 102,300 82,300')}
    ${seg('legs','136,212 114,212 118,300 138,300')}
    <!-- shins visual -->
    <polygon points="84,302 100,302 98,378 86,378" fill="rgba(255,255,255,0.02)" stroke="rgba(0,240,255,0.12)" stroke-width="1"/>
    <polygon points="136,302 120,302 122,378 134,378" fill="rgba(255,255,255,0.02)" stroke="rgba(0,240,255,0.12)" stroke-width="1"/>
  </svg>`;
}
function renderBodyMap(){
  const r=state.bodyRegion;
  const info=r?BODY_REGIONS[r]:null;
  let panel='';
  if(info){
    let routines=[];
    if(info.core){ routines=WORKOUTS.coreAddon.map(x=>({cat:'coreAddon',x})); }
    else if(info.split){
      const g=WORKOUTS.gym.find(gg=>gg.name===info.split);
      if(g) routines=g.routines.map(x=>({cat:'gym',x}));
      if(info.pf) routines=routines.concat(WORKOUTS.pfLegs.map(x=>({cat:'pfLegs',x})));
    }
    panel=`<div class="bm-panel">
      <div class="bm-panel-head" style="color:${info.accent}">${info.label}<span class="bm-installing">INSTALL ▸</span></div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--text2);margin:-6px 0 10px;letter-spacing:.5px">LAST TRAINED · ${(()=>{const ds=regionDays(r,muscleRecency(getToday()),getToday());return ds==null?'NEVER':ds===0?'TODAY':ds+' DAY'+(ds===1?'':'S')+' AGO';})()}</div>
      ${routines.map(({cat,x})=>`<div class="workout-card" onclick="showWorkoutDetail('${cat}','${x.id}')">

    panel=`<div class="bm-prompt">▸ Select a region to install today&#39;s work</div>`;

  return `<div class="card bm-card">

    <div class="bm-toggle">

    </div>
    <div class="workout-group">${wgTitle('home','Home','var(--cyan)')}

function renderGoals(){
  ensureGoals();
  const term=state.goalTerm||'short';
  const g=state.data.goals;
  const list=g[term]||[];
  const active=list.filter(x=>!x.done);
  const doneThis=list.filter(x=>x.done)
    .slice().sort((a,b)=>(b.completed||'').localeCompare(a.completed||''));
  const accent=term==='short'?'var(--cyan)':'var(--pink)';
  const termLabel=term==='short'?'Short-Term':'Long-Term';
  const placeholder=term==='short'?'e.g. Do one unassisted pull up':'e.g. Do 10 unassisted pull ups';
  const blurb=term==='short'
    ?'The next targets right in front of you. Knock them down one at a time.'
    :'The big ones — where all those short-term wins are taking you.';

  return `
    <div class="goal-term-switch">
      <button class="goal-term-btn ${term==='short'?'active-short':''}" onclick="setGoalTerm('short')">Short-Term</button>
      <button class="goal-term-btn ${term==='long'?'active-long':''}" onclick="setGoalTerm('long')">Long-Term</button>
    </div>

    <div class="card">
      <div class="card-title" style="color:${accent}">${termLabel} Goals</div>
      <p style="font-size:13px;color:var(--text2);margin-bottom:12px">${blurb}</p>
      ${active.length>0?active.map(goal=>`
        <div class="goal-item">
          <div class="goal-check" style="border-color:${accent}" onclick="toggleGoal('${term}','${goal.id}')"></div>
          <div class="goal-text">${escapeHTML(goal.text)}</div>
          <div class="goal-delete" onclick="deleteGoal('${term}','${goal.id}')">✕</div>
        </div>`).join(''):`<div class="empty-state">No active ${termLabel.toLowerCase()} goals yet. Add one below.</div>`}
      <div class="form-group" style="margin-top:12px">
        <input type="text" id="goal-input" placeholder="${placeholder}" maxlength="90" onkeydown="if(event.key==='Enter')addGoal()">
      </div>
      <button class="btn btn-primary" onclick="addGoal()">+ Add ${termLabel} Goal</button>
    </div>

    <div class="card">
      <div class="card-title" style="display:flex;align-items:center;gap:7px;justify-content:space-between">
        <span style="display:flex;align-items:center;gap:7px">${ICON.goals||''} Cookie Jar</span>
        <span class="jar-count">${doneThis.length} banked</span>
      </div>
      <p style="font-size:12px;color:var(--text2);margin-bottom:14px;line-height:1.5">Every goal you complete drops a cookie in the jar. When it gets hard, reach in and remember everything you've already done.</p>
      ${doneThis.length>0?`<div class="jar-wrap">${doneThis.map(goal=>{
        const col=badgeColorFor(goal.id);
        return `<span class="goal-badge" style="background:rgba(${col.rgb},.12);border:1px solid rgba(${col.rgb},.5);color:${col.hex};box-shadow:0 0 10px rgba(${col.rgb},.22)">
          <span class="gb-check">✓</span>
          <span>${escapeHTML(goal.text)}</span>
          ${goal.completed?`<span class="gb-date">${fmtShort(goal.completed)}</span>`:''}
          <span class="gb-undo" onclick="uncompleteGoal('${term}','${goal.id}')" title="Move back to active">↺</span>
        </span>`;
      }).join('')}</div>`:'<div class="empty-state">The jar is empty. Go earn your first cookie.</div>'}
    </div>`;
}

function renderSleepInsight(){
  const es=Object.keys(state.data.sleep).sort().map(d=>state.data.sleep[d]).filter(Boolean);
  if(es.length<2)return '';
  const last7=es.slice(-7);
  const avg=round1(last7.reduce((a,b)=>a+b.hours,0)/last7.length);
  const target=state.data.config.sleepTarget||7.5;
  const delta=round1(avg-target);
  const color=avg>=target?'var(--green)':avg>=target-1?'var(--amber)':'var(--red)';
  return `<div class="card"><div class="card-title">🌙 7-Day Sleep</div>
   <div class="inline-stat">
     <div class="inline-stat-item"><div class="inline-stat-num" style="color:${color}">${avg}</div><div class="inline-stat-label">Avg hrs</div></div>
     <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--cyan)">${target}</div><div class="inline-stat-label">Target</div></div>
     <div class="inline-stat-item"><div class="inline-stat-num" style="color:${color}">${delta>=0?'+':''}${delta}</div><div class="inline-stat-label">vs target</div></div>
   </div>
   <p style="font-size:12px;color:var(--text2);margin-top:10px">${avg>=target?'Dialed in. Recovery and fat loss both thank you.':`Running ${Math.abs(delta)}h under target. Closing that gap is your single highest-leverage move right now — protect the window.`}</p>
  </div>`;
}

function renderRecharge(){
  const vd=getVD();
  const sleep=state.data.sleep[vd];

  const loggedHTML=sleep?`<div class="card"><div class="card-title">Sleep Log</div>
    <div class="inline-stat">
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--cyan)">${sleep.hours}</div><div class="inline-stat-label">Hours</div></div>

      <div class="inline-stat-item"><div class="inline-stat-num" style="color:${sleep.energy>=4?'var(--green)':sleep.energy>=2?'var(--amber)':'var(--red)'}">${['','😴','😐','🙂','😊','⚡'][sleep.energy]||'—'}</div><div class="inline-stat-label">Energy</div></div>
    </div>
    <button class="btn btn-secondary btn-sm" style="margin-top:12px" onclick="delete state.data.sleep['${vd}'];save();render()">Re-log</button>
  </div>`:`<div class="card"><div class="card-title">Log Sleep</div>
    <div class="form-group"><label>Hours slept</label><input type="number" id="sleep-hours" placeholder="7.5" step="0.5" min="0" max="16" inputmode="decimal"></div>
    <div class="form-group"><label>Sleep quality</label><div class="quality-stars" id="quality-stars">${[1,2,3,4,5].map(i=>`<span class="star" onclick="setSleepQuality(${i})" data-star="${i}">⭐</span>`).join('')}</div></div>
    <div class="form-group"><label>Morning energy level</label><div class="energy-selector">${[{v:1,l:'😴 Dead'},{v:2,l:'😐 Low'},{v:3,l:'🙂 OK'},{v:4,l:'😊 Good'},{v:5,l:'⚡ Wired'}].map(e=>`<div class="energy-btn" onclick="setEnergy(${e.v})" data-energy="${e.v}">${e.l}</div>`).join('')}</div></div>
    <button class="btn btn-primary" onclick="logSleep()">Log Sleep</button>
  </div>`;

  const sleepDates=Object.keys(state.data.sleep).sort().reverse().slice(0,14);
  const histHTML=sleepDates.map(d=>{const s=state.data.sleep[d];if(!s)return '';return `<div class="log-entry"><span>${fmtDate(d)}</span><span>${s.hours}h · ${'⭐'.repeat(s.quality)} · ${['','😴','😐','🙂','😊','⚡'][s.energy]||''}</span></div>`;}).join('');
  const allSleep=Object.values(state.data.sleep).filter(s=>s);
  const avgH=allSleep.length>0?round1(allSleep.reduce((s,v)=>s+v.hours,0)/allSleep.length):'—';
  const avgQ=allSleep.length>0?round1(allSleep.reduce((s,v)=>s+v.quality,0)/allSleep.length):'—';
  const avgE=allSleep.length>0?round1(allSleep.reduce((s,v)=>s+v.energy,0)/allSleep.length):'—';

  return `
    ${renderDateNav()}
    ${loggedHTML}
    ${renderSleepInsight()}
    ${allSleep.length>1?`<div class="card"><div class="card-title">All-Time Averages</div><div class="inline-stat">
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--cyan)">${avgH}</div><div class="inline-stat-label">Avg hours</div></div>
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--amber)">${avgQ}</div><div class="inline-stat-label">Avg quality</div></div>
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--green)">${avgE}</div><div class="inline-stat-label">Avg energy</div></div>
    </div></div>`:''}
    ${histHTML?`<div class="card"><div class="card-title">Sleep History</div>${histHTML}</div>`:''}`;
}

// Suggests a phase from the smoothed trend weight vs the user's targets.
function getPhaseStatus(){
  const cur=(state.data.config.phase)||'cut';
  const t=getTrajectory();
  const goal=state.data.config.goalWeight;
  const lean=state.data.config.leanTarget||Math.max(goal-40,200);
  const trend=t?t.smoothedLatest:getLatestWeight();
  let suggested=cur, reason='';
  if(trend!=null){
    // Once the trend is at/below the "reveal" (lean) weight, it's time to stop cutting.
    if(trend<=lean){ suggested='maintain'; reason=`Trend weight (${trend}) reached your reveal target (${lean}). Time to stop cutting — hold here, then build.`; }
    else { suggested='cut'; reason=`${round1(trend-lean)} lbs of trend weight to your reveal target (${lean}).`; }
  }
  const canFlip=suggested!==cur;
  // progress from start weight → lean target
  const start=state.data.config.startWeight||trend;
  const pct=(trend!=null&&start>lean)?Math.max(0,Math.min(100,round1(((start-trend)/(start-lean))*100))):0;
  return {cur,suggested,canFlip,reason,trend,lean,goal,pct};
}
function setPhase(p){ if(PHASES[p]){ state.data.config.phase=p; save(); render(); } }
function renderPhase(){
  const s=getPhaseStatus();
  const P=PHASES[s.cur]||PHASES.cut;
  return `<div class="card phase-card">
    <div class="card-title" style="display:flex;align-items:center;gap:7px;color:${P.color}">${ICON.phase} Phase</div>
    <div class="phase-head">
      <div>
        <div class="phase-label" style="color:${P.color};text-shadow:0 0 14px ${P.color}">${P.label}</div>
        <div class="phase-tag">${P.tag}</div>
      </div>
      <div class="phase-track">
        <div class="phase-track-bar"><div class="phase-track-fill" style="width:${s.pct}%;background:${P.color};box-shadow:0 0 10px ${P.color}"></div></div>
        <div class="phase-track-cap">${s.pct}% to reveal · ${s.lean} lbs</div>
      </div>
    </div>
    <p class="phase-blurb">${P.blurb}</p>
    <div class="phase-guide">${P.guide}</div>
    ${s.canFlip?`<div class="phase-flip">
        <div class="phase-flip-msg">${ICON.phase}<span>Suggested: flip to <b style="color:${PHASES[s.suggested].color}">${PHASES[s.suggested].label}</b> — ${s.reason}</span></div>
        <button class="btn btn-primary btn-sm" style="width:100%;margin-top:8px" onclick="setPhase('${s.suggested}')">Flip to ${PHASES[s.suggested].label}</button>
      </div>`:`<div class="phase-next">On track · ${s.reason}</div>`}
    <div class="phase-switch">
      ${Object.values(PHASES).map(x=>`<button class="phase-pill ${s.cur===x.key?'active':''}" style="${s.cur===x.key?`border-color:${x.color};color:${x.color}`:''}" onclick="setPhase('${x.key}')">${x.label}</button>`).join('')}
    </div>
  </div>`;
}

function jumpToDate(){

function logWeight(){
  const v=parseFloat(document.getElementById('weight-in')?.value);
  if(!v||v<50||v>600)return;
  // v10 sanity guard: flag any entry that differs from the most recent weigh-in by >5 lb
  const vdW=getVD();
  const dates=Object.keys(state.data.weights).filter(d=>d!==vdW&&d<=vdW).sort();
  if(dates.length){
    const last=state.data.weights[dates[dates.length-1]];
    const diff=Math.abs(round1(v)-last);
    if(diff>5){
      if(!confirm(`That's ${diff.toFixed(1)} lb from your last weigh-in (${last}). Did you mean ${round1(v)}?\n\nTap OK to save it, Cancel to fix.`))return;
    }
  }
  state.data.weights[getVD()]=round1(v);
  state.editWeight=false;
  save();render();
}
function deleteWeight(){
  if(!confirm('Delete this weigh-in?'))return;
  delete state.data.weights[getVD()];state.editWeight=false;save();render();

function logActive(){
  const vd=getVD();

function showWorkoutDetail(category,id){
  let workout=null;
  if(category==='gym'){for(const g of WORKOUTS.gym){const f=g.routines.find(r=>r.id===id);if(f){workout={...f,groupName:g.name};break;}}}
  else if(category==='cardio')workout=WORKOUTS.cardio.find(c=>c.id===id);
  else if(category==='home')workout=WORKOUTS.home.find(c=>c.id===id);
  else if(category==='coreAddon'){workout=WORKOUTS.coreAddon.find(c=>c.id===id);if(workout)workout={...workout,isCore:true};}
  else if(category==='pfLegs')workout=WORKOUTS.pfLegs.find(c=>c.id===id);
  else if(category==='golfPower')workout=WORKOUTS.golfPower.find(c=>c.id===id);
  else if(category==='travel')workout=WORKOUTS.travel.find(c=>c.id===id);
  if(workout){state.selectedWorkout=workout;state.modal='workout-detail';render();}
}

      if(imp.config||imp.weights){
        const def=defaults();
        state.data={
          config:{...def.config,...(state.data.config||{}),...(imp.config||{})},
          weights:{...(state.data.weights||{}),...(imp.weights||{})},
          meals:{...(state.data.meals||{}),...(imp.meals||{})},
          workouts:{...(state.data.workouts||{}),...(imp.workouts||{})},
          focus:{...(state.data.focus||{}),...(imp.focus||{})},
          sleep:{...(state.data.sleep||{}),...(imp.sleep||{})},
          water:{...(state.data.water||{}),...(imp.water||{})},
          active:{...(state.data.active||{}),...(imp.active||{})},
          waist:{...(state.data.waist||{}),...(imp.waist||{})},
          resting:{...(state.data.resting||{}),...(imp.resting||{})},
          lifts:(()=>{const a=state.data.lifts||{},b=imp.lifts||{},o={...a};Object.keys(b).forEach(d=>{o[d]={...(a[d]||{}),...b[d]};});return o;})(),
          photos:[...(Array.isArray(state.data.photos)?state.data.photos:[]),...(Array.isArray(imp.photos)?imp.photos:[])].map(p=>(p&&p.id)?p:{...p,id:genPhotoId(p&&p.ts)}),
          favorites:(Array.isArray(imp.favorites)&&imp.favorites.length)?imp.favorites:(Array.isArray(state.data.favorites)?state.data.favorites:[]),
          goals:{
            short:mergeGoals((state.data.goals||{}).short,(imp.goals||{}).short),
            long:mergeGoals((state.data.goals||{}).long,(imp.goals||{}).long)
          }
        };
        save();render();
        if(photosInIDB)idbPutAll(state.data.photos).catch(()=>{});
        alert('Data imported successfully!');
      }else{alert('Invalid backup file.');}
    }catch(err){alert('Error reading file.');}
  };
  reader.readAsText(file);
  e.target.value='';
}
