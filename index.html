// ACTIONS
// ═══════════════════════════════════════════
function setTab(t){state.tab=t;state.modal=null;render();}
function showModal(m){state.modal=m;render();}
function closeModal(){state.modal=null;state.selectedWorkout=null;render();}

function jumpToDate(){
  const v=document.getElementById('date-pick')?.value;
  if(v&&v<=getToday()){state.viewDate=v;closeModal();}
}

function logWeight(){
  const v=parseFloat(document.getElementById('weight-in')?.value);
  if(!v||v<50||v>600)return;
  state.data.weights[getVD()]=round1(v);
  save();render();
}

function saveMeal(){
  const name=document.getElementById('meal-name')?.value?.trim();
  const cal=parseInt(document.getElementById('meal-cal')?.value)||0;
  const pro=parseInt(document.getElementById('meal-pro')?.value)||0;
  const fav=document.getElementById('meal-fav')?.checked;
  if(!name)return;
  const vd=getVD();
  if(!state.data.meals[vd])state.data.meals[vd]=[];
  state.data.meals[vd].push({name,calories:cal,protein:pro});
  if(fav)addFavorite(name,cal,pro);
  save();closeModal();
}

function deleteMeal(i){
  const vd=getVD();
  if(state.data.meals[vd]){state.data.meals[vd].splice(i,1);save();render();}
}

function showWorkoutDetail(category,id){
  let workout=null;
  if(category==='gym'){for(const g of WORKOUTS.gym){const f=g.routines.find(r=>r.id===id);if(f){workout={...f,groupName:g.name};break;}}}
  else if(category==='cardio')workout=WORKOUTS.cardio.find(c=>c.id===id);
  else if(category==='home')workout=WORKOUTS.home.find(c=>c.id===id);
  else if(category==='coreAddon'){workout=WORKOUTS.coreAddon.find(c=>c.id===id);if(workout)workout={...workout,isCore:true};}
  if(workout){state.selectedWorkout=workout;state.modal='workout-detail';render();}
}

function logWorkout(){
  const w=state.selectedWorkout;if(!w)return;
  const dur=parseInt(document.getElementById('log-duration')?.value)||0;
  const cal=parseInt(document.getElementById('log-calories')?.value)||0;
  const vd=getVD();
  if(!state.data.workouts[vd])state.data.workouts[vd]=[];
  state.data.workouts[vd].push({name:w.groupName||w.name,routine:w.groupName?w.name:'',duration:dur,calories:cal,isCore:w.isCore||false});
  save();closeModal();
}

function deleteWorkout(date,i){
  if(state.data.workouts[date]){
    state.data.workouts[date].splice(i,1);
    if(state.data.workouts[date].length===0)delete state.data.workouts[date];
    save();render();
  }
}

function addFocus(){
  const input=document.getElementById('focus-input');
  const text=input?.value?.trim();if(!text)return;
  const vd=getVD();
  if(!state.data.focus[vd])state.data.focus[vd]=[];
  if(state.data.focus[vd].length>=3)return;
  state.data.focus[vd].push({text,done:false});
  save();render();
}

function toggleFocus(i){
  const vd=getVD();
  if(state.data.focus[vd]&&state.data.focus[vd][i]){state.data.focus[vd][i].done=!state.data.focus[vd][i].done;save();render();}
}

function deleteFocus(i){
  const vd=getVD();
  if(state.data.focus[vd]){state.data.focus[vd].splice(i,1);save();render();}
}

function setSleepQuality(n){
  tempSleepQuality=n;
  document.querySelectorAll('.star').forEach(s=>{s.classList.toggle('filled',parseInt(s.dataset.star)<=n);});
}

function setEnergy(n){
  tempEnergy=n;
  document.querySelectorAll('.energy-btn').forEach(b=>{b.classList.toggle('active',parseInt(b.dataset.energy)===n);});
}

function logSleep(){
  const hours=parseFloat(document.getElementById('sleep-hours')?.value);
  if(!hours||hours<0||hours>16)return;if(!tempSleepQuality||!tempEnergy)return;
  state.data.sleep[getVD()]={hours:round1(hours),quality:tempSleepQuality,energy:tempEnergy};
  tempSleepQuality=0;tempEnergy=0;save();render();
}

function exportData(){
  const blob=new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`lockin-backup-${getToday()}.json`;a.click();URL.revokeObjectURL(url);
}

function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const imp=JSON.parse(ev.target.result);
      if(imp.config||imp.weights){
        const def=defaults();
        state.data={
          config:{...def.config,...(state.data.config||{}),...(imp.config||{})},
          weights:{...(state.data.weights||{}),...(imp.weights||{})},
          meals:{...(state.data.meals||{}),...(imp.meals||{})},
          workouts:{...(state.data.workouts||{}),...(imp.workouts||{})},
          focus:{...(state.data.focus||{}),...(imp.focus||{})},
          sleep:{...(state.data.sleep||{}),...(imp.sleep||{})},
          water:{...(state.data.water||{}),...(imp.water||{})},
          photos:[...(Array.isArray(state.data.photos)?state.data.photos:[]),...(Array.isArray(imp.photos)?imp.photos:[])].map(p=>(p&&p.id)?p:{...p,id:genPhotoId(p&&p.ts)}),
          favorites:(Array.isArray(imp.favorites)&&imp.favorites.length)?imp.favorites:(Array.isArray(state.data.favorites)?state.data.favorites:[])
        };
        save();render();
        if(photosInIDB)idbPutAll(state.data.photos).catch(()=>{});
        alert('Data imported successfully!');
      }else{alert('Invalid backup file.');}
    }catch(err){alert('Error reading file.');}
  };
  reader.readAsText(file);
  e.target.value='';
}

function photoWeek(date){return Math.max(1,Math.ceil((daysBetween('2026-07-08',date)+1)/7))}

const POSES=['Front relaxed','Front flexed','Side relaxed','Side flexed','Back relaxed','Back flexed','45° pose'];

// ── Photo filtering: pose (single-select) + weeks (multi-select) ──
function photoWeekOf(p){return p.week||photoWeek(p.date||'2026-07-08');}
function filteredPhotos(){
  const photos=state.data.photos||[];
  const pose=state.photoFilter||'all';
  const weeks=Array.isArray(state.photoWeeks)?state.photoWeeks:[];
  return photos.map((p,i)=>({...p,_idx:i}))
    .filter(p=>pose==='all'||p.position===pose)
    .filter(p=>weeks.length===0||weeks.includes(photoWeekOf(p)));
}
function setPhotoFilter(f){state.photoFilter=f;render();}
function togglePhotoWeek(wk){
  if(!Array.isArray(state.photoWeeks))state.photoWeeks=[];
  const i=state.photoWeeks.indexOf(wk);
  if(i>=0)state.photoWeeks.splice(i,1); else state.photoWeeks.push(wk);
  render();
}
function clearPhotoWeeks(){state.photoWeeks=[];render();}

function renderPhotos(){
  const photos=state.data.photos||[];
  const latestW=getLatestWeight();
  const curWeek=photoWeek(getToday());
  const filter=state.photoFilter||'all';

  // Edit modal
  if(state.editingPhoto>=0&&photos[state.editingPhoto]){
    const p=photos[state.editingPhoto];
    const idx=state.editingPhoto;
    return `<div class="card">
      <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">Edit Photo <span style="cursor:pointer;font-size:18px;color:var(--text2)" onclick="state.editingPhoto=-1;render()">✕</span></div>
      <div style="text-align:center;margin-bottom:12px"><img src="${p.data}" style="max-width:100%;max-height:300px;border-radius:10px;object-fit:contain" alt=""></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="form-group"><label>Date</label><input type="date" id="edit-date" value="${p.date||''}" max="${getToday()}"></div>
        <div class="form-group"><label>Week</label><input type="number" id="edit-week" value="${p.week||photoWeek(p.date||'2026-07-08')}" min="1" max="52" inputmode="numeric"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="form-group"><label>Weight (lbs)</label><input type="number" id="edit-weight" value="${p.weight||''}" step="0.1" inputmode="decimal"></div>
        <div class="form-group"><label>Pose</label><select id="edit-position">${['<option value="">Select...</option>',...POSES.map(ps=>`<option value="${ps}" ${p.position===ps?'selected':''}>${ps}</option>`)].join('')}</select></div>
      </div>
      <div class="form-group"><label>Note</label><input type="text" id="edit-note" value="${p.note||''}" maxlength="80"></div>
      <button class="btn btn-primary" onclick="savePhotoEdit(${idx})">Save Changes</button>
      <button class="btn btn-danger btn-sm" style="margin-top:8px;width:100%" onclick="deletePhoto(${idx})">Delete Photo</button>
    </div>`;
  }

  // Weeks available for the currently-selected pose (so we never show empty week pills)
  const poseSet=photos.filter(p=>filter==='all'||p.position===filter);
  const availableWeeks=[...new Set(poseSet.map(photoWeekOf))].sort((a,b)=>a-b);

  // Prune any selected weeks that no longer apply to the current pose (prevents a stuck filter)
  let weeksSel=Array.isArray(state.photoWeeks)?state.photoWeeks:[];
  const pruned=weeksSel.filter(w=>availableWeeks.includes(w));
  if(pruned.length!==weeksSel.length){state.photoWeeks=pruned;weeksSel=pruned;}

  const filtered=filteredPhotos();
  const anyFilter=filter!=='all'||weeksSel.length>0;

  // Group by week
  const byWeek={};
  filtered.forEach(p=>{
    const wk=photoWeekOf(p);
    if(!byWeek[wk])byWeek[wk]=[];
    byWeek[wk].push(p);
  });
  const weekNums=Object.keys(byWeek).map(Number).sort((a,b)=>a-b);

  const galleryHTML=weekNums.map(wk=>{
    const wkPhotos=byWeek[wk].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    return `<div style="margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-family:var(--font-ui);font-size:15px;font-weight:700;color:var(--cyan);letter-spacing:1px">WEEK ${wk}</span>
        <span style="font-size:12px;color:var(--text2)">${wkPhotos.length} photo${wkPhotos.length!==1?'s':''}</span>
      </div>
      <div class="photo-grid">${wkPhotos.map(p=>`<div class="photo-card">
        <img src="${p.data}" onclick="viewPhoto(${p._idx})" alt="">
        <div class="photo-card-info">
          <div class="photo-card-date">${p.date?fmtDate(p.date):'No date'}</div>
          ${p.weight?`<div class="photo-card-note">${p.weight} lbs${p.position?' · '+p.position:''}</div>`:p.position?`<div class="photo-card-note">${p.position}</div>`:''}
          ${p.note?`<div class="photo-card-note">${p.note}</div>`:''}
          <div style="display:flex;gap:8px;margin-top:4px">
            <div class="photo-card-delete" onclick="state.editingPhoto=${p._idx};render()">✏️ Edit</div>
            <div class="photo-card-delete" onclick="deletePhoto(${p._idx})">✕ Delete</div>
          </div>
        </div>
      </div>`).join('')}</div>
    </div>`;
  }).join('');

  // Pose filter pills (single-select)
  const posePills=['all',...POSES].map(f=>{
    const label=f==='all'?'All':f;
    const count=f==='all'?photos.length:photos.filter(p=>p.position===f).length;
    if(f!=='all'&&count===0)return '';
    return `<button class="pill ${filter===f?'active-pose':''}" onclick="setPhotoFilter('${f}')">${label}${f!=='all'?' ('+count+')':''}</button>`;
  }).filter(Boolean).join('');

  // Week filter pills (multi-select) — only meaningful when the pose spans 2+ weeks
  const weekPills=availableWeeks.length>1?`
    <div class="pill-label">Weeks · tap to compare</div>
    <div class="pill-row">
      <button class="pill ${weeksSel.length===0?'active-week':''}" onclick="clearPhotoWeeks()">All</button>
      ${availableWeeks.map(wk=>{
        const on=weeksSel.includes(wk);
        const c=poseSet.filter(p=>photoWeekOf(p)===wk).length;
        return `<button class="pill ${on?'active-week':''}" onclick="togglePhotoWeek(${wk})">W${wk} (${c})</button>`;
      }).join('')}
    </div>`:'';

  return `
    <div class="card">
      <div class="card-title">Add Progress Photo</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="form-group"><label>Date</label><input type="date" id="photo-date" value="${getVD()}" max="${getToday()}"></div>
        <div class="form-group"><label>Week</label><input type="number" id="photo-week" value="${curWeek}" min="1" max="52" inputmode="numeric"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="form-group"><label>Weight (lbs)</label><input type="number" id="photo-weight" value="${latestW||''}" step="0.1" inputmode="decimal" placeholder="${latestW||'---'}"></div>
        <div class="form-group"><label>Pose</label><select id="photo-position">${['<option value="">Select...</option>',...POSES.map(ps=>`<option value="${ps}">${ps}</option>`)].join('')}</select></div>
      </div>
      <div class="form-group"><label>Note (optional)</label><input type="text" id="photo-note" placeholder="e.g. Post-workout, morning, etc." maxlength="80"></div>
      <div style="display:flex;gap:8px">
        <label class="btn btn-primary" style="text-align:center;flex:1;cursor:pointer">
          📷 Take Photo
          <input type="file" accept="image/*" capture="environment" style="display:none" onchange="capturePhoto(event)">
        </label>
        <label class="btn btn-secondary" style="text-align:center;flex:1;cursor:pointer">
          🖼 Upload
          <input type="file" accept="image/*" style="display:none" onchange="capturePhoto(event)">
        </label>
      </div>
    </div>
    ${photos.length>0?`<div class="card"><div class="card-title" style="margin-bottom:8px">Gallery (${anyFilter?filtered.length+'/'+photos.length:photos.length})</div>
      <div class="pill-label">Pose</div>
      <div class="pill-row">${posePills}</div>
      ${weekPills}
      ${filtered.length>0?galleryHTML:'<div class="empty-state">No photos match this filter. Try "All" weeks or a different pose.</div>'}
    </div>`:'<div class="card"><div class="empty-state">No photos yet. Take your first progress photo — future you will thank you.</div></div>'}`;
}

function savePhotoEdit(i){
  const p=state.data.photos[i];if(!p)return;
  p.date=document.getElementById('edit-date')?.value||p.date;
  p.week=parseInt(document.getElementById('edit-week')?.value)||p.week;
  p.weight=parseFloat(document.getElementById('edit-weight')?.value)||null;
  p.position=document.getElementById('edit-position')?.value||'';
  p.note=document.getElementById('edit-note')?.value?.trim()||'';
  if(!p.id)p.id=genPhotoId(p.ts);
  state.editingPhoto=-1;
  render();
  if(photosInIDB)persistPhoto(p); else save();
}

function capturePhoto(e){
  const file=e.target.files[0];if(!file)return;
  const date=document.getElementById('photo-date')?.value||getToday();
  const week=parseInt(document.getElementById('photo-week')?.value)||photoWeek(date);
  const weight=parseFloat(document.getElementById('photo-weight')?.value)||null;
  const position=document.getElementById('photo-position')?.value||'';
  const note=document.getElementById('photo-note')?.value?.trim()||'';
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement('canvas');
      const maxW=800,maxH=1200;
      let w=img.width,h=img.height;
      if(w>maxW){h=h*(maxW/w);w=maxW;}
      if(h>maxH){w=w*(maxH/h);h=maxH;}
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      const data=canvas.toDataURL('image/jpeg',0.7);
      if(!Array.isArray(state.data.photos))state.data.photos=[];
      const photo={id:genPhotoId(),data,date,week,weight,position,note,ts:Date.now()};
      state.data.photos.push(photo);
      render();
      if(photosInIDB)persistPhoto(photo); else save();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value='';
}

function deletePhoto(i){
  if(confirm('Delete this photo?')){
    const p=state.data.photos[i];
    state.data.photos.splice(i,1);state.editingPhoto=-1;
    render();
    if(photosInIDB&&p&&p.id)idbDelete(p.id).catch(()=>{}); else save();
  }
}

function viewPhoto(i){
  const photos=state.data.photos;const p=photos[i];if(!p)return;
  const filter=state.photoFilter||'all';
  const weeksSel=Array.isArray(state.photoWeeks)?state.photoWeeks:[];

  // Build navigable list from the SAME filter as the gallery, sorted chronologically
  const navList=filteredPhotos().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.ts||0)-(b.ts||0));
  let pos=navList.findIndex(ph=>ph._idx===i);
  if(pos<0)pos=0;

  const filterTag=(filter!=='all'?' · '+filter:'')+(weeksSel.length?' · W'+[...weeksSel].sort((a,b)=>a-b).join(',W'):'');

  const overlay=document.createElement('div');
  overlay.className='photo-full-overlay';
  document.body.appendChild(overlay);

  function showAt(p2){
    const ph=navList[p2];if(!ph)return;
    const idx=ph._idx;
    overlay.innerHTML=`
      <div class="photo-full-close" onclick="this.parentElement.remove()">✕</div>
      ${navList.length>1?`<div style="position:absolute;top:50%;left:8px;transform:translateY(-50%);font-size:36px;color:rgba(255,255,255,${p2>0?'0.8':'0.15'});cursor:pointer;padding:8px;user-select:none;-webkit-user-select:none;z-index:2" onclick="event.stopPropagation();photoNav(-1)">‹</div>`:''}
      ${navList.length>1?`<div style="position:absolute;top:50%;right:8px;transform:translateY(-50%);font-size:36px;color:rgba(255,255,255,${p2<navList.length-1?'0.8':'0.15'});cursor:pointer;padding:8px;user-select:none;-webkit-user-select:none;z-index:2" onclick="event.stopPropagation();photoNav(1)">›</div>`:''}
      <img src="${ph.data}" style="pointer-events:none">
      <div style="color:rgba(255,255,255,.5);font-family:var(--font-mono);font-size:12px;margin-top:8px">${p2+1} / ${navList.length}${filterTag}</div>
      <div style="color:#fff;margin-top:4px;text-align:center;font-size:14px">
        ${ph.date?fmtDate(ph.date):''}${ph.week?' · Week '+ph.week:''}
        ${ph.weight?' · '+ph.weight+' lbs':''}${ph.position?' · '+ph.position:''}
        ${ph.note?'<br>'+ph.note:''}
      </div>
      <div style="display:flex;gap:10px;margin-top:10px">
        <button style="background:var(--surface2);border:1px solid var(--border);color:var(--cyan);padding:8px 16px;border-radius:6px;font-size:14px;cursor:pointer" onclick="this.closest('.photo-full-overlay').remove();state.editingPhoto=${idx};render()">✏️ Edit</button>
        <button style="background:var(--surface2);border:1px solid var(--border);color:#fff;padding:8px 16px;border-radius:6px;font-size:14px;cursor:pointer" onclick="this.closest('.photo-full-overlay').remove()">Close</button>
      </div>`;
  }

  // Navigation function attached to window for onclick access
  window.photoNav=function(dir){
    const next=pos+dir;
    if(next>=0&&next<navList.length){pos=next;showAt(pos);}
  };

  // Touch swipe
  let touchX=0;
  overlay.addEventListener('touchstart',function(e){touchX=e.touches[0].clientX;},{passive:true});
  overlay.addEventListener('touchend',function(e){
    const diff=e.changedTouches[0].clientX-touchX;
    if(Math.abs(diff)>50){
      if(diff<0&&pos<navList.length-1){pos++;showAt(pos);}
      else if(diff>0&&pos>0){pos--;showAt(pos);}
    }
  });

  overlay.onclick=function(e){if(e.target===overlay)overlay.remove();};
  showAt(pos);
}

// ═══════════════════════════════════════════
// CHART — raw dailies + 7-day rolling average
// ═══════════════════════════════════════════
function drawWeightChart(){
  const canvas=document.getElementById('weight-chart');if(!canvas)return;
  const ctx=canvas.getContext('2d');const dpr=window.devicePixelRatio||1;
  const rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=210*dpr;
  canvas.style.width=rect.width+'px';canvas.style.height='210px';
  ctx.scale(dpr,dpr);
  const W=rect.width,H=210,pad={top:20,right:15,bottom:30,left:45};
  const dates=Object.keys(state.data.weights).sort();
  if(dates.length<2){ctx.fillStyle='#8790b8';ctx.font='14px monospace';ctx.textAlign='center';ctx.fillText('Log 2+ weigh-ins to see trend',W/2,H/2);return;}
  const vals=dates.map(d=>state.data.weights[d]);
  // 7-day rolling average aligned per entry
  const roll=vals.map((v,i)=>{const s=Math.max(0,i-6);const sl=vals.slice(s,i+1);return sl.reduce((a,b)=>a+b,0)/sl.length;});
  const goal=state.data.config.goalWeight;const allV=[...vals,...roll,goal];
  const minV=Math.min(...allV)-5,maxV=Math.max(...allV)+5;
  const xS=(W-pad.left-pad.right)/(dates.length-1);
  const yS=(H-pad.top-pad.bottom)/(maxV-minV);
  const toX=i=>pad.left+i*xS,toY=v=>pad.top+(maxV-v)*yS;

  // gridlines
  ctx.strokeStyle='rgba(40,48,77,.6)';ctx.lineWidth=0.5;
  for(let i=0;i<=5;i++){const v=minV+((maxV-minV)/5)*i;const y=toY(v);ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(W-pad.right,y);ctx.stroke();ctx.fillStyle='#64748b';ctx.font='11px monospace';ctx.textAlign='right';ctx.fillText(Math.round(v),pad.left-8,y+4);}

  // goal line (yellow dashed)
  const gy=toY(goal);ctx.strokeStyle='rgba(252,238,10,.6)';ctx.lineWidth=1;ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(pad.left,gy);ctx.lineTo(W-pad.right,gy);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#fcee0a';ctx.font='11px monospace';ctx.textAlign='left';ctx.fillText('Goal '+goal,W-pad.right-58,gy-6);

  // raw daily — faint line + small dots (the noise)
  ctx.strokeStyle='rgba(0,255,156,.28)';ctx.lineWidth=1.5;ctx.beginPath();
  vals.forEach((v,i)=>{const x=toX(i),y=toY(v);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();
  vals.forEach((v,i)=>{const x=toX(i),y=toY(v);ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fillStyle='rgba(0,255,156,.55)';ctx.fill();});

  // 7-day rolling average — bold cyan line (the signal)
  ctx.strokeStyle='#00f0ff';ctx.lineWidth=2.5;ctx.shadowColor='rgba(0,240,255,.5)';ctx.shadowBlur=6;ctx.beginPath();
  roll.forEach((v,i)=>{const x=toX(i),y=toY(v);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();ctx.shadowBlur=0;
  // endpoint marker
  const li=roll.length-1;ctx.beginPath();ctx.arc(toX(li),toY(roll[li]),4,0,Math.PI*2);ctx.fillStyle='#00f0ff';ctx.fill();ctx.strokeStyle='#05060a';ctx.lineWidth=2;ctx.stroke();

  // x labels
  ctx.fillStyle='#64748b';ctx.font='10px monospace';ctx.textAlign='center';
  const ls=Math.max(1,Math.floor(dates.length/5));
  dates.forEach((d,i)=>{if(i%ls===0||i===dates.length-1)ctx.fillText(d.slice(5),toX(i),H-8);});
}

// ═══════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════
function render(){
  const app=document.getElementById('app');
  const dtg=daysToGoalDate();const gl=goalLabelStr();
  const subTxt=dtg==null?'set your goal date in stats':(dtg>0?dtg+' days to '+gl:(dtg===0?gl+' is today 🎯':gl+' date has passed'));
  const tabsHTML=TABS.map(t=>`<button class="tab-btn ${state.tab===t?'active':''}" onclick="setTab('${t}')"><span class="tab-icon">${TAB_ICONS[t]}</span>${TAB_LABELS[t]}</button>`).join('');

  let content='';
  switch(state.tab){
    case'today':content=renderToday();break;
    case'fuel':content=renderFuel();break;
    case'train':content=renderTrain();break;
    case'focus':content=renderFocus();break;
    case'recharge':content=renderRecharge();break;
    case'photos':content=renderPhotos();break;
    case'stats':content=renderStats();break;
  }

  app.innerHTML=`
    <div class="hdr"><div class="hdr-title">LOCK IN</div><div class="hdr-sub">${subTxt}</div></div>
    <div class="content">${content}</div>
    <div class="tabs">${tabsHTML}</div>
    ${renderModal()}`;

  if(state.tab==='stats')setTimeout(drawWeightChart,50);
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
async function initPhotos(){
  try{
    let idbPhotos=await idbAll();
    const lsPhotos=Array.isArray(state.data.photos)?state.data.photos:[];
    // One-time migration: photos still living in localStorage move into IndexedDB
    if(idbPhotos.length===0 && lsPhotos.length>0){
      const withIds=lsPhotos.map(p=>({...p,id:p.id||genPhotoId(p.ts)}));
      await idbPutAll(withIds);
      idbPhotos=withIds;
    }
    idbPhotos=idbPhotos.map(p=>p.id?p:{...p,id:genPhotoId(p.ts)});
    idbPhotos.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.ts||0)-(b.ts||0));
    state.data.photos=idbPhotos;
    photosInIDB=true;
    save(); // rewrite localStorage WITHOUT photos — frees the ~5MB quota for good
  }catch(e){
    console.warn('LOCK IN: IndexedDB unavailable, keeping photos in localStorage',e);
    if(!Array.isArray(state.data.photos))state.data.photos=[];
    photosInIDB=false;
  }
}
async function boot(){
  load();
  render();            // paint immediately
  await initPhotos();  // migrate/load photos out of localStorage
  render();            // repaint with photos from IndexedDB
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').then(reg=>{if(reg&&reg.update)reg.update();}).catch(()=>{});
  }
}
boot();
</script>
