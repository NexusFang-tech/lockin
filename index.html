<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060a">
<title>LOCK IN</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#05060a;--surface:#0d0f1a;--surface2:#161a2b;--border:#28304d;
  --text:#e9ecff;--text2:#8790b8;
  --yellow:#fcee0a;--cyan:#00f0ff;--pink:#ff2d78;--magenta:#ff00ff;
  --green:#00ff9c;--green2:#00c47a;--amber:#ffb020;--red:#ff3860;--purple:#b026ff;--blue:#3b82f6;
  --font-display:'Orbitron','Segoe UI',system-ui,sans-serif;
  --font-ui:'Rajdhani','Segoe UI',system-ui,sans-serif;
  --font-mono:'Share Tech Mono','Consolas',monospace;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:
  radial-gradient(1200px 620px at 50% -12%,rgba(252,238,10,.05),transparent 60%),
  radial-gradient(900px 560px at 100% 108%,rgba(255,45,120,.06),transparent 60%),
  var(--bg);
  color:var(--text);min-height:100dvh;overflow-x:hidden;padding-bottom:82px}
body::before{content:'';position:fixed;inset:0;background-image:
  linear-gradient(rgba(0,240,255,.035) 1px,transparent 1px),
  linear-gradient(90deg,rgba(0,240,255,.035) 1px,transparent 1px);
  background-size:36px 36px;pointer-events:none;z-index:0}
#app{position:relative;z-index:1}
.hdr{text-align:center;padding:18px 16px 6px;background:linear-gradient(180deg,rgba(252,238,10,.07),transparent)}
.hdr-title{font-family:var(--font-display);font-size:30px;font-weight:900;letter-spacing:8px;
  background:linear-gradient(90deg,var(--yellow),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 14px rgba(0,240,255,.35))}
.hdr-sub{font-family:var(--font-mono);font-size:12px;color:var(--cyan);margin-top:3px;letter-spacing:1px;opacity:.85}
.date-nav{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 16px 4px}
.date-nav button{background:none;border:none;color:var(--yellow);font-size:22px;cursor:pointer;padding:4px 10px}
.date-nav-label{font-family:var(--font-ui);font-size:15px;font-weight:700;color:var(--text);cursor:pointer;padding:5px 12px;border-radius:6px;background:var(--surface);border:1px solid var(--border);min-width:150px;text-align:center;letter-spacing:.5px}
.date-nav-label.past{border-color:var(--amber);color:var(--amber)}
.date-nav-today{font-family:var(--font-ui);font-size:12px;font-weight:700;color:var(--cyan);cursor:pointer;padding:5px 10px;border:1px solid var(--cyan);border-radius:6px;background:none;text-transform:uppercase;letter-spacing:1px}
.content{padding:12px 16px 16px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(9,11,20,.92);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom));z-index:100}
.tab-btn{flex:1;background:none;border:none;color:var(--text2);font-family:var(--font-ui);font-weight:600;font-size:9px;letter-spacing:.5px;text-transform:uppercase;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:8px;transition:all .2s}
.tab-btn.active{color:var(--cyan);background:rgba(0,240,255,.1);box-shadow:inset 0 -2px 0 var(--cyan)}
.tab-icon{font-size:18px}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:14px}
.card::before,.card::after{content:'';position:absolute;width:11px;height:11px;pointer-events:none;opacity:.55}
.card::before{top:-1px;left:-1px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan)}
.card::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--pink);border-right:2px solid var(--pink)}
.card-title{font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(40,48,77,.6)}
.stat-row:last-child{border-bottom:none}
.stat-label{font-size:14px;color:var(--text2)}
.stat-value{font-family:var(--font-mono);font-size:18px;font-weight:400}
.btn{width:100%;padding:14px;border:none;border-radius:6px;font-family:var(--font-ui);font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--green);color:#04120c;box-shadow:0 0 16px rgba(0,255,156,.3)}
.btn-primary:active{background:var(--green2);transform:scale(.98)}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:active{background:var(--border)}
.btn-sm{padding:8px 14px;font-size:13px;width:auto;border-radius:6px}
.btn-danger{background:rgba(255,56,96,.15);color:var(--red);border:1px solid rgba(255,56,96,.35)}
input,select,textarea{width:100%;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:16px;font-family:inherit;-webkit-appearance:none}
input[type="date"]{color-scheme:dark}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
textarea{resize:vertical;min-height:60px;font-family:inherit}
label{display:block;font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.form-group{margin-bottom:14px}
.progress-bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:4px;transition:width .5s ease}
.streak-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(252,238,10,.1);border:1px solid rgba(252,238,10,.35);border-radius:20px;padding:6px 14px;font-family:var(--font-ui);font-size:14px;font-weight:700;color:var(--yellow);letter-spacing:.5px}
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.heatmap-cell{aspect-ratio:1;border-radius:2px;background:var(--surface2);position:relative}
.heatmap-cell.l1{background:rgba(0,255,156,.22)}
.heatmap-cell.l2{background:rgba(0,255,156,.42)}
.heatmap-cell.l3{background:rgba(0,255,156,.68)}
.heatmap-cell.l4{background:var(--green);box-shadow:0 0 6px rgba(0,255,156,.5)}
.heatmap-cell.today{box-shadow:0 0 0 2px var(--yellow)}
.heatmap-labels{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--text2);margin-top:4px;padding:0 2px}
.workout-group{margin-bottom:16px}
.workout-group-title{font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.workout-card{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.workout-card:active{transform:scale(.98)}
.workout-card.selected{border-color:var(--green);background:rgba(0,255,156,.08)}
.workout-card-name{font-family:var(--font-ui);font-weight:700;font-size:15px;margin-bottom:4px;letter-spacing:.5px}
.workout-card-desc{font-size:12px;color:var(--text2)}
.exercise-list{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.exercise-item{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.exercise-name{color:var(--text)}
.exercise-detail{color:var(--text2);font-family:var(--font-mono);font-size:12px}
.coach-note{font-size:11px;color:var(--amber);font-style:italic;margin-top:4px;padding:6px 8px;background:rgba(255,176,32,.06);border-radius:6px}
.core-addon{background:rgba(176,38,255,.08);border:1px solid rgba(176,38,255,.28);border-radius:6px;padding:12px;margin-top:12px}
.core-addon-title{font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.focus-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;margin-bottom:8px}
.focus-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:14px;color:#04120c}
.focus-check.done{background:var(--green);border-color:var(--green)}
.focus-text{flex:1;font-size:15px}
.focus-text.done{text-decoration:line-through;opacity:.5}
.focus-delete{color:var(--text2);font-size:18px;cursor:pointer;padding:4px 8px}
.energy-selector{display:flex;gap:6px;margin-top:6px}
.energy-btn{flex:1;padding:10px 4px;border:1px solid var(--border);background:var(--surface2);border-radius:6px;text-align:center;cursor:pointer;font-size:12px;color:var(--text2);transition:all .2s}
.energy-btn.active{border-color:var(--green);color:var(--green);background:rgba(0,255,156,.1)}
.quality-stars{display:flex;gap:8px;margin-top:6px}
.star{font-size:28px;cursor:pointer;opacity:.3;transition:all .15s}
.star.filled{opacity:1}
.chart-container{position:relative;width:100%;height:210px}
.chart-legend{display:flex;gap:14px;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--text2);margin-top:6px}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.meal-item{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--surface2);border-radius:6px;margin-bottom:6px}
.meal-info{flex:1}
.meal-name{font-size:14px;font-weight:600}
.meal-macros{font-family:var(--font-mono);font-size:12px;color:var(--text2)}
.meal-delete{color:var(--text2);cursor:pointer;padding:4px 8px;font-size:16px}
.chips-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;white-space:nowrap;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:9px 12px;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:.3px;cursor:pointer;transition:all .15s}
.chip:active{transform:scale(.95);border-color:var(--yellow);color:var(--yellow)}
.chip-macro{color:var(--text2);font-family:var(--font-mono);font-size:11px;margin-left:4px}
.fav-row{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;background:var(--surface2);border-radius:6px;margin-top:6px;font-size:13px}
.water-ring{flex-shrink:0;line-height:0}
.water-btn{flex:1;min-width:56px;background:var(--surface2);border:1px solid var(--border);color:var(--cyan);font-family:var(--font-ui);font-weight:700;font-size:15px;letter-spacing:.5px;padding:12px 0;border-radius:6px;cursor:pointer;transition:all .15s}
.water-btn:active{transform:scale(.95);background:rgba(0,240,255,.12);border-color:var(--cyan)}
.checkbox-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;cursor:pointer}
.checkbox-row input{width:20px;height:20px;flex-shrink:0}
.checkbox-row label{margin-bottom:0;text-transform:none;cursor:pointer}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px 12px 0 0;padding:20px;width:100%;max-width:500px;max-height:82dvh;overflow-y:auto}
.modal-title{font-family:var(--font-ui);font-size:18px;font-weight:700;letter-spacing:.5px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-close{font-size:24px;cursor:pointer;color:var(--text2);padding:4px}
.empty-state{text-align:center;padding:30px;color:var(--text2);font-size:14px}
.tag{display:inline-block;padding:4px 10px;border-radius:5px;font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.tag-green{background:rgba(0,255,156,.15);color:var(--green)}
.tag-amber{background:rgba(255,176,32,.15);color:var(--amber)}
.tag-red{background:rgba(255,56,96,.15);color:var(--red)}
.log-entry{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(40,48,77,.4);font-size:13px}
.log-entry:last-child{border-bottom:none}
.inline-stat{display:flex;gap:12px;flex-wrap:wrap}
.inline-stat-item{flex:1;min-width:80px;text-align:center;padding:12px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:6px}
.inline-stat-num{font-family:var(--font-mono);font-size:22px;font-weight:400}
.inline-stat-label{font-family:var(--font-ui);font-size:11px;font-weight:600;color:var(--text2);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.photo-card{background:var(--surface2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.photo-card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.photo-card-info{padding:8px 10px}
.photo-card-date{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--cyan)}
.photo-card-note{font-size:11px;color:var(--text2);margin-top:2px;word-break:break-word}
.photo-card-delete{font-size:11px;color:var(--red);cursor:pointer;margin-top:4px;opacity:.7}
.photo-full-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column}
.photo-full-overlay img{max-width:95%;max-height:75vh;object-fit:contain;border-radius:6px}
.photo-full-close{color:#fff;font-size:32px;position:absolute;top:16px;right:20px;cursor:pointer}
.pill-label{font-family:var(--font-ui);font-size:10px;font-weight:700;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;margin:2px 0 6px}
.pill-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pill-row::-webkit-scrollbar{display:none}
.pill{font-family:var(--font-ui);font-weight:600;font-size:11px;padding:6px 11px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.pill.active-pose{border-color:var(--cyan);background:rgba(0,240,255,.15);color:var(--cyan)}
.pill.active-week{border-color:var(--pink);background:rgba(255,45,120,.15);color:var(--pink)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ═══════════════════════════════════════════
// LOCK IN v6 — Cyberpunk Wellness Command Center
// ═══════════════════════════════════════════
// v6 changes:
//   • Photos: multi-select WEEK filter alongside the pose filter (compare Week 1 vs Week 5 of one pose)
//   • Projections: robust Theil–Sen trend (28-day window) replaces least-squares — water spikes no longer
//     blow up the ETA. Adds a sanity guard + an ETA window (robust pace ↔ since-start pace).
// Goal date + label are user-settable (see config.goalDate / config.goalLabel)
function goalDateStr(){return (state.data&&state.data.config&&state.data.config.goalDate)||'';}
function goalLabelStr(){return (state.data&&state.data.config&&state.data.config.goalLabel)||'goal';}
function daysToGoalDate(){const gd=goalDateStr();if(!gd)return null;const n=daysBetween(getToday(),gd);return isNaN(n)?null:n;}
const STORE_KEY='lockin-data';
const TABS=['today','fuel','train','focus','recharge','photos','stats'];
const TAB_ICONS={today:'📊',fuel:'🍽',train:'💪',focus:'🎯',recharge:'🌙',photos:'📸',stats:'📈'};
const TAB_LABELS={today:'Today',fuel:'Fuel',train:'Train',focus:'Focus',recharge:'Rest',photos:'Photos',stats:'Stats'};

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let state={tab:'today',modal:null,selectedWorkout:null,data:null,viewDate:null,photoFilter:'all',photoWeeks:[],editingPhoto:-1};
let tempSleepQuality=0,tempEnergy=0;
let QUICK=[]; // current quick-add meal list (rebuilt each render that shows chips)

function defaults(){
  const sd='2026-07-08';
  const gd=new Date(sd+'T12:00:00');gd.setDate(gd.getDate()+90); // neutral 90-day default, not anyone's specific date
  return{config:{startWeight:305,goalWeight:270,startDate:sd,goalDate:gd.toISOString().slice(0,10),goalLabel:'goal',calorieTarget:2100,proteinTarget:150,sleepTarget:7.5,waterTarget:110},weights:{},meals:{},workouts:{},focus:{},sleep:{},water:{},photos:[],favorites:[]};
}

function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){
      const d=JSON.parse(raw);
      const def=defaults();
      state.data={
        config:{...def.config,...(d.config||{})},
        weights:{...def.weights,...(d.weights||{})},
        meals:{...def.meals,...(d.meals||{})},
        workouts:{...def.workouts,...(d.workouts||{})},
        focus:{...def.focus,...(d.focus||{})},
        sleep:{...def.sleep,...(d.sleep||{})},
        water:{...def.water,...(d.water||{})},
        photos:Array.isArray(d.photos)?d.photos:[],
        favorites:Array.isArray(d.favorites)?d.favorites:[]
      };
    }else{state.data=defaults();}
  }catch(e){state.data=defaults();}
  state.viewDate=getToday();
}

let photosInIDB=false;
function save(){
  try{
    if(photosInIDB){const {photos,...rest}=state.data;localStorage.setItem(STORE_KEY,JSON.stringify(rest));}
    else{localStorage.setItem(STORE_KEY,JSON.stringify(state.data));}
  }catch(e){console.warn('LOCK IN: localStorage save failed',e);}
}
// ── IndexedDB photo store (base64 photos are too big for localStorage's ~5MB cap) ──
const IDB_NAME='lockin-db',IDB_STORE='photos';
function genPhotoId(ts){return 'p_'+(ts||Date.now())+'_'+Math.random().toString(36).slice(2,7);}
function idbOpen(){return new Promise((res,rej)=>{try{const req=indexedDB.open(IDB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE,{keyPath:'id'});};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);}catch(e){rej(e);}});}
function idbAll(){return idbOpen().then(db=>new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readonly');const r=t.objectStore(IDB_STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);}));}
function idbPut(photo){return idbOpen().then(db=>new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readwrite');t.objectStore(IDB_STORE).put(photo);t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error);}));}
function idbPutAll(arr){return idbOpen().then(db=>new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readwrite');const s=t.objectStore(IDB_STORE);arr.forEach(p=>s.put(p));t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error);}));}
function idbDelete(id){return idbOpen().then(db=>new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readwrite');t.objectStore(IDB_STORE).delete(id);t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error);}));}
function persistPhoto(p){idbPut(p).catch(e=>{console.warn('photo save failed',e);alert('That photo could not be saved — your device storage may be full. Your other data is safe.');});}
function getToday(){return new Date().toISOString().slice(0,10)}
function getVD(){return state.viewDate||getToday()}
function isViewingToday(){return getVD()===getToday()}
function daysBetween(a,b){return Math.ceil((new Date(b)-new Date(a))/(864e5))}
function round1(n){return Math.round(n*10)/10}
function fmtDate(d){const dt=new Date(d+'T12:00:00');return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function fmtShort(d){const dt=new Date(d+'T12:00:00');return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})}

function shiftDate(days){
  const d=new Date(getVD()+'T12:00:00');
  d.setDate(d.getDate()+days);
  const ds=d.toISOString().slice(0,10);
  const today=getToday();
  if(ds>today) return; // can't go into future
  state.viewDate=ds;
  render();
}

// ═══════════════════════════════════════════
// WORKOUT DATABASE
// ═══════════════════════════════════════════
const WORKOUTS={
  gym:[
    {name:'Back & Biceps',routines:[

// STREAK / MOMENTUM
// ═══════════════════════════════════════════
function getActivityLevel(date){
  let s=0;const d=state.data;
  if(d.weights[date])s++;
  if(d.meals[date]&&d.meals[date].length>0)s++;
  if(d.workouts[date]&&d.workouts[date].length>0)s++;
  if(d.focus[date]&&d.focus[date].length>0)s++;
  if(d.sleep[date])s++;
  return Math.min(s,4);
}

function getCurrentStreak(){
  let streak=0;let d=new Date();
  if(getActivityLevel(getToday())>0)streak++;
  d.setDate(d.getDate()-1);
  while(true){
    const ds=d.toISOString().slice(0,10);
    if(getActivityLevel(ds)>0){streak++;d.setDate(d.getDate()-1);}
    else break;
    if(streak>365)break;
  }
  return streak;
}

function getLongestStreak(){
  const allDates=new Set([...Object.keys(state.data.weights),...Object.keys(state.data.meals),...Object.keys(state.data.workouts),...Object.keys(state.data.focus),...Object.keys(state.data.sleep)]);
  if(allDates.size===0)return 0;
  const sorted=[...allDates].sort();
  let longest=1,current=1;
  for(let i=1;i<sorted.length;i++){
    if(daysBetween(sorted[i-1],sorted[i])===1){current++;longest=Math.max(longest,current);}
    else current=1;
  }
  return longest;
}

function getLatestWeight(){
  const dates=Object.keys(state.data.weights).sort();
  return dates.length>0?state.data.weights[dates[dates.length-1]]:null;
}

// ═══════════════════════════════════════════
// TRAJECTORY / TREND ENGINE
// ═══════════════════════════════════════════
function sortedWeightEntries(){
  return Object.keys(state.data.weights).sort().map(d=>({date:d,w:state.data.weights[d]}));
}
// Rolling average of the last `win` values, aligned per entry
function rollingAvgSeries(entries,win){
  return entries.map((e,i)=>{
    const s=Math.max(0,i-win+1);
    const slice=entries.slice(s,i+1);
    const avg=slice.reduce((a,b)=>a+b.w,0)/slice.length;
    return {date:e.date,avg:avg};
  });
}
// Least-squares slope in lbs/day over given entries (x = days since first). Kept as a degenerate fallback.
function trendSlope(entries){
  if(entries.length<2)return null;
  const x0=new Date(entries[0].date+'T12:00:00').getTime();
  const pts=entries.map(e=>({x:(new Date(e.date+'T12:00:00').getTime()-x0)/864e5,y:e.w}));
  const n=pts.length;
  const sx=pts.reduce((a,p)=>a+p.x,0);
  const sy=pts.reduce((a,p)=>a+p.y,0);
  const sxy=pts.reduce((a,p)=>a+p.x*p.y,0);
  const sxx=pts.reduce((a,p)=>a+p.x*p.x,0);
  const denom=(n*sxx-sx*sx);
  if(denom===0)return null;
  return (n*sxy-sx*sy)/denom;
}
// Theil–Sen robust slope (median of ALL pairwise slopes), lbs/day.
// Median-of-slopes resists outliers: a 3–4 day water spike is a minority of the pairs,
// so it can't drag the trend the way least-squares does. This is the fix for the
// "goal in 2.5 years" artifact that appears after a salty weekend.
function theilSenSlope(entries){
  if(!entries||entries.length<2)return null;
  const pts=entries.map(e=>({x:new Date(e.date+'T12:00:00').getTime()/864e5,y:e.w}));
  const slopes=[];
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    const dx=pts[j].x-pts[i].x;
    if(dx!==0)slopes.push((pts[j].y-pts[i].y)/dx);
  }
  if(!slopes.length)return null;
  slopes.sort((a,b)=>a-b);
  const m=Math.floor(slopes.length/2);
  return slopes.length%2?slopes[m]:(slopes[m-1]+slopes[m])/2;
}
function getTrajectory(){
  const entries=sortedWeightEntries();
  if(entries.length<3)return null;
  const today=getToday();

  // ── Robust pace: Theil–Sen over the last 28 days (needs ≥5 pts, else last 10 entries) ──
  const win=entries.filter(e=>daysBetween(e.date,today)<=28);
  const recent=win.length>=5?win:entries.slice(-Math.min(entries.length,10));
  let slope=theilSenSlope(recent);
  if(slope===null)slope=trendSlope(recent); // degenerate fallback only

  const roll=rollingAvgSeries(entries,7);
  const smoothedLatest=round1(roll[roll.length-1].avg);
  const goal=state.data.config.goalWeight;
  const weekly=round1(slope*7);

  // ── Since-start endpoint pace (naive: total lost / total weeks) ──
  const firstE=entries[0],lastE=entries[entries.length-1];
  const elapsed=Math.max(1,daysBetween(firstE.date,lastE.date));
  const sinceStartDaily=(lastE.w-firstE.w)/elapsed;
  const sinceStartWeekly=round1(sinceStartDaily*7);

  const gd=state.data.config.goalDate;
  const daysToGoalDt=gd?daysBetween(today,gd):null;

  // ── ETA helpers with sanity guard ──
  const CAP=730; // never project further than ~2 years; beyond that we call it "flat" instead of a scary number
  const etaDays=(dailySlope)=>{
    if(smoothedLatest<=goal)return 0;
    if(dailySlope>=-0.005)return null;              // flat or gaining → no finite ETA
    const d=Math.ceil((smoothedLatest-goal)/(-dailySlope));
    return (d>CAP||!isFinite(d))?null:d;
  };
  const etaDate=(days)=>{
    if(days==null)return null;
    const dt=new Date(today+'T12:00:00');dt.setDate(dt.getDate()+days);
    return dt.toISOString().slice(0,10);
  };

  const daysToGoal=etaDays(slope);
  const projGoalDate=etaDate(daysToGoal);

  // ── ETA window: robust pace ↔ since-start pace (brackets reality) ──
  const dR=etaDays(slope),dS=etaDays(sinceStartDaily);
  const both=[dR,dS].filter(v=>v!=null);
  const etaEarly=both.length?etaDate(Math.min(...both)):null;
  const etaLate=both.length?etaDate(Math.max(...both)):null;

  // ── Projected weight on the goal date (robust slope) ──
  let projGoal=null;
  if(daysToGoalDt!=null&&!isNaN(daysToGoalDt))projGoal=round1(smoothedLatest+slope*daysToGoalDt);

  const flat=slope>=-0.02 && smoothedLatest>goal; // water-dominated stall right now

  return {smoothedLatest,weekly,slope,sinceStartWeekly,
          projGoalDate,daysToGoal,projGoal,goalTargetDate:gd,goal,
          reachedGoal:smoothedLatest<=goal,etaEarly,etaLate,flat};
}

// ═══════════════════════════════════════════
// QUICK-ADD MEALS
// ═══════════════════════════════════════════
function median(a){if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2);}
function mealFrequency(){
  const freq={};
  Object.values(state.data.meals).forEach(arr=>(arr||[]).forEach(m=>{
    const key=(m.name||'').trim();if(!key)return;
    const lk=key.toLowerCase();
    if(!freq[lk])freq[lk]={name:key,count:0,cal:[],pro:[]};
    freq[lk].count++;freq[lk].cal.push(m.calories||0);freq[lk].pro.push(m.protein||0);
  }));
  return freq;
}
function getQuickMeals(){
  const favs=(state.data.favorites||[]).map(f=>({name:f.name,calories:f.calories,protein:f.protein,fav:true}));
  const favNames=new Set(favs.map(f=>f.name.toLowerCase()));
  const freq=mealFrequency();
  const freqList=Object.values(freq)
    .filter(f=>f.count>=2 && !favNames.has(f.name.toLowerCase()))
    .sort((a,b)=>b.count-a.count)
    .slice(0,8)
    .map(f=>({name:f.name,calories:median(f.cal),protein:median(f.pro),fav:false}));
  return [...favs,...freqList].slice(0,12);
}
function renderQuickChips(ctx){
  QUICK=getQuickMeals();
  if(QUICK.length===0)return '';
  const chips=QUICK.map((q,i)=>`<button class="chip" onclick="quickAdd(${i})">${q.fav?'★ ':'+ '}${q.name}<span class="chip-macro">${q.calories}·${q.protein}g</span></button>`).join('');
  if(ctx==='modal'){
    return `<div style="margin-bottom:14px"><label>⚡ Quick add</label><div class="chips-row">${chips}</div></div>`;
  }
  return `<div class="card"><div class="card-title">⚡ Quick Add</div><div class="chips-row">${chips}</div></div>`;
}
function quickAdd(i){
  const q=QUICK[i];if(!q)return;
  const vd=getVD();
  if(!state.data.meals[vd])state.data.meals[vd]=[];
  state.data.meals[vd].push({name:q.name,calories:q.calories,protein:q.protein});
  save();render();
}
// ── Hydration ──
function addWater(oz){
  const vd=getVD();
  const cur=state.data.water[vd]||0;
  const next=Math.max(0,cur+oz);
  if(next===0)delete state.data.water[vd]; else state.data.water[vd]=next;
  save();render();
}
function resetWater(){const vd=getVD();delete state.data.water[vd];save();render();}
function renderHydration(){
  const vd=getVD();
  const oz=state.data.water[vd]||0;
  const target=state.data.config.waterTarget||110;
  const remaining=Math.max(0,target-oz);
  const hit=oz>=target;
  const R=52,C=2*Math.PI*R;
  const off=C*(1-Math.min(1,oz/target));
  const col=hit?'#00ff9c':'#00f0ff';
  const glow=hit?'rgba(0,255,156,.6)':'rgba(0,240,255,.6)';
  return `<div class="card"><div class="card-title">💧 Hydration</div>
    <div style="display:flex;align-items:center;gap:18px">
      <div class="water-ring">
        <svg width="122" height="122" viewBox="0 0 128 128">
          <circle cx="64" cy="64" r="${R}" fill="none" stroke="#161a2b" stroke-width="10"/>
          <circle cx="64" cy="64" r="${R}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 64 64)" style="filter:drop-shadow(0 0 6px ${glow});transition:stroke-dashoffset .5s ease"/>
          <text x="64" y="60" text-anchor="middle" fill="${col}" style="font-family:'Share Tech Mono',monospace;font-size:27px">${oz}</text>
          <text x="64" y="83" text-anchor="middle" fill="#8790b8" style="font-family:'Rajdhani',sans-serif;font-weight:600;font-size:12px;letter-spacing:1px">/ ${target} OZ</text>
        </svg>
      </div>
      <div style="flex:1">
        <div style="font-family:'Share Tech Mono',monospace;font-size:14px;color:${hit?'#00ff9c':'var(--text2)'};margin-bottom:10px">${hit?'✅ Target hit':remaining+' oz to go'}</div>
        <div style="display:flex;gap:8px">
          <button class="water-btn" onclick="addWater(8)">+8</button>
          <button class="water-btn" onclick="addWater(16)">+16</button>
          <button class="water-btn" onclick="addWater(24)">+24</button>
        </div>
        <div style="display:flex;gap:16px;margin-top:10px">
          <span style="font-size:12px;color:var(--text2);cursor:pointer" onclick="addWater(-8)">− undo 8</span>
          <span style="font-size:12px;color:var(--text2);cursor:pointer" onclick="resetWater()">reset</span>
        </div>
      </div>
    </div>
  </div>`;
}
function addFavorite(name,cal,pro){
  if(!Array.isArray(state.data.favorites))state.data.favorites=[];
  if(!state.data.favorites.some(f=>f.name.toLowerCase()===name.toLowerCase())){
    state.data.favorites.push({name,calories:cal,protein:pro});
  }
}
function removeFavorite(i){
  if(Array.isArray(state.data.favorites)){state.data.favorites.splice(i,1);save();render();}
}

function renderTrajectory(full){
  const t=getTrajectory();
  if(!t){return `<div class="card"><div class="card-title">📉 Trajectory</div><div class="empty-state">Log a few more weigh-ins to unlock your smoothed trend & projection.</div></div>`;}
  const rateColor=t.weekly<0?'var(--green)':'var(--amber)';
  const rateTxt=`${t.weekly>0?'+':''}${t.weekly}/wk`;
  const sinceTxt=`${t.sinceStartWeekly>0?'+':''}${t.sinceStartWeekly}/wk`;
  const etaTxt=t.reachedGoal?'🎯 Hit':(t.flat?'flat':(t.projGoalDate?fmtShort(t.projGoalDate):'—'));
  const onTrack=t.projGoal!=null && t.projGoal<=t.goal;
  const honeyColor=onTrack?'var(--green)':'var(--amber)';
  const gLabel=goalLabelStr();
  const hasWindow=t.etaEarly&&t.etaLate&&t.etaEarly!==t.etaLate;
  return `<div class="card"><div class="card-title">📉 Trajectory <span style="font-family:var(--font-ui);font-weight:600;color:var(--text2);font-size:11px;letter-spacing:.5px">· robust trend</span></div>
    <div class="inline-stat">
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--cyan)">${t.smoothedLatest}</div><div class="inline-stat-label">Trend wt</div></div>
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:${rateColor}">${rateTxt}</div><div class="inline-stat-label">Trend pace</div></div>
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--yellow);font-size:16px">${etaTxt}</div><div class="inline-stat-label">Hit ${t.goal}</div></div>
    </div>
    <div class="stat-row" style="margin-top:10px"><span class="stat-label">Avg since start</span><span class="stat-value" style="color:var(--text2)">${sinceTxt}</span></div>
    ${full&&hasWindow?`<div class="stat-row"><span class="stat-label">ETA window</span><span class="stat-value" style="color:var(--cyan);font-size:15px">${fmtShort(t.etaEarly)} – ${fmtShort(t.etaLate)}</span></div>`:''}
    ${t.goalTargetDate&&t.projGoal!=null?`<div class="stat-row"><span class="stat-label">Projected on ${fmtShort(t.goalTargetDate)}</span><span class="stat-value" style="color:${honeyColor}">${t.projGoal} lbs ${onTrack?'✓':'⚠'}</span></div>`:''}
    ${full&&t.daysToGoal?`<div class="stat-row"><span class="stat-label">Days to ${t.goal} at this pace</span><span class="stat-value">${t.daysToGoal}</span></div>`:''}
    ${full?`<p style="font-size:12px;color:var(--text2);margin-top:10px">${
      t.flat
        ? `Trend is water-flat right now — the projection pauses until a few clean days clear the water. Your underlying fat-loss trend hasn't changed; this is the sodium artifact, not a real stall.`
        : (onTrack
            ? `On pace to reach ${t.goal} before your ${gLabel} date. The trend pace is a median-based (robust) fit over the last 28 days, so one salty weekend no longer throws the projection off.`
            : `Current robust pace lands you near ${t.projGoal} on your ${gLabel} date — a touch above ${t.goal}. Tightening sleep or adding one cardio session closes it.`)
    } ${hasWindow?`<span style="color:var(--text2)">The ETA window brackets your robust recent pace against your since-start average — reality usually lands inside it.</span>`:''}</p>`:''}
  </div>`;
}

function renderToday(){
  const vd=getVD();
  const dl=daysToGoalDate();
  const w=state.data.weights[vd];
  const startW=state.data.config.startWeight;
  const goalW=state.data.config.goalWeight;
  const latestWeight=getLatestWeight();
  const totalLost=latestWeight?round1(startW-latestWeight):0;
  const totalNeeded=round1(startW-goalW);
  const pct=totalNeeded>0?Math.min(100,round1((totalLost/totalNeeded)*100)):0;
  const streak=getCurrentStreak();
  const vdMeals=state.data.meals[vd]||[];
  const vdCals=vdMeals.reduce((s,m)=>s+(m.calories||0),0);
  const vdProtein=vdMeals.reduce((s,m)=>s+(m.protein||0),0);
  const vdWorkouts=state.data.workouts[vd]||[];
  const vdWater=state.data.water[vd]||0;
  const waterT=state.data.config.waterTarget||110;

  // Heatmap — last 35 days from TODAY (always anchored to real today)
  const now=new Date();
  const startDay=new Date(now);
  startDay.setDate(startDay.getDate()-34);
  while(startDay.getDay()!==0)startDay.setDate(startDay.getDate()-1);
  const cells=[];const d2=new Date(startDay);
  while(d2<=now||cells.length%7!==0){
    const ds=d2.toISOString().slice(0,10);
    const level=getActivityLevel(ds);
    const isToday=ds===getToday();
    const isFuture=d2>now;
    cells.push(`<div class="heatmap-cell ${isFuture?'':('l'+level)} ${isToday?'today':''}" title="${ds}"></div>`);
    d2.setDate(d2.getDate()+1);
    if(cells.length>42)break;
  }

  return `
    ${renderDateNav()}
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span class="streak-badge">🔥 ${streak} day streak</span>
        <span style="font-family:var(--font-mono);font-size:13px;color:var(--text2)">${dl==null?'set goal date':(dl>0?dl+' days left':(dl===0?'goal day 🎯':'past goal'))}</span>
      </div>
      <div class="inline-stat">
        <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--green)">${latestWeight||'--'}</div><div class="inline-stat-label">Current lbs</div></div>
        <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--cyan)">${totalLost>0?'-':''}${Math.abs(totalLost)}</div><div class="inline-stat-label">Lost</div></div>
        <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--yellow)">${pct}%</div><div class="inline-stat-label">To goal</div></div>
      </div>
    </div>
    ${renderTrajectory(false)}
    <div class="card">
      <div class="card-title">Momentum</div>
      <div class="heatmap">${cells.join('')}</div>
      <div class="heatmap-labels"><span>5 weeks ago</span><span>Today</span></div>
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center;font-size:11px;color:var(--text2)">
        <div class="heatmap-cell" style="width:12px;height:12px;display:inline-block"></div>None
        <div class="heatmap-cell l1" style="width:12px;height:12px;display:inline-block"></div>Low
        <div class="heatmap-cell l2" style="width:12px;height:12px;display:inline-block"></div>Med
        <div class="heatmap-cell l3" style="width:12px;height:12px;display:inline-block"></div>Good
        <div class="heatmap-cell l4" style="width:12px;height:12px;display:inline-block"></div>Full
      </div>
    </div>
    <div class="card">
      <div class="card-title">${isViewingToday()?'Today\'s Snapshot':fmtDate(vd)}</div>
      <div class="stat-row"><span class="stat-label">Weight</span><span class="stat-value">${w?w+' lbs':'—'}</span></div>
      ${!w?`<div class="form-group" style="margin-top:8px"><div style="display:flex;gap:8px">
        <input type="number" id="weight-in" placeholder="Weigh in (lbs)" step="0.1" inputmode="decimal" style="flex:1">
        <button class="btn btn-primary btn-sm" onclick="logWeight()">Log</button>
      </div></div>`:''}
      <div class="stat-row"><span class="stat-label">Calories</span><span class="stat-value">${vdCals} <span style="font-size:13px;color:var(--text2)">/ ${state.data.config.calorieTarget}</span></span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100,(vdCals/state.data.config.calorieTarget)*100)}%;background:${vdCals>state.data.config.calorieTarget?'var(--red)':'var(--green)'};box-shadow:0 0 8px ${vdCals>state.data.config.calorieTarget?'rgba(255,56,96,.5)':'rgba(0,255,156,.5)'}"></div></div>
      <div class="stat-row" style="margin-top:4px"><span class="stat-label">Protein</span><span class="stat-value">${vdProtein}g <span style="font-size:13px;color:var(--text2)">/ ${state.data.config.proteinTarget}g</span></span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100,(vdProtein/state.data.config.proteinTarget)*100)}%;background:var(--cyan);box-shadow:0 0 8px rgba(0,240,255,.5)"></div></div>
      <div class="stat-row" style="margin-top:4px"><span class="stat-label">Water</span><span class="stat-value">${vdWater}oz <span style="font-size:13px;color:var(--text2)">/ ${waterT}oz</span></span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100,(vdWater/waterT)*100)}%;background:#38bdf8;box-shadow:0 0 8px rgba(56,189,248,.5)"></div></div>
      <div class="stat-row" style="margin-top:4px"><span class="stat-label">Workouts</span><span class="stat-value">${vdWorkouts.length>0?vdWorkouts.map(w=>'<span class="tag tag-green">'+w.name+'</span>').join(' '):'None'}</span></div>
    </div>`;
}

function renderFuel(){
  const vd=getVD();
  const meals=state.data.meals[vd]||[];
  const totalCal=meals.reduce((s,m)=>s+(m.calories||0),0);
  const totalPro=meals.reduce((s,m)=>s+(m.protein||0),0);
  const calT=state.data.config.calorieTarget,proT=state.data.config.proteinTarget;
  return `
    ${renderDateNav()}
    <div class="card">
      <div class="card-title">Daily Fuel</div>
      <div class="stat-row"><span class="stat-label">Calories</span><span class="stat-value" style="color:${totalCal>calT?'var(--red)':'var(--green)'}">${totalCal} / ${calT}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100,(totalCal/calT)*100)}%;background:${totalCal>calT?'var(--red)':'var(--green)'};box-shadow:0 0 8px ${totalCal>calT?'rgba(255,56,96,.5)':'rgba(0,255,156,.5)'}"></div></div>
      <div class="stat-row" style="margin-top:8px"><span class="stat-label">Protein</span><span class="stat-value" style="color:var(--cyan)">${totalPro}g / ${proT}g</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100,(totalPro/proT)*100)}%;background:var(--cyan);box-shadow:0 0 8px rgba(0,240,255,.5)"></div></div>
    </div>
    ${renderHydration()}
    ${renderQuickChips('fuel')}
    <div class="card"><div class="card-title">Meals Logged</div>
      ${meals.length>0?meals.map((m,i)=>`<div class="meal-item"><div class="meal-info"><div class="meal-name">${m.name}</div><div class="meal-macros">${m.calories} cal · ${m.protein}g protein</div></div><div class="meal-delete" onclick="deleteMeal(${i})">✕</div></div>`).join(''):'<div class="empty-state">No meals logged. Get fueling.</div>'}
    </div>
    <button class="btn btn-primary" onclick="showModal('add-meal')">+ Log Meal</button>`;
}

function renderTrain(){
  const vd=getVD();
  const vdWorkouts=state.data.workouts[vd]||[];
  const loggedHTML=vdWorkouts.length>0?`<div class="card"><div class="card-title">${isViewingToday()?'Today\'s Training':fmtDate(vd)+' Training'}</div>
    ${vdWorkouts.map((w,i)=>`<div class="log-entry"><span>${w.name} ${w.routine?'— '+w.routine:''}</span><span style="display:flex;align-items:center;gap:8px"><span style="color:var(--green)">${w.duration||''}${w.duration?' min':''} ${w.calories?'· '+w.calories+' cal':''}</span><span class="meal-delete" onclick="deleteWorkout('${vd}',${i})">✕</span></span></div>`).join('')}</div>`:'';

  return `
    ${renderDateNav()}
    ${loggedHTML}
    <div class="workout-group"><div class="workout-group-title">🏋️ Gym Splits</div>
      ${WORKOUTS.gym.map(g=>`<div class="workout-card" onclick="showModal('gym-split-${g.name.replace(/[^a-zA-Z]/g,'')}')"><div class="workout-card-name">${g.name}</div><div class="workout-card-desc">${g.routines.length} routines — tap to choose</div></div>`).join('')}
    </div>
    <div class="workout-group"><div class="workout-group-title">🫀 Cardio</div>
      ${WORKOUTS.cardio.map(c=>`<div class="workout-card" onclick="showWorkoutDetail('cardio','${c.id}')"><div class="workout-card-name">${c.name}</div><div class="workout-card-desc">${c.desc}</div></div>`).join('')}
    </div>
    <div class="workout-group"><div class="workout-group-title">🏠 Home</div>
      ${WORKOUTS.home.map(c=>`<div class="workout-card" onclick="showWorkoutDetail('home','${c.id}')"><div class="workout-card-name">${c.name}</div><div class="workout-card-desc">${c.desc}</div></div>`).join('')}
    </div>
    <div class="core-addon"><div class="core-addon-title">🎯 Core Add-On <span style="font-size:11px;font-weight:400;color:var(--text2)">— stack onto any upper body day</span></div>
      ${WORKOUTS.coreAddon.map(c=>`<div class="workout-card" onclick="showWorkoutDetail('coreAddon','${c.id}')"><div class="workout-card-name">${c.name}</div><div class="workout-card-desc">${c.desc}</div></div>`).join('')}
    </div>`;
}

function renderFocus(){
  const vd=getVD();
  const items=state.data.focus[vd]||[];
  const doneCount=items.filter(i=>i.done).length;
  const completionPct=items.length>0?Math.round((doneCount/items.length)*100):0;

  // History
  const dates=Object.keys(state.data.focus).sort().reverse().slice(0,7);
  const histRows=dates.filter(d=>d!==vd).map(d=>{
    const it=state.data.focus[d];const dn=it.filter(i=>i.done).length;const t=it.length;const p=t>0?Math.round((dn/t)*100):0;
    return `<div class="log-entry"><span>${fmtDate(d)}</span><span style="color:${p===100?'var(--green)':p>0?'var(--amber)':'var(--red)'}">${dn}/${t} (${p}%)</span></div>`;
  }).join('');

  return `
    ${renderDateNav()}
    <div class="card"><div class="card-title">${isViewingToday()?'Today\'s':fmtDate(vd)} Non-Negotiables</div>
      <p style="font-size:13px;color:var(--text2);margin-bottom:12px">What are the 1–3 things that MUST happen?</p>
      ${items.length>0?`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span style="color:var(--text2)">${doneCount}/${items.length} complete</span><span style="color:var(--green);font-weight:700">${completionPct}%</span></div><div class="progress-bar"><div class="progress-fill" style="width:${completionPct}%;background:var(--green);box-shadow:0 0 8px rgba(0,255,156,.5)"></div></div></div>`:''}
      ${items.map((item,i)=>`<div class="focus-item"><div class="focus-check ${item.done?'done':''}" onclick="toggleFocus(${i})">${item.done?'✓':''}</div><div class="focus-text ${item.done?'done':''}">${item.text}</div><div class="focus-delete" onclick="deleteFocus(${i})">✕</div></div>`).join('')}
      ${items.length>=3?'<p style="font-size:12px;color:var(--text2);text-align:center;margin-top:8px">Max 3 — focus means choosing.</p>':''}
    </div>
    ${items.length<3?`<div class="card"><div class="form-group"><input type="text" id="focus-input" placeholder="What must get done?" maxlength="100"></div><button class="btn btn-primary" onclick="addFocus()">+ Add Focus Item</button></div>`:''}
    ${histRows?`<div class="card"><div class="card-title">Recent Focus</div>${histRows}</div>`:''}`;
}

function renderSleepInsight(){
  const es=Object.keys(state.data.sleep).sort().map(d=>state.data.sleep[d]).filter(Boolean);
  if(es.length<2)return '';
  const last7=es.slice(-7);
  const avg=round1(last7.reduce((a,b)=>a+b.hours,0)/last7.length);
  const target=state.data.config.sleepTarget||7.5;
  const delta=round1(avg-target);
  const color=avg>=target?'var(--green)':avg>=target-1?'var(--amber)':'var(--red)';
  return `<div class="card"><div class="card-title">🌙 7-Day Sleep</div>
   <div class="inline-stat">
     <div class="inline-stat-item"><div class="inline-stat-num" style="color:${color}">${avg}</div><div class="inline-stat-label">Avg hrs</div></div>
     <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--cyan)">${target}</div><div class="inline-stat-label">Target</div></div>
     <div class="inline-stat-item"><div class="inline-stat-num" style="color:${color}">${delta>=0?'+':''}${delta}</div><div class="inline-stat-label">vs target</div></div>
   </div>
   <p style="font-size:12px;color:var(--text2);margin-top:10px">${avg>=target?'Dialed in. Recovery and fat loss both thank you.':`Running ${Math.abs(delta)}h under target. Closing that gap is your single highest-leverage move right now — protect the window.`}</p>
  </div>`;
}

function renderRecharge(){
  const vd=getVD();
  const sleep=state.data.sleep[vd];

  const loggedHTML=sleep?`<div class="card"><div class="card-title">Sleep Log</div>
    <div class="inline-stat">
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--cyan)">${sleep.hours}</div><div class="inline-stat-label">Hours</div></div>
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--amber)">${'⭐'.repeat(sleep.quality)}</div><div class="inline-stat-label">Quality</div></div>
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:${sleep.energy>=4?'var(--green)':sleep.energy>=2?'var(--amber)':'var(--red)'}">${['','😴','😐','🙂','😊','⚡'][sleep.energy]||'—'}</div><div class="inline-stat-label">Energy</div></div>
    </div>
    <button class="btn btn-secondary btn-sm" style="margin-top:12px" onclick="delete state.data.sleep['${vd}'];save();render()">Re-log</button>
  </div>`:`<div class="card"><div class="card-title">Log Sleep</div>
    <div class="form-group"><label>Hours slept</label><input type="number" id="sleep-hours" placeholder="7.5" step="0.5" min="0" max="16" inputmode="decimal"></div>
    <div class="form-group"><label>Sleep quality</label><div class="quality-stars" id="quality-stars">${[1,2,3,4,5].map(i=>`<span class="star" onclick="setSleepQuality(${i})" data-star="${i}">⭐</span>`).join('')}</div></div>
    <div class="form-group"><label>Morning energy level</label><div class="energy-selector">${[{v:1,l:'😴 Dead'},{v:2,l:'😐 Low'},{v:3,l:'🙂 OK'},{v:4,l:'😊 Good'},{v:5,l:'⚡ Wired'}].map(e=>`<div class="energy-btn" onclick="setEnergy(${e.v})" data-energy="${e.v}">${e.l}</div>`).join('')}</div></div>
    <button class="btn btn-primary" onclick="logSleep()">Log Sleep</button>
  </div>`;

  const sleepDates=Object.keys(state.data.sleep).sort().reverse().slice(0,14);
  const histHTML=sleepDates.map(d=>{const s=state.data.sleep[d];if(!s)return '';return `<div class="log-entry"><span>${fmtDate(d)}</span><span>${s.hours}h · ${'⭐'.repeat(s.quality)} · ${['','😴','😐','🙂','😊','⚡'][s.energy]||''}</span></div>`;}).join('');
  const allSleep=Object.values(state.data.sleep).filter(s=>s);
  const avgH=allSleep.length>0?round1(allSleep.reduce((s,v)=>s+v.hours,0)/allSleep.length):'—';
  const avgQ=allSleep.length>0?round1(allSleep.reduce((s,v)=>s+v.quality,0)/allSleep.length):'—';
  const avgE=allSleep.length>0?round1(allSleep.reduce((s,v)=>s+v.energy,0)/allSleep.length):'—';

  return `
    ${renderDateNav()}
    ${loggedHTML}
    ${renderSleepInsight()}
    ${allSleep.length>1?`<div class="card"><div class="card-title">All-Time Averages</div><div class="inline-stat">
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--cyan)">${avgH}</div><div class="inline-stat-label">Avg hours</div></div>
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--amber)">${avgQ}</div><div class="inline-stat-label">Avg quality</div></div>
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--green)">${avgE}</div><div class="inline-stat-label">Avg energy</div></div>
    </div></div>`:''}
    ${histHTML?`<div class="card"><div class="card-title">Sleep History</div>${histHTML}</div>`:''}`;
}

function renderStats(){
  const latestW=getLatestWeight();const startW=state.data.config.startWeight;const goalW=state.data.config.goalWeight;
  const totalLost=latestW?round1(startW-latestW):0;const streak=getCurrentStreak();const longest=getLongestStreak();
  const workoutDays=Object.keys(state.data.workouts).filter(d=>(state.data.workouts[d]||[]).length>0).length;
  const totalMeals=Object.values(state.data.meals).reduce((s,arr)=>s+(arr||[]).length,0);
  let focusDone=0,focusTotal=0;
  Object.keys(state.data.focus).forEach(d=>{const it=state.data.focus[d]||[];focusTotal+=it.length;focusDone+=it.filter(i=>i.done).length;});
  const focusRate=focusTotal>0?Math.round((focusDone/focusTotal)*100):0;

  return `
    <div class="card"><div class="card-title">Progress</div><div class="inline-stat">
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--green)">${latestW||'--'}</div><div class="inline-stat-label">Current</div></div>
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--cyan)">${totalLost>0?'-':''}${Math.abs(totalLost)}</div><div class="inline-stat-label">Lost</div></div>
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--yellow)">${goalW}</div><div class="inline-stat-label">Goal</div></div>
    </div></div>
    ${renderTrajectory(true)}
    <div class="card"><div class="card-title">Weight Trend</div><div class="chart-container"><canvas id="weight-chart"></canvas></div>
      <div class="chart-legend"><span><span class="legend-dot" style="background:var(--green)"></span>Daily</span><span><span class="legend-dot" style="background:var(--cyan)"></span>7-day avg</span><span><span class="legend-dot" style="background:var(--yellow)"></span>Goal</span></div>
    </div>
    <div class="card"><div class="card-title">Consistency</div>
      <div class="stat-row"><span class="stat-label">🔥 Current streak</span><span class="stat-value" style="color:var(--green)">${streak} days</span></div>
      <div class="stat-row"><span class="stat-label">🏆 Longest streak</span><span class="stat-value" style="color:var(--amber)">${longest} days</span></div>
      <div class="stat-row"><span class="stat-label">💪 Workout days</span><span class="stat-value">${workoutDays}</span></div>
      <div class="stat-row"><span class="stat-label">🍽 Meals logged</span><span class="stat-value">${totalMeals}</span></div>
      <div class="stat-row"><span class="stat-label">🎯 Focus completion</span><span class="stat-value" style="color:${focusRate>=80?'var(--green)':focusRate>=50?'var(--amber)':'var(--red)'}">${focusRate}%</span></div>
    </div>
    <div class="card"><div class="card-title">Settings</div>

      <div class="form-group"><label>Start weight (lbs)</label><input type="number" value="${state.data.config.startWeight}" onchange="state.data.config.startWeight=+this.value;save();render()" inputmode="numeric" step="0.1"></div>

}

function renderModal(){
  if(!state.modal)return '';
  let title='',body='';

  if(state.modal==='add-meal'){
    title='Log Meal — '+fmtDate(getVD());
    const favs=state.data.favorites||[];
    body=`${renderQuickChips('modal')}
      <div class="form-group"><label>What did you eat?</label><input type="text" id="meal-name" placeholder="e.g. Grilled chicken & rice"></div>
      <div class="form-group"><label>Calories</label><input type="number" id="meal-cal" placeholder="500" inputmode="numeric"></div>
      <div class="form-group"><label>Protein (g)</label><input type="number" id="meal-pro" placeholder="35" inputmode="numeric"></div>
      <div class="checkbox-row"><input type="checkbox" id="meal-fav"><label for="meal-fav">★ Save as a favorite for one-tap logging</label></div>
      <button class="btn btn-primary" onclick="saveMeal()">Log It</button>
      ${favs.length?`<div style="margin-top:16px"><label>Saved favorites</label>${favs.map((f,i)=>`<div class="fav-row"><span>★ ${f.name} <span style="color:var(--text2);font-family:var(--font-mono)">${f.calories}·${f.protein}g</span></span><span class="meal-delete" onclick="removeFavorite(${i})">✕</span></div>`).join('')}</div>`:''}`;
  }

  if(state.modal==='date-picker'){
    title='Jump to Date';
    body=`<div class="form-group"><label>Select a date</label><input type="date" id="date-pick" value="${getVD()}" max="${getToday()}"></div>
      <button class="btn btn-primary" onclick="jumpToDate()">Go</button>`;
  }

  if(state.modal&&state.modal.startsWith('gym-split-')){
    const splitName=state.modal.replace('gym-split-','');
    const group=WORKOUTS.gym.find(g=>g.name.replace(/[^a-zA-Z]/g,'')===splitName);
    if(group){title=group.name;body=group.routines.map(r=>`<div class="workout-card" onclick="showWorkoutDetail('gym','${r.id}')"><div class="workout-card-name">${r.name}</div><div class="workout-card-desc">${r.desc}</div></div>`).join('');}
  }

  if(state.modal==='workout-detail'&&state.selectedWorkout){
    const w=state.selectedWorkout;
    title=w.name;
    body=`<p style="color:var(--text2);font-size:13px;margin-bottom:12px">${w.desc||''}</p>
      ${w.exercises?w.exercises.map(e=>`<div class="exercise-item"><span class="exercise-name">${e.name}</span><span class="exercise-detail">${e.sets}</span></div>${e.note?`<div class="coach-note">💡 ${e.note}</div>`:''}`).join(''):`<p style="font-size:13px;color:var(--text2)">${w.desc||w.duration||''}</p>`}
      <div style="height:1px;background:var(--border);margin:16px 0"></div>
      <div class="form-group"><label>Duration (min)</label><input type="number" id="log-duration" placeholder="45" inputmode="numeric"></div>
      <div class="form-group"><label>Active Calories (Apple Watch)</label><input type="number" id="log-calories" placeholder="500" inputmode="numeric"></div>
      <button class="btn btn-primary" onclick="logWorkout()">Log Workout for ${fmtDate(getVD())}</button>`;
  }

  return `<div class="modal-overlay" onclick="if(event.target===this){closeModal()}"><div class="modal">
    <div class="modal-title"><span>${title}</span><span class="modal-close" onclick="closeModal()">✕</span></div>${body}
  </div></div>`;
}
