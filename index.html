<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060a">
<title>LOCK IN</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Orbitron:wght@800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#05060a;--surface:#0d0f1a;--surface2:#1D2230;--border:#28304d;
  --text:#e9ecff;--text2:#A3ABBD;
  --yellow:#FFD866;--cyan:#2EE6F5;--pink:#FF5C93;--magenta:#ff00ff;
  --green:#3DF5A0;--green2:#2AD487;--amber:#FFB547;--red:#FF5C7A;--purple:#A78BFA;--blue:#3b82f6;
  --font-display:'Orbitron','Segoe UI',system-ui,sans-serif;
  --font-ui:'Rajdhani','Segoe UI',system-ui,sans-serif;
  --font-mono:'Share Tech Mono','Consolas',monospace;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:
  radial-gradient(1200px 620px at 50% -12%,rgba(255,216,102,.05),transparent 60%),
  radial-gradient(900px 560px at 100% 108%,rgba(255,92,147,.06),transparent 60%),
  var(--bg);
  color:var(--text);min-height:100dvh;overflow-x:hidden;padding-bottom:82px}
body::before{content:'';position:fixed;inset:0;background-image:
  linear-gradient(rgba(46,230,245,.035) 1px,transparent 1px),
  linear-gradient(90deg,rgba(46,230,245,.035) 1px,transparent 1px);
  background-size:36px 36px;pointer-events:none;z-index:0}
#app{position:relative;z-index:1}
.hdr{text-align:center;padding:18px 16px 6px;background:linear-gradient(180deg,rgba(255,216,102,.07),transparent)}
.hdr-title{font-family:var(--font-display);font-size:30px;font-weight:900;letter-spacing:8px;
  background:linear-gradient(90deg,var(--yellow),var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 14px rgba(46,230,245,.35))}
.hdr-sub{font-family:var(--font-mono);font-size:12px;color:var(--cyan);margin-top:3px;letter-spacing:1px;opacity:.85}
.date-nav{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 16px 4px}
.date-nav button{background:none;border:none;color:var(--yellow);font-size:22px;cursor:pointer;padding:4px 10px}
.date-nav-label{font-family:var(--font-ui);font-size:15px;font-weight:700;color:var(--text);cursor:pointer;padding:5px 12px;border-radius:6px;background:var(--surface);border:1px solid var(--border);min-width:150px;text-align:center;letter-spacing:.5px}
.date-nav-label.past{border-color:var(--amber);color:var(--amber)}
.date-nav-today{font-family:var(--font-ui);font-size:12px;font-weight:700;color:var(--cyan);cursor:pointer;padding:5px 10px;border:1px solid var(--cyan);border-radius:6px;background:none;text-transform:uppercase;letter-spacing:1px}
.content{padding:12px 16px 16px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(9,11,20,.92);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom));z-index:100}
.tab-btn{flex:1;background:none;border:none;color:var(--text2);font-family:var(--font-ui);font-weight:600;font-size:9px;letter-spacing:.5px;text-transform:uppercase;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:8px;transition:all .2s}
.tab-btn.active{color:var(--cyan);background:rgba(46,230,245,.1);box-shadow:inset 0 -2px 0 var(--cyan)}
.tab-icon{font-size:18px}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:14px}
.card::before,.card::after{content:'';position:absolute;width:11px;height:11px;pointer-events:none;opacity:.55}
.card::before{top:-1px;left:-1px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan)}
.card::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--pink);border-right:2px solid var(--pink)}
.card-title{font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(40,48,77,.6)}
.stat-row:last-child{border-bottom:none}
.stat-label{font-size:14px;color:var(--text2)}
.stat-value{font-family:var(--font-mono);font-size:18px;font-weight:400}
.btn{width:100%;padding:14px;border:none;border-radius:6px;font-family:var(--font-ui);font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--green);color:#04120c;box-shadow:0 0 16px rgba(61,245,160,.3)}
.btn-primary:active{background:var(--green2);transform:scale(.98)}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:active{background:var(--border)}
.btn-sm{padding:8px 14px;font-size:13px;width:auto;border-radius:6px}
.btn-danger{background:rgba(255,92,122,.15);color:var(--red);border:1px solid rgba(255,92,122,.35)}
input,select,textarea{width:100%;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:16px;font-family:inherit;-webkit-appearance:none}
input[type="date"]{color-scheme:dark}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
textarea{resize:vertical;min-height:60px;font-family:inherit}
label{display:block;font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.form-group{margin-bottom:14px}
.progress-bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:4px;transition:width .5s ease}
.streak-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,216,102,.1);border:1px solid rgba(255,216,102,.35);border-radius:20px;padding:6px 14px;font-family:var(--font-ui);font-size:14px;font-weight:700;color:var(--yellow);letter-spacing:.5px}
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.heatmap-cell{aspect-ratio:1;border-radius:2px;background:var(--surface2);position:relative}
.heatmap-cell.l1{background:rgba(61,245,160,.22)}
.heatmap-cell.l2{background:rgba(61,245,160,.42)}
.heatmap-cell.l3{background:rgba(61,245,160,.68)}
.heatmap-cell.l4{background:var(--green);box-shadow:0 0 6px rgba(61,245,160,.5)}
.heatmap-cell.today{box-shadow:0 0 0 2px var(--yellow)}
.heatmap-labels{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--text2);margin-top:4px;padding:0 2px}
.workout-group{margin-bottom:16px}
.workout-group-title{font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.workout-card{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.workout-card:active{transform:scale(.98)}
.workout-card.selected{border-color:var(--green);background:rgba(61,245,160,.08)}
.workout-card-name{font-family:var(--font-ui);font-weight:700;font-size:15px;margin-bottom:4px;letter-spacing:.5px}
.workout-card-desc{font-size:12px;color:var(--text2)}
.exercise-list{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.exercise-item{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.exercise-name{color:var(--text)}
.exercise-detail{color:var(--text2);font-family:var(--font-mono);font-size:12px}
.coach-note{font-size:11px;color:var(--amber);font-style:italic;margin-top:4px;padding:6px 8px;background:rgba(255,181,71,.06);border-radius:6px}
.core-addon{background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.28);border-radius:6px;padding:12px;margin-top:12px}
.core-addon-title{font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.focus-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;margin-bottom:8px}
.focus-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:14px;color:#04120c}
.focus-check.done{background:var(--green);border-color:var(--green)}
.focus-text{flex:1;font-size:15px}
.focus-text.done{text-decoration:line-through;opacity:.5}
.focus-delete{color:var(--text2);font-size:18px;cursor:pointer;padding:4px 8px}
.energy-selector{display:flex;gap:6px;margin-top:6px}
.energy-btn{flex:1;padding:10px 4px;border:1px solid var(--border);background:var(--surface2);border-radius:6px;text-align:center;cursor:pointer;font-size:12px;color:var(--text2);transition:all .2s}
.energy-btn.active{border-color:var(--green);color:var(--green);background:rgba(61,245,160,.1)}
.quality-stars{display:flex;gap:8px;margin-top:6px}
.star{font-size:28px;cursor:pointer;opacity:.3;transition:all .15s}
.star.filled{opacity:1}
.chart-container{position:relative;width:100%;height:210px}
.chart-legend{display:flex;gap:14px;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--text2);margin-top:6px}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.meal-item{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--surface2);border-radius:6px;margin-bottom:6px}
.meal-info{flex:1}
.meal-name{font-size:14px;font-weight:600}
.meal-macros{font-family:var(--font-mono);font-size:12px;color:var(--text2)}
.meal-delete{color:var(--text2);cursor:pointer;padding:4px 8px;font-size:16px}
.chips-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;white-space:nowrap;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:9px 12px;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:.3px;cursor:pointer;transition:all .15s}
.chip:active{transform:scale(.95);border-color:var(--yellow);color:var(--yellow)}
.chip-macro{color:var(--text2);font-family:var(--font-mono);font-size:11px;margin-left:4px}
.fav-row{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;background:var(--surface2);border-radius:6px;margin-top:6px;font-size:13px}
.water-ring{flex-shrink:0;line-height:0}
.water-btn{flex:1;min-width:56px;background:var(--surface2);border:1px solid var(--border);color:var(--cyan);font-family:var(--font-ui);font-weight:700;font-size:15px;letter-spacing:.5px;padding:12px 0;border-radius:6px;cursor:pointer;transition:all .15s}
.water-btn:active{transform:scale(.95);background:rgba(46,230,245,.12);border-color:var(--cyan)}
.checkbox-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;cursor:pointer}
.checkbox-row input{width:20px;height:20px;flex-shrink:0}
.checkbox-row label{margin-bottom:0;text-transform:none;cursor:pointer}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px 12px 0 0;padding:20px;width:100%;max-width:500px;max-height:82dvh;overflow-y:auto}
.modal-title{font-family:var(--font-ui);font-size:18px;font-weight:700;letter-spacing:.5px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-close{font-size:24px;cursor:pointer;color:var(--text2);padding:4px}
.empty-state{text-align:center;padding:30px;color:var(--text2);font-size:14px}
.tag{display:inline-block;padding:4px 10px;border-radius:5px;font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.tag-green{background:rgba(61,245,160,.15);color:var(--green)}
.tag-amber{background:rgba(255,181,71,.15);color:var(--amber)}
.tag-red{background:rgba(255,92,122,.15);color:var(--red)}
.log-entry{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(40,48,77,.4);font-size:13px}
.log-entry:last-child{border-bottom:none}
.inline-stat{display:flex;gap:12px;flex-wrap:wrap}
.inline-stat-item{flex:1;min-width:80px;text-align:center;padding:12px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:6px}
.inline-stat-num{font-family:var(--font-mono);font-size:22px;font-weight:400}
.inline-stat-label{font-family:var(--font-ui);font-size:11px;font-weight:600;color:var(--text2);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.photo-card{background:var(--surface2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.photo-card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.photo-card-info{padding:8px 10px}
.photo-card-date{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--cyan)}
.photo-card-note{font-size:11px;color:var(--text2);margin-top:2px;word-break:break-word}
.photo-card-delete{font-size:11px;color:var(--red);cursor:pointer;margin-top:4px;opacity:.7}
.photo-full-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column}
.photo-full-overlay img{max-width:95%;max-height:75vh;object-fit:contain;border-radius:6px}
.photo-full-close{color:#fff;font-size:32px;position:absolute;top:16px;right:20px;cursor:pointer}
.pill-label{font-family:var(--font-ui);font-size:10px;font-weight:700;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;margin:2px 0 6px}
.pill-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pill-row::-webkit-scrollbar{display:none}
.pill{font-family:var(--font-ui);font-weight:600;font-size:11px;padding:6px 11px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.pill.active-pose{border-color:var(--cyan);background:rgba(46,230,245,.15);color:var(--cyan)}
.pill.active-week{border-color:var(--pink);background:rgba(255,92,147,.15);color:var(--pink)}

/* ── v7: SVG icon alignment + phase card + disciplined polish ── */
.tab-icon{font-size:20px;display:flex;align-items:center;justify-content:center;line-height:0}
.tab-icon svg{width:21px;height:21px}
.tab-btn{gap:3px;font-weight:700;letter-spacing:.6px}
.tab-btn.active svg{filter:drop-shadow(0 0 6px currentColor)}
.workout-group-title{display:flex;align-items:center;gap:8px}
.workout-group-title svg{width:17px;height:17px}
.core-addon-title{display:flex;align-items:center;gap:8px}
.core-addon-title svg{width:16px;height:16px}
.card-title svg{width:15px;height:15px}
.streak-badge svg{width:15px;height:15px}
/* Header — sharper, more "system readout" */
.hdr-title{letter-spacing:10px}
.hdr-sub{text-transform:uppercase;letter-spacing:2px;font-size:11px}
/* Phase card */
.phase-card::before{border-top-color:var(--green)}
.phase-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:10px}
.phase-label{font-family:var(--font-display);font-size:26px;font-weight:900;letter-spacing:3px;line-height:1}
.phase-tag{font-family:var(--font-ui);font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:1.5px;margin-top:4px}
.phase-track{flex:1;max-width:52%}
.phase-track-bar{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
.phase-track-fill{height:100%;border-radius:4px;transition:width .6s ease}
.phase-track-cap{font-family:var(--font-mono);font-size:10px;color:var(--text2);margin-top:5px;text-align:right;letter-spacing:.5px}
.phase-blurb{font-size:12.5px;color:var(--text2);line-height:1.5;margin-bottom:10px}
.phase-guide{font-family:var(--font-mono);font-size:11px;color:var(--cyan);background:rgba(46,230,245,.06);border:1px solid rgba(46,230,245,.18);border-radius:6px;padding:8px 10px;letter-spacing:.5px}
.phase-flip{margin-top:12px;padding:12px;border:1px solid rgba(61,245,160,.3);background:rgba(61,245,160,.06);border-radius:8px}
.phase-flip-msg{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--text);line-height:1.45}
.phase-flip-msg svg{width:16px;height:16px;color:var(--green);margin-top:1px;flex-shrink:0}
.phase-next{margin-top:12px;font-family:var(--font-mono);font-size:11px;color:var(--text2);letter-spacing:.5px}
.phase-switch{display:flex;gap:6px;margin-top:12px}
.phase-pill{flex:1;padding:8px 4px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);border-radius:6px;font-family:var(--font-ui);font-weight:700;font-size:11px;letter-spacing:1px;cursor:pointer;transition:all .15s}
.phase-pill.active{background:rgba(255,255,255,.03)}

/* ── v8: body map ── */
.bm-card::before{border-top-color:var(--cyan)}
.bm-toggle{display:flex;gap:6px;margin-bottom:6px}
.bm-tog{flex:1;padding:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);border-radius:6px;font-family:var(--font-ui);font-weight:700;font-size:11px;letter-spacing:2px;cursor:pointer;transition:all .15s}
.bm-tog.active{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 10px rgba(46,230,245,.2)}
.bm-frame{position:relative;background:radial-gradient(circle at 50% 25%,rgba(46,230,245,.04),transparent 70%);border:1px solid var(--border);border-radius:8px;margin:8px 0;overflow:hidden}
.bm-frame::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(46,230,245,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(46,230,245,.05) 1px,transparent 1px);background-size:20px 20px;pointer-events:none}
.bm-prompt{text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--text2);letter-spacing:1px;padding:10px 0 2px}
.bm-panel{margin-top:6px}
.bm-panel-head{font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.bm-installing{font-family:var(--font-mono);font-size:10px;letter-spacing:2px;opacity:.7;animation:bmpulse 1.4s ease-in-out infinite}
@keyframes bmpulse{0%,100%{opacity:.35}50%{opacity:.9}}
.modality-sep{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:3px;color:var(--text2);text-transform:uppercase;text-align:center;margin:18px 0 12px;position:relative}
.modality-sep::before,.modality-sep::after{content:'';position:absolute;top:50%;width:28%;height:1px;background:var(--border)}
.modality-sep::before{left:0}.modality-sep::after{right:0}

/* ── v9: Goals / Cookie Jar (repurposed Focus tab) ── */
.goal-term-switch{display:flex;gap:8px;margin-bottom:14px}
.goal-term-btn{flex:1;padding:12px 4px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);border-radius:6px;font-family:var(--font-ui);font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .15s}
.goal-term-btn.active-short{border-color:var(--cyan);color:var(--cyan);background:rgba(46,230,245,.1);box-shadow:0 0 12px rgba(46,230,245,.18)}
.goal-term-btn.active-long{border-color:var(--pink);color:var(--pink);background:rgba(255,92,147,.1);box-shadow:0 0 12px rgba(255,92,147,.18)}
.goal-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;margin-bottom:8px}
.goal-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:15px;color:#04120c;font-weight:700}
.goal-check:active{transform:scale(.88)}
.goal-item .goal-text{flex:1;font-size:15px;line-height:1.35}
.goal-delete{color:var(--text2);font-size:18px;cursor:pointer;padding:4px 8px}
.jar-wrap{display:flex;flex-wrap:wrap;gap:9px;margin-top:2px}
.goal-badge{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:8px;font-family:var(--font-ui);font-weight:700;font-size:13px;letter-spacing:.3px;line-height:1.2;max-width:100%}
.goal-badge .gb-check{font-size:13px;flex-shrink:0}
.goal-badge .gb-date{font-family:var(--font-mono);font-weight:400;font-size:10px;opacity:.7;flex-shrink:0}
.goal-badge .gb-undo{margin-left:1px;opacity:.5;cursor:pointer;font-size:15px;flex-shrink:0}
.goal-badge .gb-undo:active{opacity:1}
.jar-count{font-family:var(--font-mono);font-size:12px;color:var(--text2);font-weight:400;letter-spacing:.5px}

/* ── v11: strength log · next up · charts · debrief · settings ── */
.hdr{position:relative}
.hdr-gear{position:absolute;top:14px;right:12px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid transparent;border-radius:8px;color:var(--text2);cursor:pointer}
.hdr-gear svg{width:21px;height:21px}
.hdr-gear.active{color:var(--cyan);border-color:rgba(46,230,245,.35);background:rgba(46,230,245,.08)}
/* Next Up */
.nu-card::before{border-top-color:var(--green);border-left-color:var(--green)}
.nu-when{font-family:var(--font-mono);font-size:11px;color:var(--text2);letter-spacing:2px;text-transform:uppercase}
.nu-pick{font-family:var(--font-display);font-size:24px;font-weight:900;letter-spacing:2px;line-height:1.1;margin:6px 0 4px;text-transform:uppercase}
.nu-why{font-size:13px;color:var(--text2);line-height:1.45}
.nu-routine{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:12px;min-height:48px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;cursor:pointer}
.nu-routine:active{transform:scale(.98)}
.nu-routine b{font-family:var(--font-ui);font-size:15px;letter-spacing:.5px}
.nu-go{white-space:nowrap;font-family:var(--font-ui);font-weight:700;font-size:12px;letter-spacing:2px;color:var(--green)}
.nu-addons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.nu-addon{font-family:var(--font-ui);font-weight:700;font-size:12px;letter-spacing:.5px;padding:10px 12px;min-height:40px;border-radius:6px;border:1px dashed var(--border);background:none;color:var(--text);cursor:pointer}
.nu-addon span{font-family:var(--font-mono);font-weight:400;color:var(--text2);font-size:11px;margin-left:4px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.mchip{padding:7px 4px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);text-align:center}
.mchip-n{font-family:var(--font-ui);font-weight:700;font-size:11px;letter-spacing:.5px;text-transform:uppercase}
.mchip-d{font-family:var(--font-mono);font-size:11px;margin-top:1px}
.bm-legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-family:var(--font-mono);font-size:10px;color:var(--text2);margin-top:4px}
.bm-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
/* Strength logger */
.lx{border:1px solid var(--border);border-radius:6px;margin-bottom:10px;background:var(--surface2);overflow:hidden}
.lx-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;min-height:48px;cursor:pointer}
.lx-name{font-family:var(--font-ui);font-weight:700;font-size:15px;letter-spacing:.3px}
.lx-scheme{font-family:var(--font-mono);font-size:12px;color:var(--text2);white-space:nowrap}
.lx-chev{color:var(--text2);font-size:14px;transition:transform .2s}
.lx.open .lx-chev{transform:rotate(90deg)}
.lx-meta{padding:0 12px 10px;font-size:12px;line-height:1.5}
.lx-last{font-family:var(--font-mono);color:var(--text2)}
.lx-next{color:var(--green);margin-top:2px}
.lx-body{padding:0 12px 12px;border-top:1px solid var(--border)}
.lx-modes{display:flex;gap:6px;margin:10px 0}
.lx-mode{flex:1;padding:8px 2px;border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:6px;font-family:var(--font-ui);font-weight:700;font-size:11px;letter-spacing:1px;cursor:pointer}
.lx-mode.on{border-color:var(--cyan);color:var(--cyan);background:rgba(46,230,245,.08)}
.lx-row{display:grid;grid-template-columns:44px 1fr 18px 1fr 22px;gap:6px;align-items:center;margin-bottom:6px}
.lx-row .sn{font-family:var(--font-mono);font-size:12px;color:var(--text2)}
.lx-row input{padding:10px 8px;font-family:var(--font-mono);font-size:17px;text-align:center}
.lx-row .x{color:var(--text2);text-align:center;font-family:var(--font-mono)}
.lx-row .ok{color:var(--green);font-size:14px;text-align:center}
.lx-unit{display:grid;grid-template-columns:44px 1fr 18px 1fr 22px;gap:6px;font-family:var(--font-ui);font-size:10px;letter-spacing:1px;color:var(--text2);text-transform:uppercase;text-align:center;margin-top:4px}
.lx-add{font-family:var(--font-ui);font-weight:700;font-size:12px;letter-spacing:1px;color:var(--cyan);background:none;border:1px dashed rgba(46,230,245,.35);border-radius:6px;padding:10px;width:100%;cursor:pointer;margin-top:2px}
.pr-badge{display:inline-block;font-family:var(--font-display);font-size:9px;font-weight:900;letter-spacing:1.5px;padding:3px 6px;border-radius:4px;background:rgba(255,216,102,.14);color:var(--yellow);border:1px solid rgba(255,216,102,.5);box-shadow:0 0 8px rgba(255,216,102,.3);margin-left:6px;vertical-align:2px}
.lx-today{font-size:12px;padding:8px 0;border-bottom:1px solid rgba(40,48,77,.4);display:flex;justify-content:space-between;gap:10px}
.lx-today:last-child{border-bottom:none}
.lx-today span:last-child{font-family:var(--font-mono);color:var(--text2);text-align:right}
/* Debrief */
.db-sec{margin-top:10px}
.db-h{font-family:var(--font-ui);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.db-item{display:flex;gap:8px;font-size:13px;line-height:1.45;padding:4px 0}
.db-item i{font-style:normal;flex-shrink:0;width:14px;text-align:center}
.db-focus{margin-top:12px;padding:10px 12px;border-radius:6px;border:1px solid rgba(255,216,102,.35);background:rgba(255,216,102,.06);font-size:13px;line-height:1.45}
.db-focus b{font-family:var(--font-ui);letter-spacing:1.5px;font-size:11px;color:var(--yellow);display:block;margin-bottom:2px;text-transform:uppercase}
/* Charts */
.range-row{display:flex;gap:6px;margin-bottom:10px}
.range-pill{flex:1;padding:9px 4px;min-height:38px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);border-radius:6px;font-family:var(--font-ui);font-weight:700;font-size:12px;letter-spacing:1.5px;cursor:pointer}
.range-pill.on{border-color:var(--cyan);color:var(--cyan);background:rgba(46,230,245,.1)}
.cwrap{position:relative;width:100%}
.ctip{position:absolute;pointer-events:none;background:rgba(9,11,20,.95);border:1px solid var(--border);border-radius:6px;padding:6px 9px;font-family:var(--font-mono);font-size:11px;color:var(--text);white-space:nowrap;z-index:5;display:none;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.ctip b{font-family:var(--font-ui);color:var(--text2);font-weight:700;letter-spacing:.5px;display:block;margin-bottom:2px}
.ctip .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.lift-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.lift-tbl th{font-family:var(--font-ui);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text2);text-align:right;padding:6px 4px;border-bottom:1px solid var(--border)}
.lift-tbl th:first-child,.lift-tbl td:first-child{text-align:left}
.lift-tbl td{padding:8px 4px;border-bottom:1px solid rgba(40,48,77,.4);font-family:var(--font-mono);text-align:right}
.lift-tbl td:first-child{font-family:var(--font-ui);font-weight:600;font-size:13px}
.lift-tbl tr{cursor:pointer}
.wr-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.wr-nav button{background:none;border:1px solid var(--border);color:var(--yellow);font-size:18px;width:44px;height:36px;border-radius:6px;cursor:pointer}
.wr-nav button:disabled{opacity:.25}
.wr-range{font-family:var(--font-mono);font-size:13px;color:var(--text);text-align:center}
.wr-grade{font-family:var(--font-display);font-size:34px;font-weight:900;line-height:1}
.wr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.wr-cell{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:9px 10px}
.wr-cell .v{font-family:var(--font-mono);font-size:17px}
.wr-cell .l{font-family:var(--font-ui);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text2);margin-top:2px}
.wr-sess{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cal-note{font-size:11.5px;color:var(--text2);line-height:1.5;margin-top:8px}
.edit-link{font-size:12px;color:var(--cyan);cursor:pointer;margin-left:8px;font-family:var(--font-ui);letter-spacing:.5px}
/* ── Lock-In Mission ── */
.ms-card{border-color:color-mix(in srgb,var(--msc) 45%,var(--border))}
.ms-card::before{border-top-color:var(--msc);border-left-color:var(--msc);opacity:.9}
.ms-top{display:flex;gap:12px;align-items:flex-start}
.ms-kicker{font-family:var(--font-mono);font-size:11px;color:var(--text2);letter-spacing:2px}
.ms-mode{font-family:var(--font-display);font-size:21px;font-weight:900;letter-spacing:2px;line-height:1.15;margin:4px 0 6px}
.ms-line{font-size:13px;color:var(--text2);line-height:1.45}
.ms-list{margin-top:12px}
.ms-item{display:flex;align-items:flex-start;gap:10px;padding:10px 4px;min-height:44px;border-bottom:1px solid rgba(40,48,77,.5)}
.ms-item:last-child{border-bottom:none}
.ms-item.tap{cursor:pointer}
.ms-item.tap:active{background:rgba(255,255,255,.03)}
.ms-box{width:22px;height:22px;border-radius:5px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#04120c;margin-top:1px}
.ms-item.ok .ms-box{background:var(--green);border-color:var(--green);box-shadow:0 0 8px rgba(61,245,160,.4)}
.ms-item.tap:not(.ok) .ms-box{border-style:dashed;border-color:var(--text2)}
.ms-lbl{display:block;font-size:14px;font-weight:600;line-height:1.3}
.ms-item.ok .ms-lbl{color:var(--text2)}
.ms-sub{display:block;font-size:11.5px;color:var(--text2);margin-top:2px;line-height:1.4}
.ms-tag{font-family:var(--font-mono);font-size:9px;letter-spacing:1px;color:var(--text2);opacity:.6;margin-top:4px}
.ms-kit{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ms-chip{font-family:var(--font-ui);font-weight:700;font-size:12px;letter-spacing:.5px;padding:10px 12px;min-height:40px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer}
.ms-chip span{font-family:var(--font-mono);font-weight:400;color:var(--text2);font-size:11px;margin-left:4px}
.ms-chip.on{border-color:var(--yellow);color:var(--yellow);background:rgba(255,216,102,.08)}
.ms-grid{display:grid;gap:4px;margin-top:14px}
.ms-foot{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--text2);margin-top:8px}
.ms-rules{margin-top:10px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:rgba(0,0,0,.2);font-size:12.5px;line-height:1.5;display:flex;flex-direction:column;gap:6px;color:var(--text2)}
.ms-rules b{color:var(--text);font-family:var(--font-ui);letter-spacing:.5px;margin-right:4px}

/* ── v12: program · strength-for-size · volume · weigh & log · health import · reveal ── */
.pb-week{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:14px}
.pb-chip{padding:7px 2px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);text-align:center;font-family:var(--font-ui);font-weight:700;font-size:10px;letter-spacing:.5px;color:var(--text2)}
.pb-chip span{display:block;font-family:var(--font-mono);font-size:12px;margin-top:2px}
.pb-chip.done{border-color:rgba(61,245,160,.5);color:var(--green);background:rgba(61,245,160,.07)}
.pb-chip.next{border-color:var(--yellow);color:var(--yellow);box-shadow:0 0 10px rgba(255,216,102,.25)}
.role-tag{display:inline-block;font-family:var(--font-ui);font-size:9px;font-weight:700;letter-spacing:1.2px;padding:2px 5px;border-radius:3px;margin-right:6px;vertical-align:2px;color:var(--yellow);border:1px solid rgba(255,216,102,.5)}
.role-tag.bo{color:var(--cyan);border-color:rgba(46,230,245,.45)}
.lx-ramp{font-family:var(--font-mono);font-size:11.5px;color:var(--text2);margin-top:4px;line-height:1.5}
.lx-ramp b{color:var(--yellow)}
.lx-ramp span{color:var(--text2)}
.sx-row{display:grid;grid-template-columns:78px 1fr auto;grid-template-areas:"n v t" "b b b" "x x x";gap:2px 8px;align-items:baseline;padding:9px 0;border-bottom:1px solid rgba(40,48,77,.45)}
.sx-row:last-of-type{border-bottom:none}
.sx-name{grid-area:n;font-family:var(--font-ui);font-weight:700;font-size:14px;letter-spacing:.5px}
.sx-val{grid-area:v;font-family:var(--font-mono);font-size:13px}
.sx-val b{font-size:17px;color:var(--text)}
.sx-val span{color:var(--text2);font-size:11px}
.sx-tier{grid-area:t;font-family:var(--font-ui);font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.sx-bar{grid-area:b;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:5px}
.sx-bar i{display:block;height:100%;border-radius:3px}
.sx-next{grid-area:x;font-family:var(--font-mono);font-size:10.5px;color:var(--text2)}
.vol-row{display:grid;grid-template-columns:86px 1fr 34px;gap:8px;align-items:center;padding:5px 0;font-size:12px}
.vol-row span:first-child{font-family:var(--font-ui);font-weight:600;letter-spacing:.3px}
.vol-row span:last-child{font-family:var(--font-mono);text-align:right}
.vol-bar{position:relative;height:8px;background:var(--surface2);border-radius:4px;overflow:visible}
.vol-bar i{display:block;height:100%;border-radius:4px}
.vol-bar b{position:absolute;top:-3px;width:2px;height:14px;background:var(--text2);opacity:.7}
.src-tag{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1px solid;border-radius:4px;font-family:var(--font-mono);font-size:11px;margin-right:7px;vertical-align:1px;cursor:pointer;flex-shrink:0}
.social-chip{font-family:var(--font-mono);font-size:12px;border:1px solid;border-radius:6px;padding:8px 10px;margin:0 0 10px;text-align:center}
.pl-results{max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;background:var(--surface2)}
.pl-results:empty{display:none}
.pl-food{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border-bottom:1px solid rgba(40,48,77,.45);cursor:pointer;font-size:13px}
.pl-food:last-child{border-bottom:none}
.pl-food span:last-child{font-family:var(--font-mono);color:var(--text2);font-size:11.5px;white-space:nowrap}
.pl-food:active{background:rgba(46,230,245,.08)}
.pl-row{display:grid;grid-template-columns:1fr 70px 34px 74px 22px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(40,48,77,.45)}
.pl-n{font-size:13px;line-height:1.3;min-width:0}
.pl-amt{padding:9px 6px!important;font-family:var(--font-mono);font-size:16px;text-align:center}
.pl-u{font-family:var(--font-mono);font-size:11px;color:var(--text2)}
.pl-r{font-family:var(--font-mono);font-size:11.5px;color:var(--cyan);text-align:right}
.pl-total{font-family:var(--font-mono);font-size:16px;color:var(--yellow);text-align:right;padding:10px 0 0}
.hg-step{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid rgba(40,48,77,.45);font-size:13px;line-height:1.5}
.hg-step b{color:var(--text)}
.hg-step>div:last-child{color:var(--text2);min-width:0}
.hg-n{flex-shrink:0;width:24px;height:24px;border-radius:50%;border:1px solid var(--cyan);color:var(--cyan);font-family:var(--font-mono);font-size:12px;display:flex;align-items:center;justify-content:center}
.hg-pre{font-family:var(--font-mono);font-size:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-top:6px;white-space:pre-wrap;color:var(--cyan)}
.scan-video{width:100%;max-height:220px;border-radius:6px;background:#000;object-fit:cover;border:1px solid var(--border)}
.rv-row{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(40,48,77,.45)}
.rv-row:last-child{border-bottom:none}
.rv-p{font-family:var(--font-mono);font-size:15px;color:var(--amber)}
.rv-t{font-size:12.5px;color:var(--text2);line-height:1.35}
.rv-w{font-family:var(--font-mono);font-size:12px;color:var(--text2);text-align:right}
.rv-w b{font-size:16px;color:var(--text)}
.rv-w span{display:block;font-size:10.5px}
.rv-row.done .rv-p,.rv-row.done .rv-w b{color:var(--green)}
textarea{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:10px}
select{width:100%;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:15px}
.form-group{min-width:0}
.form-group input,.form-group select,.form-group textarea{box-sizing:border-box;max-width:100%}

/* ══ v13: Design system 2.0 — same identity, quieter execution ══ */
:root{
  --bg:#0A0C11;--surface:#12151D;--surface2:#191D28;--border:#232838;--line2:#2D3345;
  --text:#EEF1F7;--text2:#A3ABBD;--text3:#8A93A7;
  --cyan:#2EE6F5;--green:#3DF5A0;--green2:#2AD487;--amber:#FFB547;--pink:#FF5C93;--red:#FF5C7A;
  --purple:#A78BFA;--magenta:#E879F9;--blue:#60A5FA;--yellow:#FFD866;
  --font-display:'Inter',system-ui,-apple-system,sans-serif;
  --font-ui:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
  --r-card:20px;--r-btn:16px;--r-chip:10px;
}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);font-feature-settings:'cv11','ss01';padding-bottom:calc(92px + env(safe-area-inset-bottom))}
body::before{display:none}
/* Header */
.hdr{display:flex;align-items:center;gap:12px;text-align:left;padding:max(14px,env(safe-area-inset-top)) 16px 8px;background:none}
.hdr-brand{flex:1;min-width:0}
.hdr-title{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;letter-spacing:5px;color:var(--cyan);background:none;-webkit-text-fill-color:currentColor;filter:none;line-height:1.2}
.hdr-sub{font-family:var(--font-ui);font-size:13px;font-weight:500;color:var(--text2);text-transform:none;letter-spacing:0;margin-top:2px;opacity:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-gear{position:static;flex-shrink:0;width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--text2)}
.hdr-gear.active{color:var(--cyan);border-color:rgba(46,230,245,.45);background:rgba(46,230,245,.08)}
/* Cards */
.card{border-radius:var(--r-card);padding:18px;margin-bottom:14px;background:var(--surface);border:1px solid var(--border)}
.card::before,.card::after{display:none}
.card-title{font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--text2);margin-bottom:12px}

/* Buttons & inputs */

.btn-sm{min-height:40px;padding:9px 14px;font-size:14px;border-radius:12px}

input,select,textarea{border-radius:12px;background:var(--surface2);border-color:var(--border)}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(46,230,245,.18)}

/* Generic radius pass */

.chip,.pill,.nu-addon,.ms-chip,.range-pill,.lx-mode,.energy-btn,.goal-term-btn,.phase-pill,.bm-tog,.water-btn,.lx-add,.tag,.social-chip,.date-nav-label,.date-nav-today,.coach-note,.db-focus,.phase-guide{border-radius:var(--r-chip)}
.bm-frame::before{display:none}
.tab-btn.active svg,.pb-chip.next,.ms-item.ok .ms-box,.bm-tog.active,.goal-term-btn.active-short,.goal-term-btn.active-long,.pr-badge{box-shadow:none;filter:none}

.nu-pick{text-transform:none;font-size:24px}
.ms-mode{font-size:20px}
.pr-badge{font-family:var(--font-ui);font-weight:800}
.heatmap-cell{border-radius:4px}
.heatmap-cell.l4{box-shadow:none}
.lx-row input{border-radius:12px;min-height:48px;font-weight:600}
.lx-name,.workout-card-name,.nu-routine b,.sx-name{letter-spacing:0}
.coach-note{font-style:normal;color:#E9C48A;background:rgba(255,181,71,.07)}
.modality-sep{letter-spacing:1.6px}
/* Modal → bottom sheet */
.modal-overlay{background:rgba(4,6,10,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal{border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));background:var(--surface);border:1px solid var(--border);border-bottom:none;max-height:88dvh}
.modal::before{content:'';display:block;width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.modal-title{font-family:var(--font-ui);font-size:20px;font-weight:800;letter-spacing:-.3px}
.modal-close{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--surface2);font-size:16px}
/* Tab bar: Today · Fuel · + · Train · Progress */
.tabs{background:rgba(10,12,17,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:6px 8px;padding-bottom:max(8px,env(safe-area-inset-bottom));align-items:flex-end}
.tab-btn{font-family:var(--font-ui);font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;min-height:50px;justify-content:center;border-radius:14px;color:var(--text3)}
.tab-btn.active{color:var(--cyan);background:none;box-shadow:none}
.tab-btn.active .tab-icon{background:rgba(46,230,245,.12);border-radius:12px}
.tab-icon{width:44px;height:28px}
.tab-log{flex:0 0 72px;display:flex;justify-content:center;align-items:flex-start;background:none;border:none;padding:0;cursor:pointer}
.tab-log span{width:58px;height:58px;margin-top:-18px;border-radius:20px;background:var(--cyan);color:#06222A;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 22px rgba(46,230,245,.35),0 0 0 5px var(--bg)}

/* Segmented control (Progress) */
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;margin-bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px}
.seg button{min-height:40px;border:none;border-radius:10px;background:transparent;color:var(--text2);font-family:var(--font-ui);font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--border);color:var(--text);font-weight:700}
/* Log sheet */
.log-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.log-it{display:flex;align-items:center;gap:10px;min-height:64px;padding:10px 12px;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:16px;color:var(--text);cursor:pointer;font-family:var(--font-ui)}
.log-it:active{transform:scale(.97)}
.log-ic{flex-shrink:0;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.log-tx{display:flex;flex-direction:column;min-width:0}

.log-tx span{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Equipment tag on logger rows */
.eq-tag{display:inline-block;font-family:var(--font-ui);font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--text3);border:1px solid var(--line2);border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:2px;text-transform:uppercase}

/* ══ v13.1: screens to the LOCK IN 2.0 mockups ══ */
.mono{font-family:var(--font-mono)}
.muted{font-size:13px;color:var(--text2);line-height:1.5}
.lab{display:block;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text2)}
.h17{margin:0 0 10px;font-size:17px;font-weight:700}
.h15{font-size:15px!important;color:#C9CFDC}
.content{padding:4px 16px 24px;position:relative;z-index:1}
.today-glow{position:absolute;inset:0 0 auto 0;height:420px;background:radial-gradient(120% 80% at 50% -10%,rgba(46,230,245,.16),rgba(10,12,17,0) 60%);pointer-events:none;z-index:0}
.card{border-radius:20px}
/* header */

.hb-round{flex-shrink:0;width:44px;height:44px;border-radius:22px;border:1px solid var(--border);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:15px}

/* tab bar */
.nbar{position:fixed;left:0;right:0;bottom:0;z-index:100;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:10px 12px max(14px,env(safe-area-inset-bottom));background:rgba(10,12,17,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid #1D2230}
.nb{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--text3);font-size:11px;font-weight:600;cursor:pointer;min-height:48px;justify-content:center;font-family:inherit}

.nb-log:active{transform:scale(.94)}
.tabs,.hdr{display:none}
/* shared bits */
.pill-btn{flex-shrink:0;height:36px;padding:0 14px;border-radius:18px;border:none;background:var(--cyan);color:#06222A;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}

.chip2{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}

.note-chip{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 8%,transparent);font-size:13px;line-height:1.45;color:#C9CFDC;margin-bottom:12px}

.t-sec{margin:20px 0 0}

.rs-col{display:flex;flex-direction:column;gap:12px;flex:1;min-width:0}

.tm-tx span{font-size:12px;color:var(--text2);line-height:1.4}
.tm-tag{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin-top:3px}

.tm-foot{font-size:12px;color:var(--text3);padding-top:8px}

// ── IndexedDB photo store (base64 photos are too big for localStorage's ~5MB cap) ──
const IDB_NAME='lockin-db',IDB_STORE='photos';
function genPhotoId(ts){return 'p_'+(ts||Date.now())+'_'+Math.random().toString(36).slice(2,7);}
function idbOpen(){return new Promise((res,rej)=>{try{const req=indexedDB.open(IDB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE,{keyPath:'id'});};req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);}catch(e){rej(e);}});}
function idbAll(){return idbOpen().then(db=>new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readonly');const r=t.objectStore(IDB_STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);}));}
function idbPut(photo){return idbOpen().then(db=>new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readwrite');t.objectStore(IDB_STORE).put(photo);t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error);}));}
function idbPutAll(arr){return idbOpen().then(db=>new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readwrite');const s=t.objectStore(IDB_STORE);arr.forEach(p=>s.put(p));t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error);}));}
function idbDelete(id){return idbOpen().then(db=>new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readwrite');t.objectStore(IDB_STORE).delete(id);t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error);}));}
function persistPhoto(p){idbPut(p).catch(e=>{console.warn('photo save failed',e);alert('That photo could not be saved — your device storage may be full. Your other data is safe.');});}
function localDateStr(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function getToday(){return localDateStr(new Date())}
function getVD(){return state.viewDate||getToday()}
function isViewingToday(){return getVD()===getToday()}
function daysBetween(a,b){return Math.ceil((new Date(b)-new Date(a))/(864e5))}
function round1(n){return Math.round(n*10)/10}
function fmtDate(d){const dt=new Date(d+'T12:00:00');return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function fmtShort(d){const dt=new Date(d+'T12:00:00');return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})}

function shiftDate(days){
  const d=new Date(getVD()+'T12:00:00');
  d.setDate(d.getDate()+days);
  const ds=localDateStr(d);
  const today=getToday();
  if(ds>today) return; // can't go into future
  state.viewDate=ds;
  render();
}

function genGoalId(){return 'g_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}

// Stable, varied neon color per completed goal (hashed from its id → always the same badge color)
const GOAL_BADGE_PALETTE=[
  {hex:'#2EE6F5',rgb:'0,240,255'},   // cyan
  {hex:'#FF5C93',rgb:'255,45,120'},  // pink
  {hex:'#FFD866',rgb:'252,238,10'},  // yellow

function badgeColorFor(id){
  const s=String(id);let h=0;
  for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
  return GOAL_BADGE_PALETTE[h%GOAL_BADGE_PALETTE.length];
}
function mergeGoals(a,b){
  const seen=new Set(),out=[];
  [...(a||[]),...(b||[])].forEach(g=>{
    if(!g)return;
    const id=g.id||genGoalId();
    if(seen.has(id))return;
    seen.add(id);out.push({...g,id});
  });
  return out;
}

// STREAK / MOMENTUM
// ═══════════════════════════════════════════
function getActivityLevel(date){
  let s=0;const d=state.data;
  if(d.weights[date])s++;
  if(d.meals[date]&&d.meals[date].length>0)s++;
  if(d.workouts[date]&&d.workouts[date].length>0)s++;
  if(d.focus[date]&&d.focus[date].length>0)s++;
  if(d.sleep[date])s++;
  return Math.min(s,4);
}

function getCurrentStreak(){
  let streak=0;let d=new Date();
  if(getActivityLevel(getToday())>0)streak++;
  d.setDate(d.getDate()-1);
  while(true){
    const ds=localDateStr(d);
    if(getActivityLevel(ds)>0){streak++;d.setDate(d.getDate()-1);}
    else break;
    if(streak>365)break;
  }
  return streak;
}

function getLongestStreak(){
  const allDates=new Set([...Object.keys(state.data.weights),...Object.keys(state.data.meals),...Object.keys(state.data.workouts),...Object.keys(state.data.focus),...Object.keys(state.data.sleep)]);
  if(allDates.size===0)return 0;
  const sorted=[...allDates].sort();
  let longest=1,current=1;
  for(let i=1;i<sorted.length;i++){
    if(daysBetween(sorted[i-1],sorted[i])===1){current++;longest=Math.max(longest,current);}
    else current=1;
  }
  return longest;
}

function getLatestWeight(){
  const dates=Object.keys(state.data.weights).sort();
  return dates.length>0?state.data.weights[dates[dates.length-1]]:null;
}

// ENERGY BALANCE + EXECUTION ENGINE (v10)
// ═══════════════════════════════════════════
function dayEnergy(date){
  const d=state.data,cfg=d.config;
  const intake=dayIntake(date);
  const hasMeals=(d.meals[date]||[]).length>0;
  const wt=watchTdee(date);
  const cal=calibrationAt(date);
  const calTdee=cal?Math.round(cal.maint+(wt.tdee-cal.watchAvg)):null;
  const pb=physBurn(date);const pad=padAt(date);const split=daySplit(date);
  const adjIntake=Math.round(split.known+split.home*(1+pad.pHome)+split.est*(1+pad.pEst));
  let basis=cfg.scoreBasis||'physio';
  if(basis==='physio'&&!pb)basis=calTdee!=null?'calibrated':'watch';
  if(basis==='calibrated'&&calTdee==null)basis='watch';
  const tdee=basis==='physio'?pb.tdee:basis==='calibrated'?calTdee:wt.tdee;
  const eaten=basis==='physio'?adjIntake:intake;
  const deficit=hasMeals?(tdee-eaten):null;
  return{intake,hasMeals,activeRaw:wt.activeRaw,usedActive:wt.usedActive,isEstimated:wt.isEstimated,adjActive:wt.adjActive,
    rest:wt.rest,restLogged:wt.restLogged,watchTdee:wt.tdee,calTdee,cal,calibrated:basis==='calibrated',basis,physio:pb,pad,split,adjIntake,eaten,tdee,deficit};
}
function rollingDeficit(days){
  const today=new Date();let totalDef=0,counted=0,estDays=0;
  for(let i=0;i<days;i++){
    const dt=new Date(today);dt.setDate(dt.getDate()-i);
    const ds=localDateStr(dt);
    const e=dayEnergy(ds);
    if(e.deficit!=null){totalDef+=e.deficit;counted++;if(e.isEstimated)estDays++;}
  }
  const avgDef=counted>0?Math.round(totalDef/counted):null;
  const projectedWeeklyLoss=avgDef!=null?Math.round((avgDef*7/3500)*10)/10:null;
  return{avgDef,counted,estDays,projectedWeeklyLoss};
}
function executionScore(date){
  const d=state.data,cfg=d.config;
  const meals=d.meals[date]||[];
  if(meals.length===0)return null;
  const protein=meals.reduce((s,m)=>s+(m.protein||0),0);
  const water=d.water[date]||0;
  const workouts=d.workouts[date]||[];
  const sleep=d.sleep[date];
  const e=dayEnergy(date);
  const parts={};
  if(e.deficit!=null){
    const T=cfg.deficitTarget||500; // full credit at the target deficit; monotonic everywhere below it
    if(e.deficit>=T)parts.deficit=30;
    else if(e.deficit>=0)parts.deficit=Math.round(9+(e.deficit/T)*21);
    else parts.deficit=Math.max(0,Math.round(9+e.deficit/40));
  }else parts.deficit=0;
  const proT=cfg.proteinTarget||150;
  parts.protein=Math.min(30,Math.round((protein/proT)*30));
  const waterT=cfg.waterTarget||110;
  parts.water=Math.min(20,Math.round((water/waterT)*20));
  parts.training=workouts.length>0?10:0;
  const sleepT=cfg.sleepTarget||7.5;
  parts.sleep=sleep?Math.min(10,Math.round((sleep.hours/sleepT)*10)):0;
  const score=Math.min(100,parts.deficit+parts.protein+parts.water+parts.training+parts.sleep);
  return{score,parts};
}
function weeklyExecution(){
  const today=new Date();let sum=0,n=0;
  for(let i=0;i<7;i++){
    const dt=new Date(today);dt.setDate(dt.getDate()-i);
    const ds=localDateStr(dt);
    const s=executionScore(ds);
    if(s){sum+=s.score;n++;}
  }
  return n>0?{avg:Math.round(sum/n),days:n}:null;
}
function waterFlagFor(date){
  const d=state.data;
  const dates=Object.keys(d.weights).sort();
  const idx=dates.indexOf(date);
  if(idx<1)return null;
  const jump=d.weights[date]-d.weights[dates[idx-1]];
  if(jump<=0.3)return null;
  const e=dayEnergy(dates[idx-1]);
  if(e.deficit!=null&&e.deficit>0){
    return `Scale up ${Math.round(jump*10)/10} lb but the prior day logged a deficit — almost certainly water, not fat.`;
  }
  return null;
}

// ═══════════════════════════════════════════
// TRAJECTORY / TREND ENGINE
// ═══════════════════════════════════════════
function sortedWeightEntries(){
  return Object.keys(state.data.weights).sort().map(d=>({date:d,w:state.data.weights[d]}));
}
// Rolling average of the last `win` values, aligned per entry
function rollingAvgSeries(entries,win){
  return entries.map((e,i)=>{
    const s=Math.max(0,i-win+1);
    const slice=entries.slice(s,i+1);
    const avg=slice.reduce((a,b)=>a+b.w,0)/slice.length;
    return {date:e.date,avg:avg};
  });
}
// Least-squares slope in lbs/day over given entries (x = days since first). Kept as a degenerate fallback.
function trendSlope(entries){
  if(entries.length<2)return null;
  const x0=new Date(entries[0].date+'T12:00:00').getTime();
  const pts=entries.map(e=>({x:(new Date(e.date+'T12:00:00').getTime()-x0)/864e5,y:e.w}));
  const n=pts.length;
  const sx=pts.reduce((a,p)=>a+p.x,0);
  const sy=pts.reduce((a,p)=>a+p.y,0);
  const sxy=pts.reduce((a,p)=>a+p.x*p.y,0);
  const sxx=pts.reduce((a,p)=>a+p.x*p.x,0);
  const denom=(n*sxx-sx*sx);
  if(denom===0)return null;
  return (n*sxy-sx*sy)/denom;
}
// Theil–Sen robust slope (median of ALL pairwise slopes), lbs/day.
// Median-of-slopes resists outliers: a 3–4 day water spike is a minority of the pairs,
// so it can't drag the trend the way least-squares does. This is the fix for the
// "goal in 2.5 years" artifact that appears after a salty weekend.
function theilSenSlope(entries){
  if(!entries||entries.length<2)return null;
  const pts=entries.map(e=>({x:new Date(e.date+'T12:00:00').getTime()/864e5,y:e.w}));
  const slopes=[];
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    const dx=pts[j].x-pts[i].x;
    if(dx!==0)slopes.push((pts[j].y-pts[i].y)/dx);
  }
  if(!slopes.length)return null;
  slopes.sort((a,b)=>a-b);
  const m=Math.floor(slopes.length/2);
  return slopes.length%2?slopes[m]:(slopes[m-1]+slopes[m])/2;
}
function getTrajectory(){
  const entries=sortedWeightEntries();
  if(entries.length<3)return null;
  const today=getToday();

  // ── Robust pace: Theil–Sen over the last 28 days (needs ≥5 pts, else last 10 entries) ──
  const win=entries.filter(e=>daysBetween(e.date,today)<=28);
  const recent=win.length>=5?win:entries.slice(-Math.min(entries.length,10));
  let slope=theilSenSlope(recent);
  if(slope===null)slope=trendSlope(recent); // degenerate fallback only

  const roll=rollingAvgSeries(entries,7);
  const smoothedLatest=round1(roll[roll.length-1].avg);
  const goal=state.data.config.goalWeight;
  const up=goalDir()==='bulk'?true:goalDir()==='cut'?false:goal>smoothedLatest;
  const weekly=round1(slope*7);

  // ── Since-start endpoint pace (naive: total lost / total weeks) ──
  const firstE=entries[0],lastE=entries[entries.length-1];
  const elapsed=Math.max(1,daysBetween(firstE.date,lastE.date));
  const sinceStartDaily=(lastE.w-firstE.w)/elapsed;
  const sinceStartWeekly=round1(sinceStartDaily*7);

  const gd=state.data.config.goalDate;
  const daysToGoalDt=gd?daysBetween(today,gd):null;

  // ── ETA helpers with sanity guard ──
  const CAP=730; // never project further than ~2 years; beyond that we call it "flat" instead of a scary number
  const etaDays=(dailySlope)=>{
    if(up?smoothedLatest>=goal:smoothedLatest<=goal)return 0;
    if(up?dailySlope<=0.005:dailySlope>=-0.005)return null;              // flat or gaining → no finite ETA
    const d=Math.ceil(Math.abs(goal-smoothedLatest)/Math.abs(dailySlope));
    return (d>CAP||!isFinite(d))?null:d;
  };
  const etaDate=(days)=>{
    if(days==null)return null;
    const dt=new Date(today+'T12:00:00');dt.setDate(dt.getDate()+days);
    return dt.toISOString().slice(0,10);
  };

  const daysToGoal=etaDays(slope);
  const projGoalDate=etaDate(daysToGoal);

  // ── ETA window: robust pace ↔ since-start pace (brackets reality) ──
  const dR=etaDays(slope),dS=etaDays(sinceStartDaily);
  const both=[dR,dS].filter(v=>v!=null);
  const etaEarly=both.length?etaDate(Math.min(...both)):null;
  const etaLate=both.length?etaDate(Math.max(...both)):null;

  // ── Projected weight on the goal date (robust slope) ──
  let projGoal=null;
  if(daysToGoalDt!=null&&!isNaN(daysToGoalDt))projGoal=round1(smoothedLatest+slope*daysToGoalDt);

  const flat=up?(slope<=0.02&&smoothedLatest<goal):(slope>=-0.02&&smoothedLatest>goal); // water-dominated stall right now

  return {smoothedLatest,weekly,slope,sinceStartWeekly,
          projGoalDate,daysToGoal,projGoal,goalTargetDate:gd,goal,
          up,reachedGoal:up?smoothedLatest>=goal:smoothedLatest<=goal,etaEarly,etaLate,flat};
}

function median(a){if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2);}
function mealFrequency(){
  const freq={};
  Object.values(state.data.meals).forEach(arr=>(arr||[]).forEach(m=>{
    const key=(m.name||'').trim();if(!key)return;
    const lk=key.toLowerCase();
    if(!freq[lk])freq[lk]={name:key,count:0,cal:[],pro:[]};
    freq[lk].count++;freq[lk].cal.push(m.calories||0);freq[lk].pro.push(m.protein||0);
  }));
  return freq;
}
function getQuickMeals(){
  const favs=(state.data.favorites||[]).map(f=>({name:f.name,calories:f.calories,protein:f.protein,fav:true}));
  const favNames=new Set(favs.map(f=>f.name.toLowerCase()));
  const freq=mealFrequency();
  const freqList=Object.values(freq)
    .filter(f=>f.count>=2 && !favNames.has(f.name.toLowerCase()))
    .sort((a,b)=>b.count-a.count)
    .slice(0,8)
    .map(f=>({name:f.name,calories:median(f.cal),protein:median(f.pro),fav:false}));
  return [...favs,...freqList].slice(0,12);
}
function renderQuickChips(ctx){
  QUICK=getQuickMeals();
  if(QUICK.length===0)return '';
  const chips=QUICK.map((q,i)=>`<button class="chip" onclick="quickAdd(${i})">${q.fav?'★ ':'+ '}${q.name}<span class="chip-macro">${q.calories}·${q.protein}g</span></button>`).join('');
  if(ctx==='modal'){
    return `<div style="margin-bottom:14px"><label>⚡ Quick add</label><div class="chips-row">${chips}</div></div>`;
  }
  return `<div class="card"><div class="card-title">⚡ Quick Add</div><div class="chips-row">${chips}</div></div>`;
}
function quickAdd(i){
  const q=QUICK[i];if(!q)return;
  const vd=getVD();
  if(!state.data.meals[vd])state.data.meals[vd]=[];
  state.data.meals[vd].push({name:q.name,calories:q.calories,protein:q.protein});
  save();render();
}
// ── Hydration ──
function addWater(oz){
  const vd=getVD();
  const cur=state.data.water[vd]||0;
  const next=Math.max(0,cur+oz);
  if(next===0)delete state.data.water[vd]; else state.data.water[vd]=next;
  save();render();
}
function resetWater(){const vd=getVD();delete state.data.water[vd];save();render();}
function renderHydration(){
  const vd=getVD();
  const oz=state.data.water[vd]||0;
  const target=state.data.config.waterTarget||110;
  const remaining=Math.max(0,target-oz);
  const hit=oz>=target;
  const R=52,C=2*Math.PI*R;
  const off=C*(1-Math.min(1,oz/target));
  const col=hit?'#3DF5A0':'#2EE6F5';
  const glow=hit?'rgba(61,245,160,.6)':'rgba(46,230,245,.6)';
  return `<div class="card"><div class="card-title">💧 Hydration</div>
    <div style="display:flex;align-items:center;gap:18px">

        </svg>
      </div>
      <div style="flex:1">
        <div style="font-family:'JetBrains Mono',monospace;font-size:14px;color:${hit?'#3DF5A0':'var(--text2)'};margin-bottom:10px">${hit?'✅ Target hit':remaining+' oz to go'}</div>
        <div style="display:flex;gap:8px">
          <button class="water-btn" onclick="addWater(8)">+8</button>
          <button class="water-btn" onclick="addWater(16)">+16</button>

          <span style="font-size:12px;color:var(--text2);cursor:pointer" onclick="resetWater()">reset</span>
        </div>
      </div>
    </div>
  </div>`;
}

// ── Next Up recommender ─────────────────────────────────────
const SESSION_TYPES=[

function sessionTypeOf(w){

}
function lastRoutineFor(typeKey){

function routinesFor(type){

function nextUp(){
  const today=getToday();

  const planDay=doneToday.length?addDays(today,1):today;
  const rec=muscleRecency(planDay===today?addDays(today,-1):today);
  const yesterdayOfPlan=addDays(planDay,-1);
  const scored=SESSION_TYPES.map(t=>{

    const blockers=t.primaries.filter(m=>{const ds=daysSinceDate(rec[m].p,planDay);return ds!=null&&ds<2;});
    const ready=blockers.length===0;
    const weekCount=countSessions(t.key,addDays(planDay,-7),yesterdayOfPlan);
    const behind=Math.max(0,t.weekly-weekCount);
    const score=(dsMain==null?30:Math.min(dsMain,14)*2)+behind*4;
    return {t,dsMain,ready,blockers,weekCount,behind,score};
  });
  const ready=scored.filter(s=>s.ready).sort((a,b)=>b.score-a.score);
  // Rest is recommended after 6 CONSECUTIVE lifting days (a 6-on/1-off rhythm), not 6-of-7.
  let streak=0;for(let i=1;i<=10;i++){const dd=addDays(planDay,-i);if((state.data.workouts[dd]||[]).some(w=>sessionTypeOf(w)))streak++;else break;}
  const liftDays7=streak;
  const pick=(streak>=6||!ready.length)?null:ready[0];
  const coreDs=daysSinceDate(rec.core.any,planDay);
  const cardio7=Object.keys(state.data.workouts).filter(d=>d>=addDays(planDay,-7)&&d<planDay).reduce((c,d)=>c+(state.data.workouts[d]||[]).filter(w=>workoutMuscles(w).some(([m])=>m==='cardio')).length,0);

  if(cardio7<3)addons.push({cat:'cardio',id:'cardio-incline',label:'Incline walk',why:`cardio ${cardio7}/3 this week`});
  return {planDay,isTomorrow:planDay!==today,doneToday,pick,scored,addons,rec,liftDays7,routine:pick?suggestRoutine(pick.t):null};
}

// ── Strength log ────────────────────────────────────────────
// data.lifts = { 'YYYY-MM-DD': { 'Flat Bench Press': {mode:'load'|'assist'|'bw', sets:[{w,r}]} } }
function parseScheme(s){
  if(!s)return null;const t=String(s).replace(/x/gi,'×').trim();
  let m=t.match(/^(\d+)\s*×\s*(\d+)(?:\s*-\s*(\d+))?\s*(?:\/\s*(?:side|leg))?\s*(?:each)?$/i);
  if(m)return {sets:+m[1],lo:+m[2],hi:+(m[3]||m[2])};
  m=t.match(/^(\d+)\s*×\s*(max|amrap)$/i);

}
function defaultLiftMode(name){
  const n=name.toLowerCase();
  const def=findExerciseDef(name);if(def&&def.mode)return def.mode;
  if(/assist/.test(n)||/pull-?ups?|chin-?ups?/.test(n))return 'assist';
  if(BW_RX.test(n))return 'bw';
  return 'load';
}
function liftIncrement(name,mode){
  if(/squat|deadlift|leg press|hack|hip thrust|romanian|rdl|calf/i.test(name))return 10;
  return 5;
}
function epley(w,r){if(!(w>0)||!(r>0))return 0;return r===1?w:w*(1+Math.min(r,15)/30);}
function allLiftHistory(){
  if(LIFT_CACHE)return LIFT_CACHE;
  const L=state.data.lifts||{};const by={};
  Object.keys(L).sort().forEach(d=>{
    Object.entries(L[d]||{}).forEach(([name,e])=>{
      const sets=(e.sets||[]).filter(s=>s&&s.r>0);
      if(!sets.length)return;
      (by[name]=by[name]||[]).push({...sessionMetrics(name,d,e.mode||defaultLiftMode(name),sets),role:e.role||null});
    });
  });
  return (LIFT_CACHE=by);
}
function sessionMetrics(name,date,mode,sets){
  const bw=bodyweightOn(date);

  sets.forEach(s=>{
    const w=+s.w||0,r=+s.r||0;
    const eff=mode==='assist'?Math.max(0,bw-w):mode==='bw'?bw+w:w;
    best=Math.max(best,epley(eff,r));

  });
  // metric charted: load → e1RM · assist → assistance used (lower = better) · bw → best reps
  const metric=mode==='load'?Math.round(best):mode==='assist'?minAssist:bestReps;
  return {date,mode,sets,e1rm:Math.round(best),topW,bestReps,minAssist,metric,bw};
}
function liftHistory(name,before){const h=allLiftHistory()[name]||[];return before?h.filter(s=>s.date<before):h;}
function isBetter(mode,a,b){return mode==='assist'?a<b:a>b;} // assist: less help = better
function sessionIsPR(name,date){
  const h=allLiftHistory()[name]||[];const cur=h.find(s=>s.date===date);if(!cur)return false;
  const prior=h.filter(s=>s.date<date&&s.mode===cur.mode);if(!prior.length)return false;
  const key=cur.mode==='load'?'e1rm':'metric';
  const bestPrior=prior.reduce((b,s)=>b==null?s[key]:(isBetter(cur.mode,s[key],b)?s[key]:b),null);
  return bestPrior!=null&&isBetter(cur.mode,cur[key],bestPrior);
}
function prsOn(date){

}
function fmtSets(sets,mode){

// Double progression: own the rep range at a weight, then add load (or remove assistance).
function liftSuggestion(name,scheme,before){
  const h=liftHistory(name,before);
  const last=h[h.length-1];
  const sc=scheme||{sets:3,lo:8,hi:12};
  if(!last){
    if(sc.max)return {w:null,text:'First log — go to failure with clean reps. That number becomes the one to beat.'};
    return {w:null,text:`First log — pick a weight you can do for ${sc.lo}${sc.hi!==sc.lo?'–'+sc.hi:''} clean reps with 1–2 left in the tank.`};
  }
  const mode=last.mode,inc=liftIncrement(name,mode);
  if(sc.max||mode==='bw'){

    return {w:mode==='bw'?(+last.sets[0].w||0):null,text:`Beat last: best set ${last.bestReps} reps (${tot} total). One more rep on any set is progress.`};
  }

    if(allHit){const nw=Math.max(0,W-inc);return {w:nw,text:nw===0?`You owned ${W} lb assist — try it UNASSISTED.`:`Hit ${sc.hi} on every set → drop assistance to ${nw} lb.`};}
    return {w:W,text:`Stay at ${W} lb assist — chase ${sc.hi} reps on all ${sc.sets} sets, then drop ${inc} lb.`};
  }
  const W=last.topW;const atW=last.sets.filter(s=>+s.w===W);
  const allHit=last.sets.length>=sc.sets&&atW.length>=sc.sets&&atW.every(s=>s.r>=sc.hi);

  if(allHit)return {w:W+inc,text:`Hit ${sc.hi} on all ${sc.sets} sets at ${W} → go ${W+inc} today.`};
  if(missed)return {w:W,text:`Hold ${W}. A set fell under ${sc.lo} last time — own this weight before adding.`};

}
function lastModeFor(name){const h=allLiftHistory()[name]||[];return h.length?h[h.length-1].mode:defaultLiftMode(name);}
function liftEntry(vd,name,create,role){

// ── Calibration: maintenance measured from YOUR log + YOUR scale ──
// maintenance ≈ avg logged intake − (robust weight slope × 3500). It absorbs every error at once:
// watch over-count, resting-estimate error AND logging under-count. It's in "your logged-calorie units".
function avgRestingRecent(asOf){
  const r=state.data.resting||{};const vals=[];
  for(let i=0;i<21;i++){const d=addDays(asOf,-i);if(r[d])vals.push(r[d]);}

  const weighs=Object.keys(state.data.weights).filter(d=>d>=start&&d<=end).sort().map(d=>({date:d,w:state.data.weights[d]}));
  let res=null;
  if(intakeDays.length>=10&&weighs.length>=6&&daysBetween(weighs[0].date,weighs[weighs.length-1].date)>=14){
    const slope=theilSenSlope(weighs);

  }

function calibrationAt(date){const today=getToday();const e=addDays(date,14);return calibrationEnding(e>today?today:e);}

// ── Daily Debrief ───────────────────────────────────────────
const ESTIMATE_RX=/pizza|pasta|rigatoni|farfalle|mac|burger|fries|fried|wing|cook ?out|zaxby|zaki|chick-?fil|cfa|sandwich|sub\b|jimmy|taco|burrito|nacho|calamari|mozz|cake|pudding|cookie|brownie|ice cream|dessert|pulled pork|bbq|shawarma|gyro|restaurant|sushi|poke|pad thai|hibachi|lo mein|fried rice|grilled cheese|biscuit|donut|muffin|takeout|eating out/i;

function dayDebrief(date){

  // Protein

  else if(meals.length)(inProgress?heads:fixes).push(inProgress?`${proT-protein}g protein to go — a shake (~40g) or 5 oz chicken (~45g) closes it.`:`Protein ${protein}/${proT}g — ${proT-protein}g short. Easiest fix: a shake or 5 oz chicken.`);
  // Energy balance — judged against the goal (cut: deficit · maintain: near zero · bulk: surplus)

      else if(sur>=T*0.6&&sur<=T*2.2)wins.push(`Surplus ~${sur} (${basis}) — growth day.`);
      else if(sur>T*2.2)fixes.push(`Surplus ~${sur} (${basis}) — well past your ${T}. Calories past that mostly become fat.`);
      else fixes.push(`${sur>=0?'Surplus only ~'+sur:'Deficit ~'+(-sur)} (${basis}) vs your +${T} target — you can't build on an empty tank.`);}
    else if(gd==='maintain'){const a=Math.abs(e.deficit);

      heads.push(room>0?`~${room} cal left to land a ${defT} deficit (${basis} burn ~${e.tdee}).`:`Already past the ${defT}-deficit budget by ~${-room} — keep the rest of today lean & high-protein.`);
    }else if(e.deficit>=defT)wins.push(`Deficit ~${e.deficit} (${basis}) — fat-loss day.`);
    else if(e.deficit>=0)fixes.push(`Deficit only ~${e.deficit} (${basis}) vs your ${defT} target — near maintenance.`);
    else fixes.push(`Surplus ~${-e.deficit} (${basis}). One day won't matter — the pattern does.`);
  }
  // Estimate-heavy & salty & alcohol
  const est=meals.filter(m=>mealSrc(m)==='est');
  const estCal=est.reduce((a,m)=>a+(m.calories||0),0);
  if(est.length>=2||(intake&&estCal/intake>=0.4&&est.length)){
    fixes.push(`Estimate-heavy: ${est.map(m=>m.name).slice(0,3).join(', ')}${est.length>3?'…':''}. Your scale says these really cost ~${Math.round(e.pad.pEst*100)}% more than logged (~${Math.round(estCal*e.pad.pEst/10)*10} cal) — already counted in the deficit.`);
  }
  const sdw=socialDaysWeek(date);if(sdw.length>=2)fixes.push(`${sdw.length} social days this week (${sdw.map(fmtShort).join(', ')}). One is the plan — two is the stall.`);
  const salty=meals.filter(m=>SALTY_RX.test(m.name||''));
  if(salty.length)heads.push(`Salty day (${salty.map(m=>m.name).slice(0,2).join(', ')}) — expect a 1–3 lb water bump tomorrow. Not fat.`);
  const booze=meals.filter(m=>ALCOHOL_RX.test(m.name||''));
  if(booze.length)heads.push(`Alcohol (~${booze.reduce((a,m)=>a+(m.calories||0),0)} cal) — fat burning pauses while it clears. Extra water tonight.`);
  // Water
  if(water>=waterT)wins.push(`Water ${water} oz — target hit.`);
  else if(inProgress)heads.push(`${waterT-water} oz water to go.`);
  else if(water)fixes.push(`Water ${water}/${waterT} oz — front-load it tomorrow (32 oz by noon).`);
  // Sleep
  if(sleep){
    if(sleep.hours>=sleepT)wins.push(`Slept ${sleep.hours}h.`);
    else if(sleep.hours<sleepT-0.5)fixes.push(`Slept ${sleep.hours}h vs ${sleepT}h — short sleep raises hunger and water retention.`);
  }else if(date!==today)heads.push('No sleep logged — log it for a complete score.');
  // Training + PRs
  if(workouts.length){
    wins.push(`Trained: ${workouts.map(w=>w.routine?`${w.name} (${w.routine})`:w.name).join(', ')}.`);
    const prs=prsOn(date);
    if(prs.length)wins.push(`PR${prs.length>1?'s':''}: ${prs.join(', ')}.`);
  }else{
    const recent=[1,2].every(i=>!(d.workouts[addDays(date,-i)]||[]).length);
    if(recent&&!inProgress)fixes.push('Third straight day without training logged.');
    else if(!inProgress)heads.push('Rest day — recovery counts.');
  }
  const rec=muscleRecency(date);const legDs=daysSinceDate(rec.legs.p,date);
  if(legDs==null||legDs>=7)heads.push(`Legs ${legDs==null?'never trained':`untouched ${legDs} days`} — your biggest muscles are sitting idle.`);
  if(!inProgress&&e.isEstimated&&meals.length)heads.push('Active calories not logged — burn is estimated.');
  // Focus: the single most valuable fix
  let focus='';
  const f=fixes.join(' ');
  if(/Protein/.test(f))focus=`Protein first: build tomorrow around ${proT}g — plan the shake and the chicken before you plan anything else.`;
  else if(/empty tank/.test(f))focus='Eat more tomorrow: plan a 600-cal shake on top of your meals — you can\'t build on an empty tank.';
  else if(/mostly become fat/.test(f))focus='Trim the overshoot: stop around 300 over target. Past that grows the waist, not the arms.';
  else if(/social days/.test(f))focus='One social meal per weekend, on one day. The other weekend day runs like a Tuesday.';
  else if(/Surplus|near maintenance/.test(f))focus='Make tomorrow a weighed day: Weigh & Log on Fuel for every plate — weighed food needs no padding.';
  else if(/Estimate-heavy/.test(f))focus='Make tomorrow a "known numbers" day — weighed chicken, rice, yogurt. Let the estimates rest.';
  else if(/Slept/.test(f))focus=`Protect sleep: lights out early enough for ${sleepT}h.`;
  else if(/Water/.test(f))focus='Water: 32 oz before noon, 80 by 5 PM.';
  else if(/training/.test(f))focus='Get a session in — even 30 minutes keeps the streak and the muscle.';
  else if(inProgress)focus='On track — finish the day the way you started it.';
  else focus='Clean day. Repeat it.';
  return {wins,fixes,heads,focus,inProgress};
}

// ── Weekly Review (Mon–Sun) ─────────────────────────────────
function weekStart(ds){const d=new Date(ds+'T12:00:00');const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return localDateStr(d);}
function weeklyReview(offset){
  const today=getToday();
  let ws=weekStart(today);
  ws=addDays(ws,-7*offset);
  const we=addDays(ws,6);
  const days=[];for(let i=0;i<7;i++)days.push(addDays(ws,i));
  const past=days.filter(d=>d<=today);
  const d=state.data,cfg=d.config;
  const wavg=(arr)=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null;
  const wThis=past.map(x=>d.weights[x]).filter(Boolean);
  const wPrev=days.map(x=>d.weights[addDays(x,-7)]).filter(Boolean);
  const logged=past.filter(x=>(d.meals[x]||[]).length);
  const intakeAvg=wavg(logged.map(dayIntake));
  const proAvg=wavg(logged.map(dayProtein));
  const proHit=logged.filter(x=>dayProtein(x)>=(cfg.proteinTarget||150)).length;
  const waterDays=past.filter(x=>d.water[x]);
  const waterHit=waterDays.filter(x=>d.water[x]>=(cfg.waterTarget||110)).length;
  const sleeps=past.map(x=>d.sleep[x]).filter(Boolean);
  const execs=past.map(x=>executionScore(x)).filter(Boolean).map(s=>s.score);
  const defs=logged.map(x=>dayEnergy(x)).filter(e=>e.deficit!=null);
  const defAvg=wavg(defs.map(e=>e.deficit));
  const sess={};let total=0;
  past.forEach(x=>(d.workouts[x]||[]).forEach(w=>{const t=sessionTypeOf(w);const k=t==='pb'?({'pb-l1':'Legs','pb-l2':'Legs','pb-u1':'Upper','pb-u2':'Upper','pb-arms':'Arms','pb-cond':'Cardio'}[w.pb]||'Lift'):t?SESSION_TYPES.find(s=>s.key===t).label:(workoutMuscles(w).some(([m])=>m==='cardio')?'Cardio':workoutMuscles(w).some(([m])=>m==='core')?'Core':'Other');sess[k]=(sess[k]||0)+1;total++;}));
  const prs=[];past.forEach(x=>prsOn(x).forEach(n=>prs.push(n)));
  const waistIn=Object.keys(d.waist||{}).filter(x=>x>=ws&&x<=we).sort();
  const thisAvg=wavg(wThis),prevAvg=wavg(wPrev);
  const change=(thisAvg!=null&&prevAvg!=null)?round1(thisAvg-prevAvg):null;
  const execAvg=execs.length?Math.round(wavg(execs)):null;
  // Focus for next week
  let focus='';
  const missingLegs=!(sess['Legs']>0);
  if(logged.length&&proHit<logged.length*0.7)focus=`Protein consistency: hit ${cfg.proteinTarget}g on 6 of 7 days.`;
  else if(goalDir()==='bulk'&&defAvg!=null&&-defAvg<(cfg.surplusTarget||300)*0.6)focus='Eat more: hit your calorie target 6 of 7 days. Short? A 600-cal shake (milk, oats, peanut butter, whey) closes it.';
  else if(goalDir()==='cut'&&defAvg!=null&&defAvg<(cfg.deficitTarget||500)*0.6)focus='Close the ledger gap: weigh add-ons and pad restaurant meals ~25% every day this week.';
  else if(missingLegs&&total)focus='Two leg days. Non-negotiable.';
  else if(sleeps.length&&wavg(sleeps.map(s=>s.hours))<(cfg.sleepTarget||7.5)-0.4)focus='Sleep: protect the window — it drives hunger and water.';
  else if(waterDays.length&&waterHit<waterDays.length*0.7)focus='Water every day — front-load before noon.';
  else focus='Same week again. Consistency is the cheat code.';
  return {ws,we,complete:we<today,daysIn:past.length,thisAvg:thisAvg!=null?round1(thisAvg):null,prevAvg:prevAvg!=null?round1(prevAvg):null,change,
    intakeAvg:intakeAvg!=null?Math.round(intakeAvg):null,proAvg:proAvg!=null?Math.round(proAvg):null,proHit,logged:logged.length,
    waterHit,waterDays:waterDays.length,sleepAvg:sleeps.length?round1(wavg(sleeps.map(s=>s.hours))):null,
    execAvg,defAvg:defAvg!=null?Math.round(defAvg):null,sess,total,prs,
    waist:waistIn.length?{first:d.waist[waistIn[0]],last:d.waist[waistIn[waistIn.length-1]]}:null,focus};
}

    tip:x=>{const ds=dayStr(x);return `<b>${fmtDate(ds)}</b><span class="sw" style="background:#3DF5A0"></span>${d.weights[ds]!=null?d.weights[ds]+' lb':'—'}<br><span class="sw" style="background:#2EE6F5"></span>7-day ${rmap[ds]!=null?round1(rmap[ds]):'—'}`;}});
  // Strength

  if(sel){
    const mode=sel[sel.length-1].mode;
    const series=[{type:'line',color:'#FF5C93',width:2,points:true,data:sel.map(s=>({x:dayNum(s.date),y:s.metric}))}];
