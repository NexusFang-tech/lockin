// v13.2 — Goal direction (cut · maintain · bulk) drives calories, scoring, missions, training & projections
//         First-run setup for new users · gym type (Planet Fitness / full gym) · bodyweight mode for core moves
// ═══════════════════════════════════════════
function goalDir(){const p=(state.data&&state.data.config&&state.data.config.phase)||'cut';return p==='leanbulk'||p==='bulk'?'bulk':p==='maintain'?'maintain':'cut';}
function goalWord(){return {cut:'Cut',maintain:'Maintain',bulk:'Bulk'}[goalDir()];}
function calFloor(){const c=state.data.config;const t=c.calorieTarget||2100;return Math.max(c.sex==='f'?1200:1500,Math.round(t*0.857/50)*50);}
function cardioGoal(){return goalDir()==='bulk'?2:3;}
function stepGoal(){return goalDir()==='bulk'?6000:8000;}
function volMin(m){return goalDir()==='bulk'?m+2:m;}
const PB_ORDER_ALL=PB_ORDER;
function pbOrder(){return goalDir()==='bulk'?PB_ORDER_ALL.filter(x=>x!=='pb-cond'):PB_ORDER_ALL;}
function goodDelta(ch){if(ch==null)return true;const g=goalDir();return g==='bulk'?ch>=0:g==='maintain'?Math.abs(ch)<=0.6:ch<=0;}
function calTone(cal,calT){const g=goalDir();if(g==='bulk')return cal>=calT?(cal>calT+700?C2.amber:C2.green):C2.amber;if(g==='maintain')return Math.abs(cal-calT)<=150?C2.green:C2.amber;return cal>calT?C2.pink:C2.amber;}

// ── Gym type ──
function gymKind(){return (state.data&&state.data.config&&state.data.config.gym)||'pf';}
function gymFull(){return gymKind()==='full';}
function gymHome(){return gymKind()==='home';}
function homeEq(){const c=state.data.config;if(!c.homeEq)c.homeEq={db:false,dbMax:50,bar:false,bands:false,bench:false};return c.homeEq;}
function gymName(){return gymFull()?'your gym':gymHome()?'home':'Planet Fitness';}

const BW_RX=/push-?ups?|bodyweight|burpee|chair\/bed dips|bed dips|hanging leg raise|leg raises?\b|ab rollout|\brollout|ab wheel|plank|sit-?ups?|v-?ups?|dead ?bug|bird ?dog|hollow/i;

// ── Suggested targets ──
function maintEstimate(){
  const cal=calibrationEnding(getToday());if(cal&&cal.maint>1000)return {v:Math.round(cal.maint/10)*10,src:"your logged intake vs. your scale over the last 4 weeks"};
  const vals=[];for(let i=1;i<=14;i++){const d=addDays(getToday(),-i);if(state.data.active[d]==null)continue;const e=dayEnergy(d);if(e.tdee)vals.push(e.tdee);}
  if(vals.length>=4)return {v:Math.round(vals.reduce((a,b)=>a+b,0)/vals.length/10)*10,src:`your last ${vals.length} days of measured burn`};
  const pb=physBurn(getToday());if(pb)return {v:Math.round(pb.tdee/10)*10,src:'your height, age, weight and a typical active day'};
  const w=getLatestWeight()||state.data.config.startWeight||180;return {v:Math.round(w*15/10)*10,src:'your bodyweight (add height and birth date for a better number)'};
}
function suggestTargets(dir){
  const c=state.data.config;const m=maintEstimate();const w=getLatestWeight()||c.startWeight||180;const g=c.goalWeight||w;
  const r50=x=>Math.round(x/50)*50,r5=x=>Math.round(x/5)*5;
  if(dir==='bulk')return {cal:r50(m.v+(c.surplusTarget||300)),pro:r5(w*1.0),m};
  if(dir==='maintain')return {cal:r50(m.v),pro:r5(w*0.8),m};
  return {cal:Math.max(c.sex==='f'?1200:1500,r50(m.v-(c.deficitTarget||500))),pro:r5(Math.max(g,w*0.8)*0.7),m};
}
function setGoalMode(p){state.data.config.phase=p;save();pbCustomize();render();}
function setPhase(p){if(PHASES[p])setGoalMode(p);}
function applySuggested(){const s=suggestTargets(goalDir());state.data.config.calorieTarget=s.cal;state.data.config.proteinTarget=s.pro;save();render();}
function setGym(g){state.data.config.gym=g;save();pbCustomize();render();}

function modeSets(e){
  if(goalDir()!=='bulk'||e.role)return e.sets;const sc=parseScheme(e.sets);if(!sc||sc.max||sc.sets>3)return e.sets;
  const gs=loadOf(e.name).filter(([,f])=>f>=1).map(([g])=>g);if(!gs.length||gs.every(g=>g==='core'||g==='calves'))return e.sets;
  return String(e.sets).replace(/^\s*(\d+)/,(m,n)=>String(+n+1));
}
function planRoutine(r,sore){
  const items=r.exercises.map(e0=>{const e={...e0,sets:modeSets(e0)};return {ex:e,...exPlan(e,sore)};});
  const sets=e=>{const p=parseScheme(e.sets);return p?p.sets:2;};
  const total=items.reduce((a,i)=>a+sets(i.ex),0),skipped=items.filter(i=>i.status==='skip').reduce((a,i)=>a+sets(i.ex),0);

function executionScore(date){
  const d=state.data,cfg=d.config;const meals=d.meals[date]||[];if(meals.length===0)return null;
  const protein=meals.reduce((s,m)=>s+(m.protein||0),0);const water=d.water[date]||0;const workouts=d.workouts[date]||[];const sleep=d.sleep[date];
  const e=dayEnergy(date);const parts={};const g=goalDir();
  if(e.deficit!=null){

      if(s>=T*0.6&&s<=T*2.2)parts.deficit=30;else if(s>T*2.2)parts.deficit=Math.max(12,Math.round(30-(s-T*2.2)/40));
      else if(s>=0)parts.deficit=Math.round(9+(s/(T*0.6))*21);else parts.deficit=Math.max(0,Math.round(9+s/40));}
    else if(g==='maintain'){const a=Math.abs(e.deficit);parts.deficit=a<=200?30:Math.max(0,Math.round(30-(a-200)/25));}
    else{const T=cfg.deficitTarget||500;if(e.deficit>=T)parts.deficit=30;else if(e.deficit>=0)parts.deficit=Math.round(9+(e.deficit/T)*21);else parts.deficit=Math.max(0,Math.round(9+e.deficit/40));}
  }else parts.deficit=0;
  parts.protein=Math.min(30,Math.round((protein/(cfg.proteinTarget||150))*30));
  parts.water=Math.min(20,Math.round((water/(cfg.waterTarget||110))*20));
  parts.training=workouts.length>0?10:0;
  parts.sleep=sleep?Math.min(10,Math.round((sleep.hours/(cfg.sleepTarget||7.5))*10)):0;
  return{score:Math.min(100,parts.deficit+parts.protein+parts.water+parts.training+parts.sleep),parts};
}

function getPhaseStatus(){

  const trend=t?t.smoothedLatest:getLatestWeight();const start=c.startWeight||trend;

      reason=t.weekly<lo?`Gaining ${t.weekly} lb/wk — under the ${lo}–${hi} lean-gain band. Add ~150 cal a day.`:t.weekly>hi*1.4?`Gaining ${t.weekly} lb/wk — faster than ${hi}. Trim ~150 cal a day to keep it lean.`:`Gaining ${t.weekly} lb/wk — right in the lean-gain band.`;}

function L(k,sets){return {name:LADDERS[k][homeLevel(k)],sets,mode:'bw',ladder:k,note:LADDER_NOTE[k]};}
function D(name,sets,note){return {name,sets,note};}
function buildHomeProgram(){
  const eq=homeEq();const db=!!eq.db,bar=!!eq.bar,bands=!!eq.bands,bench=!!eq.bench;
  const rear=bands?D('Band Pull-Aparts','3×15-20','Arms straight, pull the band to your chest. Rear delts and posture.'):db?D('DB Rear Delt Fly','3×12-15','Hinge forward, lead with the elbows, light weight.'):{name:'Prone Y-T-W Raises',sets:'3×10-12',mode:'bw',note:'Face down, thumbs up, lift the arms into a Y, then T, then W. Slow.'};
  const press=bench?D('DB Bench Press','4×8-12','Weight per hand. Lower to the chest, press up and slightly in.'):D('DB Floor Press','4×8-12','Lying on the floor, elbows touch down each rep. Weight per hand.');
  const pullMain=bar?L('pull','4×5-10'):L('row','4×8-15');
  const core2=bar?L('hang','3×8-15'):L('core','3×10-15');
  const days={
    'pb-u1':{name:'Home Upper A — Push',short:'PUSH',desc:'Chest, shoulders and triceps.',muscles:[['chest','p'],['shoulders','p'],['triceps','p']],
      exercises:db?[press,L('push','3×8-15'),D('DB Shoulder Press','3×8-12','Seated or standing, weight per hand.'),D('DB Lateral Raises','3×12-15','Lead with the elbows, no swing.'),D('DB Overhead Triceps Extension','3×10-15','One dumbbell, both hands, full stretch behind the head.'),rear]
        :[L('push','4×8-15'),L('pike','3×6-12'),L('dip','3×8-15'),L('tri','3×8-15'),rear]},
    'pb-l1':{name:'Home Lower A — Squat',short:'SQUAT',desc:'Quads, glutes and calves.',muscles:[['legs','p'],['core','s']],
      exercises:db?[D('Goblet Squat','4×8-12','Hold one dumbbell at the chest, sit between the hips, full depth.'),D('DB Bulgarian Split Squat','3×8-12/leg','Back foot on a chair, weight per hand. Per leg.'),D('DB Romanian Deadlift','3×8-12','Hips back, dumbbells slide down the thighs, flat back.'),L('bridge','3×10-15'),D('Single-Leg DB Calf Raises','4×10-15','Hold a dumbbell, stand on a step, one leg at a time.'),L('core','3×10-15')]
        :[L('squat','4×8-15'),L('lunge','3×10-12/leg'),L('bridge','3×10-15'),L('calf','4×12-20'),L('core','3×10-15')]},
    'pb-u2':{name:'Home Upper B — Pull',short:'PULL',desc:'Back, rear delts and biceps.',muscles:[['back','p'],['biceps','p'],['shoulders','s']],
      exercises:db?[pullMain,D('One-Arm DB Row','3×8-12/side','Brace on a chair, pull to the hip. Weight per hand.'),rear,D('DB Curls','3×8-12','Strict, elbows pinned. Weight per hand.'),D('Hammer Curls','3×10-12','Neutral grip — forearms and the outer arm.')]
        :[pullMain,bar?L('row','3×8-15'):{name:'Underhand Table Rows',sets:'3×8-12',mode:'bw',note:'Same as table rows with palms facing you — biceps take more of it.'},rear,bands?D('Band Rows','3×12-15','Anchor the band in a door, pull to the ribs.'):{name:'Superman Holds',sets:'3×8-12',mode:'bw',note:'Face down, lift arms and legs, hold 2 seconds each rep.'},bar?L('chin','3×5-10'):{name:'Towel Curls (isometric)',sets:'3×8-12',mode:'bw',note:'Stand on a towel, curl up against it hard for 3 seconds a rep.'}]},
    'pb-l2':{name:'Home Lower B — Hinge',short:'HINGE',desc:'Hamstrings, glutes and core.',muscles:[['legs','p'],['back','s'],['core','s']],
      exercises:db?[D('DB Romanian Deadlift','4×8-12','Slow lowering, big hamstring stretch.'),D('DB Step-ups','3×10-12/leg','Knee-height chair or step. Per leg.'),L('ham','3×6-12'),L('hinge','3×8-12'),core2]
        :[L('hinge','4×8-12'),{name:'Step-ups (chair)',sets:'3×10-15/leg',mode:'bw',note:'Drive through the top leg, no push off the floor. Per leg.'},L('ham','3×6-12'),L('bridge','3×12-20'),core2]},
    'pb-arms':{name:'Home Arms & Shoulders',short:'ARMS',desc:'Biceps, triceps and delts — the pump day.',muscles:[['biceps','p'],['triceps','p'],['shoulders','p']],
      exercises:db?[D('DB Curls','4×8-12','Heaviest curl of the week. Weight per hand.'),L('tri','3×8-15'),D('Hammer Curls','3×10-12','Neutral grip.'),D('DB Overhead Triceps Extension','3×10-15','Full stretch behind the head.'),D('DB Lateral Raises','4×12-20','Higher reps today. Chase the burn.'),L('pike','3×6-12')]
        :[L('tri','4×8-15'),L('dip','3×8-15'),bar?L('chin','3×5-10'):{name:'Underhand Table Rows',sets:'3×8-12',mode:'bw',note:'Palms facing you — biceps.'},L('pike','3×6-12'),bands?D('Band Curls','3×12-15','Stand on the band, elbows pinned.'):rear]},
    'pb-cond':{name:'Home Conditioning + Core',short:'COND',desc:'Optional day 6: a brisk walk or easy jog plus a bodyweight circuit and core.',muscles:[['cardio','p'],['core','p']],
      exercises:[{name:'Brisk Walk or Easy Jog',sets:'25-35 min',note:'Zone 2 — you can talk in short sentences.'},{name:'Bodyweight Circuit (40s on / 20s off)',sets:'4 rounds',note:'Burpees, jump squats, mountain climbers, high knees. Rest 1 minute between rounds.'},L('core','3×10-15'),{name:'Plank',sets:'3×30-60s',note:'Squeeze glutes and abs. Stop when the hips sag.'}]}
  };
  return pbOrderAllIds().map(id=>({id,...days[id]}));
}
function pbOrderAllIds(){return ['pb-u1','pb-l1','pb-u2','pb-l2','pb-arms','pb-cond'];}
let PB_GYM_JSON=null;
function pbCustomize(){
  if(PB_GYM_JSON==null)PB_GYM_JSON=JSON.stringify(WORKOUTS.pb.map(r=>({...r,exercises:r.exercises.map(e=>{const {_orig,...x}=e;return x;})})));
  const isHomeNow=WORKOUTS.pb.length&&/^Home /.test(WORKOUTS.pb[0].name);
  if(gymHome())WORKOUTS.pb.splice(0,WORKOUTS.pb.length,...buildHomeProgram());
  else if(isHomeNow)WORKOUTS.pb.splice(0,WORKOUTS.pb.length,...JSON.parse(PB_GYM_JSON));
  pbCustomizeNotes();
}
function setLadder(k,delta){
  const c=state.data.config;if(!c.homeLevels)c.homeLevels={};
  const from=LADDERS[k][homeLevel(k)];c.homeLevels[k]=Math.max(0,Math.min(LADDERS[k].length-1,homeLevel(k)+delta));const to=LADDERS[k][homeLevel(k)];
  pbCustomize();
  const S=state.session;if(S)S.ex.forEach(x=>{if(x.ladder===k&&x.name===from)x.name=to;});
  save();sessSave();render();
}
function ladderReady(name,vd){const def=findExerciseDef(name);const sc=def&&parseScheme(def.sets);const h=liftHistory(name,vd);const last=h[h.length-1];
  return !!(sc&&last&&last.sets.length>=sc.sets&&last.sets.every(s=>s.r>=sc.hi));}
// Equipment picker (settings + first-run)
function renderHomeEq(ctx){
  const eq=ctx==='wz'?(state.wz.eq||(state.wz.eq={db:false,dbMax:50,bar:false,bands:false,bench:false})):homeEq();
  const chip=(k,l)=>`<button class="eq-chip ${eq[k]?'on':''}" aria-pressed="${!!eq[k]}" onclick="toggleEq('${ctx}','${k}')">${eq[k]?'✓ ':''}${l}</button>`;
  return `<div class="lab" style="margin:12px 0 8px">What you have at home</div>
    <div class="eq-row">${chip('db','Dumbbells')}${chip('bar','Pull-up bar')}${chip('bands','Bands')}${chip('bench','Bench')}</div>
    ${eq.db?`<div class="form-group" style="margin-top:10px"><label for="eq-dbmax">Heaviest dumbbell (lb per hand)</label><input id="eq-dbmax" type="number" inputmode="numeric" value="${eq.dbMax||50}" onchange="setEqMax('${ctx}',this.value)"></div>`:''}
    <p class="muted" style="margin-top:6px">${eq.db?'Dumbbell lifts progress by weight up to your heaviest pair, then by reps and tempo.':'Nothing needed — every move uses your bodyweight and a chair, couch, table or step.'} Bodyweight moves level up through harder variations as you own the reps.</p>`;
}
function toggleEq(ctx,k){if(ctx==='wz'){wzKeep();state.wz.eq[k]=!state.wz.eq[k];render();return;}const eq=homeEq();eq[k]=!eq[k];save();pbCustomize();render();}
function setEqMax(ctx,v){const n=Math.max(5,Math.min(200,+v||50));if(ctx==='wz'){state.wz.eq.dbMax=n;return;}homeEq().dbMax=n;save();render();}
function ladderRow(e,vd){
  const k=e.ladder;const n=LADDERS[k].length;const lv=homeLevel(k);const ready=ladderReady(e.name,vd);const next=LADDERS[k][lv+1];
  return `<div class="ladder ${ready?'ready':''}"><div class="ld-tx"><b>Level ${lv+1} of ${n}</b><span>${ready&&next?`You own the reps — next: ${escapeHTML(next)}`:next?`Next: ${escapeHTML(next)}`:'Top level — add a backpack or slow the tempo'}</span></div>
    <button class="pill-btn ghost" onclick="setLadder('${k}',-1)" ${lv===0?'disabled':''}>Easier</button><button class="pill-btn ${ready?'':'ghost'}" onclick="setLadder('${k}',1)" ${lv>=n-1?'disabled':''}>Harder</button></div>`;
}
const LADDER_LABEL={push:'Push-up',pike:'Overhead push',dip:'Dip',tri:'Triceps push-up',squat:'Squat',lunge:'Lunge',bridge:'Glute bridge',ham:'Hamstring curl',hinge:'Single-leg hinge',calf:'Calf raise',row:'Row',pull:'Pull-up',chin:'Chin-up',core:'Core',hang:'Hanging core'};
function usedLadders(){const s=new Set();WORKOUTS.pb.forEach(r=>r.exercises.forEach(e=>{if(e.ladder)s.add(e.ladder);}));return [...s];}
function renderLadderCard(){
  const rows=usedLadders().map(k=>{const lv=homeLevel(k),n=LADDERS[k].length;const nm=LADDERS[k][lv];const h=liftHistory(nm);const last=h[h.length-1];
    return `<div class="lr"><div class="lr-tx"><span class="lab">${LADDER_LABEL[k]}</span><b>${escapeHTML(nm)}</b><i>Level ${lv+1}/${n}${last?` · best ${last.bestReps} reps (${fmtShort(last.date)})`:' · not logged yet'}</i></div>
      <div class="lr-b"><button class="pill-btn ghost" aria-label="Easier ${LADDER_LABEL[k]}" onclick="setLadder('${k}',-1)" ${lv===0?'disabled':''}>−</button><button class="pill-btn ghost" aria-label="Harder ${LADDER_LABEL[k]}" onclick="setLadder('${k}',1)" ${lv>=n-1?'disabled':''}>+</button></div></div>`;}).join('');
  return `<section class="card"><div class="sec-h"><h2>Home progression</h2><span>harder moves, not heavier plates</span></div>
    <p class="muted" style="margin:-4px 0 8px">Each bodyweight move has a ladder. Own the top of the rep range on every set, then step up. Too hard? Step down — clean reps beat ugly ones.</p>${rows}</section>`;
}
function renderHomeTiles(){
  const t=k=>{const lv=homeLevel(k),n=LADDERS[k].length;const nm=LADDERS[k][lv];const h=liftHistory(nm);const last=h[h.length-1];
    return `<div class="st"><span>${LADDER_LABEL[k]}</span><b style="font-size:18px">L${lv+1}<span style="font-size:12px;color:${C2.text2}">/${n}</span></b><em style="color:${last?C2.green:C2.text3}">${last?'BEST '+last.bestReps+' REPS':'NOT LOGGED'}</em></div>`;};
  const eq=homeEq();
  return `<section class="tri st-row" role="button" onclick="setTrainSeg('strength')">${t('push')}${t('squat')}${t(eq.bar?'pull':'row')}</section><p class="st-note">Your level on each bodyweight ladder. Tap for the full progression.</p>`;
}
function renderHomeProgramList(){
  const eq=homeEq();const have=[eq.db?`dumbbells to ${eq.dbMax||50} lb`:'',eq.bar?'pull-up bar':'',eq.bands?'bands':'',eq.bench?'bench':''].filter(Boolean);
  return `<section class="card"><div class="card-title">Home program</div>
    <p class="muted" style="margin:-4px 0 12px">Built for ${have.length?have.join(', '):'no equipment — just bodyweight, a chair, a table and a step'}. ${goalDir()==='bulk'?'Bulk mode: one extra set on most lifts, five days a week, day 6 is rest.':'Five training days; day 6 (conditioning) is optional.'} Change equipment in Settings.</p>
    ${WORKOUTS.pb.map((r,i)=>`<div class="pg-row"><button class="pg-main" onclick="showWorkoutDetail('pb','${r.id}')"><span class="mono">${i+1}</span><span><b>${escapeHTML(r.name)}</b><i>${escapeHTML(r.exercises.map(e=>e.name.replace(/\s*\(.*\)/,'')).join(' · '))}</i></span></button><button class="pill-btn" onclick="startSession('${r.id}')">Start</button></div>`).join('')}
  </section>${renderLadderCard()}
  <section class="card"><div class="card-title">Other sessions</div>
    ${[['travel','Travel / hotel'],['cardio','Cardio'],['home','Quick home circuits']].map(([cat,l])=>`<div class="lab" style="margin:10px 0 6px">${l}</div>${WORKOUTS[cat].map(c=>`<button class="pg-main solo" onclick="showWorkoutDetail('${cat}','${c.id}')"><span><b>${escapeHTML(c.name)}</b><i>${escapeHTML(c.desc||'')}</i></span></button>`).join('')}`).join('')}
  </section>`;
}
// Bodyweight ladder coaching on top of the normal suggestion
const __liftSuggestionBase=liftSuggestion;
liftSuggestion=function(name,sc,before){
  const def=findExerciseDef(name);
  if(def&&def.ladder&&sc&&!sc.max){
    const k=def.ladder;const next=LADDERS[k][homeLevel(k)+1];const h=liftHistory(name,before);const last=h[h.length-1];
    if(!last)return {w:null,text:`First log — clean reps in the ${sc.lo}–${sc.hi} range. Too easy or too hard? Use Easier / Harder below.`};
    if(ladderReady(name,before))return {w:null,text:next?`You own ${sc.sets}×${sc.hi}. Tap Harder to move up to ${next}.`:`You own ${sc.sets}×${sc.hi} at the top level — wear a loaded backpack or slow every rep to 3 seconds down.`};
    return {w:null,text:`Last: best set ${last.bestReps}. Get every set to ${sc.hi} clean reps, then move up${next?' to '+next:''}.`};
  }
  return __liftSuggestionBase(name,sc,before);
};

function renderLegacy(){
  const app=document.getElementById('app');
  const dtg=daysToGoalDate();const gl=goalLabelStr();
  let subTxt=dtg==null?'set your goal date in settings':(dtg>0?dtg+' days to '+gl:(dtg===0?gl+' is today 🎯':gl+' date has passed'));
  const bd=state.data.config.birthdayDate;
  if(bd){const bdDays=daysBetween(getToday(),bd);if(bdDays>0&&(dtg==null||bdDays<dtg)){subTxt=bdDays+' days to '+(state.data.config.birthdayLabel||'birthday')+' · healthiest of my life';}}
  const modalEl=document.querySelector('.modal');const modalScroll=modalEl?modalEl.scrollTop:0;const modalKey=state.modal;
  const tb=t=>`<button class="tab-btn ${state.tab===t?'active':''}" onclick="setTab('${t}')" aria-current="${state.tab===t?'page':'false'}"><span class="tab-icon">${ICON[TAB_ICONS[t]]||''}</span>${TAB_LABELS[t]}</button>`;
  const tabsHTML=tb('today')+tb('fuel')+`<button class="tab-log" onclick="showModal('log')" aria-label="Log something"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></button>`+tb('train')+tb('progress');

  let content='';
  switch(state.tab){
    case'today':content=renderToday();break;
    case'fuel':content=renderFuel();break;

    case'recharge':content=renderRecharge();break;

    case'progress':content=renderProgress();break;

  }

  app.innerHTML=`
    <div class="hdr"><div class="hdr-brand"><div class="hdr-title">LOCK IN</div><div class="hdr-sub">${subTxt}</div></div><button class="hdr-gear ${state.tab==='settings'?'active':''}" onclick="setTab(state.tab==='settings'?'today':'settings')" aria-label="Settings">${ICON.gear}</button></div>
    <div class="content">${content}</div>
    <div class="tabs">${tabsHTML}</div>
    ${renderModal()}`;

  if(state.tab==='progress'&&(state.progTab||'charts')==='charts')setTimeout(drawAllCharts,30);
  if(modalKey&&modalKey===state.modal){const m2=document.querySelector('.modal');if(m2)m2.scrollTop=modalScroll;}
}

async function initPhotos(){
  try{
    let idbPhotos=await idbAll();
    const lsPhotos=Array.isArray(state.data.photos)?state.data.photos:[];
    // One-time migration: photos still living in localStorage move into IndexedDB
    if(idbPhotos.length===0 && lsPhotos.length>0){
      const withIds=lsPhotos.map(p=>({...p,id:p.id||genPhotoId(p.ts)}));
      await idbPutAll(withIds);
      idbPhotos=withIds;
    }
    idbPhotos=idbPhotos.map(p=>p.id?p:{...p,id:genPhotoId(p.ts)});
    idbPhotos.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.ts||0)-(b.ts||0));
    state.data.photos=idbPhotos;
    photosInIDB=true;
    save(); // rewrite localStorage WITHOUT photos — frees the ~5MB quota for good
  }catch(e){
    console.warn('LOCK IN: IndexedDB unavailable, keeping photos in localStorage',e);
    if(!Array.isArray(state.data.photos))state.data.photos=[];
    photosInIDB=false;
  }
}
async function boot(){
  load();
  render();            // paint immediately
  await initPhotos();  // migrate/load photos out of localStorage
  render();            // repaint with photos from IndexedDB
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').then(reg=>{if(reg&&reg.update)reg.update();}).catch(()=>{});
  }
}
window.addEventListener('resize',()=>{if(state.tab==='progress'&&(state.progTab||'charts')==='charts')drawAllCharts();});
boot();
