  }
  // Intake vs burn (28d)
  const days=[];for(let i=27;i>=0;i--)days.push(addDays(today,-i));
  const intakeData=days.filter(x=>(d.meals[x]||[]).length).map(x=>({x:dayNum(x),y:dayEnergy(x).eaten}));
  const maintData=days.map(x=>{const e=dayEnergy(x);return {x:dayNum(x),y:e.tdee};});
  const watchData=days.filter(x=>(d.meals[x]||[]).length).map(x=>({x:dayNum(x),y:watchTdee(x).tdee}));
  drawChart('intake-chart',{height:190,yZero:false,
    series:[{type:'bars',color:'#FFB547',alpha:.75,data:intakeData},{type:'line',color:'#FF5C93',width:1.5,dash:[4,3],data:watchData},{type:'line',color:'#2EE6F5',width:2.5,glow:true,data:maintData}],
    refs:[{y:cfg.calorieTarget,color:'#FFD866',label:'Target '+cfg.calorieTarget}],xMin:dayNum(days[0]),xMax:dayNum(today),
    tip:x=>{const ds=dayStr(x);const e=dayEnergy(ds);return `<b>${fmtDate(ds)}</b><span class="sw" style="background:#FFB547"></span>ate ${e.intake||'—'}${e.eaten!==e.intake?' → '+e.eaten+' padded':''}<br><span class="sw" style="background:#2EE6F5"></span>burn ${e.tdee}<br><span class="sw" style="background:#FF5C93"></span>watch ${e.watchTdee}`;}});
  // Execution (28d)
  const ex=days.map(x=>{const s=executionScore(x);return s?{x:dayNum(x),y:s.score,color:s.score>=85?'#3DF5A0':s.score>=65?'#FFB547':'#FF5C7A'}:null;}).filter(Boolean);
  drawChart('exec-chart',{height:150,yZero:true,series:[{type:'bars',color:'#3DF5A0',alpha:.85,data:ex}],refs:[{y:85,color:'#3DF5A0',label:'85'}],xMin:dayNum(days[0]),xMax:dayNum(today),
    tip:x=>{const ds=dayStr(x);const s=executionScore(ds);if(!s)return `<b>${fmtDate(ds)}</b>no log`;const p=s.parts;return `<b>${fmtDate(ds)}</b>score ${s.score}<br>def ${p.deficit} · pro ${p.protein} · h2o ${p.water}<br>train ${p.training} · sleep ${p.sleep}`;}});
  // Waist
  const wd=Object.keys(d.waist||{}).sort();
  if(wd.length>=2)drawChart('waist-chart',{height:140,series:[{type:'line',color:'#2EE6F5',width:2,points:true,data:wd.map(x=>({x:dayNum(x),y:d.waist[x]}))}],refs:[],yFmt:v=>v+'"',tip:x=>{const ds=dayStr(x);return `<b>${fmtDate(ds)}</b>${d.waist[ds]}"`;}});
}

// ═══════════════════════════════════════════
// LOCK-IN MISSION — a dated reset plan with an auto-scoring daily checklist
// config.mission = {start, awayFrom, awayTo, lockDays}   ·   data.missionChecks = {date:{key:true}}
// Modes: pre (before trip) · away (travel/event) · reentry (first day back) · locked · checkpoint (last day)
// ═══════════════════════════════════════════
const CAL_FLOOR=1800;
function missionCfg(){const m=state.data.config.mission;return (m&&m.start)?m:null;}
function missionEnd(m){
  const lock=+m.lockDays||14;
  if(m.awayTo&&m.awayTo>=m.start)return addDays(m.awayTo,lock);
  return addDays(m.start,lock-1);
}
function missionMode(date){
  const m=missionCfg();if(!m)return null;
  const end=missionEnd(m);
  if(date<m.start||date>end)return null;
  if(date===end)return 'checkpoint';
  if(m.awayFrom&&m.awayTo&&date>=m.awayFrom&&date<=m.awayTo)return 'away';
  if(m.awayTo&&date===addDays(m.awayTo,1))return 'reentry';
  if(m.awayFrom&&date<m.awayFrom)return 'pre';
  return 'locked';
}
const MODE_META={
  pre:{label:'PRE-TRIP',color:'var(--cyan)',line:'Bank clean days before the wedding. Known numbers, protein first, move.'},
  away:{label:'AWAY MODE',color:'var(--purple)',line:'Enjoy it. Protein first, 3 vodka sodas max, water between drinks, dance it off.'},
  reentry:{label:'RE-ENTRY · DAY 1',color:'var(--amber)',line:'The scale will read 2–5 lb high from travel water and sodium. Ignore it — today is Day 1.'},
  locked:{label:'LOCKED IN',color:'var(--green)',line:'Known numbers. Protein first. Move every day. One planned social meal per week.'},
  checkpoint:{label:'CHECKPOINT',color:'var(--yellow)',line:'Export a backup (⚙ → Data) and send it to Claude for the review. Then set the next mission.'}
};
function missionChecks(date){if(!state.data.missionChecks)state.data.missionChecks={};return state.data.missionChecks[date]||{};}
function socialUsedThisWeek(date){
  const ws=weekStart(date);const mc=state.data.missionChecks||{};
  for(let i=0;i<7;i++){const d=addDays(ws,i);if(d!==date&&mc[d]&&mc[d].social)return d;}
  return null;
}
function cardioOn(date){return (state.data.workouts[date]||[]).some(w=>workoutMuscles(w).some(([m])=>m==='cardio'));}
function cardioWeek(date){const ws=weekStart(date);let c=0;for(let i=0;i<7;i++){const d=addDays(ws,i);if(d<=date&&cardioOn(d))c++;}return c;}
function missionItems(date){
  const mode=missionMode(date);if(!mode)return [];
  const d=state.data,cfg=d.config;
  const meals=d.meals[date]||[],intake=dayIntake(date),pro=dayProtein(date);
  const proT=cfg.proteinTarget||150,waterT=cfg.waterTarget||110,sleepT=cfg.sleepTarget||7.5,calT=cfg.calorieTarget||2100;
  const water=d.water[date]||0,sleep=d.sleep[date],wos=d.workouts[date]||[];
  const lifted=wos.some(w=>sessionTypeOf(w));
  const hasSets=!!((d.lifts||{})[date]&&Object.keys(d.lifts[date]).length);
  const mc=missionChecks(date);
  const est=meals.filter(x=>mealSrc(x)==='est');
  const steps=(d.steps||{})[date];
  const items=[];
  const auto=(k,label,ok,sub)=>items.push({k,label,ok:!!ok,auto:true,sub});
  const man=(k,label,sub)=>items.push({k,label,ok:!!mc[k],auto:false,sub});
  if(mode==='away'){
    auto('protein',`Protein ${pro}/${proT}g`,pro>=proT,'Protein first at every meal — eggs, meat, shakes, bars in the bag.');
    auto('water',`Water ${water}/${waterT} oz`,water>=waterT,'One full glass of water between every drink.');
    man('drinks','Drinks ≤ 3 — vodka soda only','~100 cal each. None on non-event days.');
    man('plate','One plate, protein first — no grazing','At the reception: protein + veg, one carb, skip the second trip.');
    man('move','Moved: walking, calisthenics or dancing','In-room circuit in the morning if you can — 25 min.');
    man('log','Logged everything, estimated HIGH','Unsure? Round up. Honest numbers > pretty numbers.');
    return items;
  }
  const isSun=new Date(date+'T12:00:00').getDay()===0;
  if(mode==='checkpoint')man('export','Export backup (⚙ → Data) & send to Claude','The 14-day review: real pace, adjust targets, set the next mission.');
  auto('weigh','Weigh-in logged',d.weights[date]!=null,mode==='reentry'?'Expect it high — this is the new baseline, not a verdict.':'Morning, after the bathroom, before food.');
  auto('protein',`Protein ${pro}/${proT}g`,pro>=proT,'40g+ at every meal.');
  if(mc.social){
    auto('known','Social meal — logged & padded +30%',meals.length>0,'Your one planned off-plan meal this week. Back to known numbers tomorrow.');
    auto('cal',`Calories ${intake} (social cap ${calT+600})`,meals.length>0&&intake<=calT+600&&intake>=calFloor()-300);
  }else{
    auto('known',`Known-numbers day${est.length?` (${est.length} estimate-heavy item${est.length>1?'s':''})`:''}`,meals.length>0&&est.length===0,'Weighed or labeled foods only. Oils, butter, cheese & sauce weighed.');
    {const cc=calCheckItem(intake,calT,meals.length>0);auto('cal',cc[0],cc[1],cc[2]);}
  }
  if(isSun)man('rest','Rest day: easy walk, stretch, prep the week','Prep chicken + rice for Mon–Wed.');
  else{
    auto('train',`Trained${lifted?'':' — Next Up on the Train tab'}`,wos.length>0);
    if(lifted)auto('sets','Sets logged in the app',hasSets,'Progressive overload is what keeps muscle on a cut.');
    const cw=cardioWeek(date);
    {const cg=cardioGoal();if(cw<cg||cardioOn(date))auto('cardio',goalDir()==='bulk'?`Cardio 20 min, easy (${cw}/${cg} this week)`:`Cardio 25+ min (${cw}/${cg} this week)`,cardioOn(date),goalDir()==='bulk'?'Heart health and appetite. Keep it light so it doesn\'t eat your surplus.':gymHome()?'Brisk walk, easy jog, or the home circuit.':'Incline walk or Stairmaster after lifting.');}
  }
  if(steps!=null)auto('walk',`Steps ${steps.toLocaleString()}/${stepGoal().toLocaleString()}`,steps>=stepGoal(),'Walk after lunch & dinner — imported from Apple Health.');
  else man('walk',`Walk after lunch & dinner (${stepGoal()/1000}k+ steps)`,goalDir()==='bulk'?'Easy walks help digestion and recovery without burning your surplus.':'10 minutes each. NEAT beats the gym for fat loss at a desk job.');
  auto('water',`Water ${water}/${waterT} oz`,water>=waterT);
  auto('sleep',`Sleep logged ≥ ${sleepT}h`,sleep&&sleep.hours>=sleepT);
  return items;
}
function missionDayPct(date){const it=missionItems(date);if(!it.length)return null;return Math.round(it.filter(i=>i.ok).length/it.length*100);}
function toggleMission(date,k){
  if(!state.data.missionChecks)state.data.missionChecks={};
  const mc=state.data.missionChecks[date]=state.data.missionChecks[date]||{};
  if(k==='social'&&!mc.social){const used=socialUsedThisWeek(date);if(used&&!confirm(`You already used this week's social meal on ${fmtShort(used)}. Use another one anyway?`))return;}
  mc[k]=!mc[k];if(!mc[k])delete mc[k];
  if(!Object.keys(mc).length)delete state.data.missionChecks[date];
  save();render();
}
function quickMeal(name,cal,pro){const vd=getVD();(state.data.meals[vd]=state.data.meals[vd]||[]).push({name,calories:cal,protein:pro});save();render();}
const STAPLES=[{name:'Chobani + banana',calories:245,protein:21},{name:'Chicken 8oz + rice 4oz',calories:525,protein:73},{name:'Fairlife shake',calories:230,protein:42},{name:'Barebells',calories:200,protein:20},{name:'Cheese sticks',calories:140,protein:12}];
function staplesLoaded(){const f=(state.data.favorites||[]).map(x=>x.name.toLowerCase());return STAPLES.every(s=>f.includes(s.name.toLowerCase()));}
function loadStaples(){STAPLES.forEach(s=>addFavorite(s.name,s.calories,s.protein));save();render();}
function missionStreak(){
  const m=missionCfg();if(!m)return 0;let n=0;let d=addDays(getToday(),-1);
  if((missionDayPct(getToday())||0)>=80)n++;
  while(d>=m.start){const p=missionDayPct(d);if(p!=null&&p>=80){n++;d=addDays(d,-1);}else break;}
  return n;
}
function renderMission(){
  const vd=getVD();const m=missionCfg();
  if(!m)return state.tab==='today'&&isViewingToday()?renderMissionSetup():'';
  const mode=missionMode(vd);if(!mode)return '';
  const meta=MODE_META[mode];const end=missionEnd(m);
  const dayN=daysBetween(m.start,vd)+1,total=daysBetween(m.start,end)+1;
  const items=missionItems(vd);const done=items.filter(i=>i.ok).length;const pct=Math.round(done/items.length*100);
  const mc=missionChecks(vd);
  const R=26,C=2*Math.PI*R,off=C*(1-pct/100);
  const ringCol=pct>=80?'#3DF5A0':pct>=50?'#FFB547':'#2EE6F5';
  // mission grid
  const cells=[];for(let i=0;i<total;i++){const d=addDays(m.start,i);const md=missionMode(d);const p=d<=getToday()?missionDayPct(d):null;
    const bg=p==null?'var(--surface2)':p>=80?'rgba(61,245,160,.75)':p>=50?'rgba(255,181,71,.6)':'rgba(255,92,122,.45)';
    const bd=d===vd?'2px solid var(--yellow)':md==='away'?'1px solid rgba(167,139,250,.8)':md==='checkpoint'?'1px solid var(--yellow)':'1px solid var(--border)';
    cells.push(`<div title="${d}" onclick="state.viewDate='${d<=getToday()?d:vd}';render()" style="aspect-ratio:1;border-radius:3px;background:${bg};border:${bd};cursor:pointer"></div>`);}
  const good=[...Array(total).keys()].map(i=>addDays(m.start,i)).filter(d=>d<=getToday()&&(missionDayPct(d)||0)>=80).length;
  const elapsed=Math.min(total,daysBetween(m.start,getToday())+1);
  const socialBtn=(mode==='locked'||mode==='pre'||mode==='reentry')?`<button class="ms-chip ${mc.social?'on':''}" onclick="toggleMission('${vd}','social')">${mc.social?'★ Social meal day':'☆ Use this week\'s social meal'}</button>`:'';
  const awayKit=mode==='away'?`<div class="ms-kit">
      <button class="ms-chip" onclick="quickMeal('Vodka soda',100,0)">+ Vodka soda <span>100·0g</span></button>
      <button class="ms-chip" onclick="showWorkoutDetail('travel','travel-room')">In-room circuit ▸</button>
      <button class="ms-chip" onclick="showWorkoutDetail('travel','travel-outdoor')">Walk / outdoor ▸</button>
    </div>`:'';
  return `<div class="card ms-card" style="--msc:${meta.color}">
    <div class="ms-top">
      <div style="flex:1;min-width:0">
        <div class="ms-kicker">LOCK-IN MISSION · DAY ${dayN}/${total}</div>
        <div class="ms-mode" style="color:${meta.color};text-shadow:0 0 12px ${meta.color}">${meta.label}</div>
        <div class="ms-line">${meta.line}</div>
      </div>
      <svg width="64" height="64" viewBox="0 0 64 64" style="flex-shrink:0"><circle cx="32" cy="32" r="${R}" fill="none" stroke="#1D2230" stroke-width="6"/><circle cx="32" cy="32" r="${R}" fill="none" stroke="${ringCol}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" fill="${ringCol}" style="font-family:'JetBrains Mono',monospace;font-size:15px">${pct}%</text></svg>
    </div>
    ${awayKit}
    <div class="ms-list">${items.map(it=>`<div class="ms-item ${it.ok?'ok':''} ${it.auto?'':'tap'}" ${it.auto?'':`onclick="toggleMission('${vd}','${it.k}')"`}>
        <span class="ms-box">${it.ok?'✓':''}</span>
        <span style="flex:1;min-width:0"><span class="ms-lbl">${it.label}</span>${it.sub?`<span class="ms-sub">${it.sub}</span>`:''}</span>
        <span class="ms-tag">${it.auto?'AUTO':'TAP'}</span>
      </div>`).join('')}</div>
    ${socialBtn?`<div class="ms-kit">${socialBtn}</div>`:''}
    <div class="ms-grid" style="grid-template-columns:repeat(${Math.min(total,11)},1fr)">${cells.join('')}</div>
    <div class="ms-foot"><span>${good}/${elapsed} days ≥80%</span><span>streak ${missionStreak()}</span><span>checkpoint ${fmtShort(end)}</span></div>
    <div class="ms-kit" style="margin-top:10px">
      ${staplesLoaded()?'':`<button class="ms-chip" onclick="loadStaples()">+ Load known-numbers staples to Quick Add</button>`}
      <button class="ms-chip" onclick="state.msRules=!state.msRules;render()">${state.msRules?'Hide':'Show'} the rules</button>
    </div>
    ${state.msRules?`<div class="ms-rules">
      <div><b>Floor</b> Never under ${calFloor()} honestly logged. Under-eating costs muscle, sleep and recovery.</div>
      <div><b>Ceiling</b> After week 2, losing &gt;2.5 lb/wk for two weeks straight → eat ~200 more.</div>
      <div><b>Known numbers</b> 5–6 days/week: weighed or labeled foods. Weigh oil, butter, cheese, sauce.</div>
      <div><b>One social meal</b> per week, planned, logged +30%. Two drinks max that night.</div>
      <div><b>Move</b> Cardio 3×/wk (25–30 min) + walks after lunch & dinner. Two leg days a week.</div>
      <div><b>Never</b> skip meals to "make up", cut water, or chase the scale. Next day = normal plan.</div>
      <div><b>Judge</b> the weekly trend, never one morning. Travel/salt/alcohol = 2–5 lb of water.</div>
    </div>`:''}
  </div>`;
}
function renderMissionSetup(){
  if(state.msHideSetup)return '';
  const today=getToday();
  return `<div class="card ms-card" style="--msc:var(--yellow)">

function startMission(){
  const g=id=>document.getElementById(id)?.value||'';
  const start=g('ms-start')||getToday();let from=g('ms-from'),to=g('ms-to');
  if(from&&!to)to=from; if(to&&!from)from=to;
  if(from&&to&&to<from){const t=from;from=to;to=t;}
  state.data.config.mission={start,awayFrom:from||'',awayTo:to||'',lockDays:Math.max(3,Math.min(60,parseInt(g('ms-days'))||14))};
  save();render();
}
function endMission(){if(!confirm('End this mission? Your logged data stays; only the checklist plan is cleared.'))return;delete state.data.config.mission;save();render();}

  const t=todayScore?todayScore.score:null;

  const bar=(val,max,c)=>`<div style="flex:1"><div style="height:6px;background:var(--surface2);border-radius:3px;overflow:hidden"><div style="height:100%;width:${Math.min(100,(val/max)*100)}%;background:${c};border-radius:3px;box-shadow:0 0 6px ${c}"></div></div></div>`;

      <div style="display:flex;align-items:center;gap:10px;font-size:12px"><span style="color:var(--text2);width:64px">Protein</span>${bar(p.protein,30,'var(--cyan)')}<span style="font-family:var(--font-mono);color:var(--text2);width:34px;text-align:right">${p.protein}/30</span></div>
      <div style="display:flex;align-items:center;gap:10px;font-size:12px"><span style="color:var(--text2);width:64px">Water</span>${bar(p.water,20,'#7DD3FC')}<span style="font-family:var(--font-mono);color:var(--text2);width:34px;text-align:right">${p.water}/20</span></div>

}
function renderTrajectory(full){
  const t=getTrajectory();
  if(!t){return `<div class="card"><div class="card-title">📉 Trajectory</div><div class="empty-state">Log a few more weigh-ins to unlock your smoothed trend & projection.</div></div>`;}
  const rateColor=t.weekly<0?'var(--green)':'var(--amber)';
  const rateTxt=`${t.weekly>0?'+':''}${t.weekly}/wk`;
  const sinceTxt=`${t.sinceStartWeekly>0?'+':''}${t.sinceStartWeekly}/wk`;
  const etaTxt=t.reachedGoal?'🎯 Hit':(t.flat?'flat':(t.projGoalDate?fmtShort(t.projGoalDate):'—'));
  const onTrack=t.projGoal!=null && t.projGoal<=t.goal;
  const honeyColor=onTrack?'var(--green)':'var(--amber)';
  const gLabel=goalLabelStr();
  const hasWindow=t.etaEarly&&t.etaLate&&t.etaEarly!==t.etaLate;
  return `<div class="card"><div class="card-title">📉 Trajectory <span style="font-family:var(--font-ui);font-weight:600;color:var(--text2);font-size:11px;letter-spacing:.5px">· robust trend</span></div>
    <div class="inline-stat">
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--cyan)">${t.smoothedLatest}</div><div class="inline-stat-label">Trend wt</div></div>
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:${rateColor}">${rateTxt}</div><div class="inline-stat-label">Trend pace</div></div>
      <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--yellow);font-size:16px">${etaTxt}</div><div class="inline-stat-label">Hit ${t.goal}</div></div>
    </div>
    <div class="stat-row" style="margin-top:10px"><span class="stat-label">Avg since start</span><span class="stat-value" style="color:var(--text2)">${sinceTxt}</span></div>
    ${full&&hasWindow?`<div class="stat-row"><span class="stat-label">ETA window</span><span class="stat-value" style="color:var(--cyan);font-size:15px">${fmtShort(t.etaEarly)} – ${fmtShort(t.etaLate)}</span></div>`:''}
    ${t.goalTargetDate&&t.projGoal!=null?`<div class="stat-row"><span class="stat-label">Projected on ${fmtShort(t.goalTargetDate)}</span><span class="stat-value" style="color:${honeyColor}">${t.projGoal} lbs ${onTrack?'✓':'⚠'}</span></div>`:''}
    ${full&&t.daysToGoal?`<div class="stat-row"><span class="stat-label">Days to ${t.goal} at this pace</span><span class="stat-value">${t.daysToGoal}</span></div>`:''}
    ${full?`<p style="font-size:12px;color:var(--text2);margin-top:10px">${
      t.flat
        ? `Trend is flat right now. Some of that can be water — but check the calibrated deficit on the Energy card: if it's near zero, this is a real stall and the fix is the ledger (weigh add-ons, pad restaurant meals), not more cardio.`
        : (onTrack
            ? `On pace to reach ${t.goal} before your ${gLabel} date. The trend pace is a median-based (robust) fit over the last 28 days, so one salty weekend no longer throws the projection off.`
            : `Current robust pace lands you near ${t.projGoal} on your ${gLabel} date — above ${t.goal}. The trend is what your body is actually doing; close the gap through intake accuracy before adding training volume.`)
    } ${hasWindow?`<span style="color:var(--text2)">The ETA window brackets your robust recent pace against your since-start average — reality usually lands inside it.</span>`:''}</p>`:''}
  </div>`;
}

        <div class="inline-stat-item"><div class="inline-stat-num" style="color:var(--yellow)">${pct}%</div><div class="inline-stat-label">To goal</div></div>
      </div>

    ${renderTrajectory(false)}
    ${renderExecutionCard()}

    <div class="card">

        <div class="heatmap-cell" style="width:12px;height:12px;display:inline-block"></div>None
        <div class="heatmap-cell l1" style="width:12px;height:12px;display:inline-block"></div>Low

    <div class="card">
      <div class="card-title">${isViewingToday()?'Today\'s Snapshot':fmtDate(vd)}</div>
      <div class="stat-row"><span class="stat-label">Weight</span><span class="stat-value">${w?w+' lbs':'—'}${w&&!state.editWeight?`<span class="edit-link" onclick="state.editWeight=true;render()">✏ edit</span>`:''}</span></div>
      ${w&&waterFlagFor(vd)?`<div class="coach-note" style="color:var(--cyan);background:rgba(46,230,245,.06);margin-top:6px">💧 ${waterFlagFor(vd)}</div>`:''}

      <div class="stat-row"><span class="stat-label">Calories</span><span class="stat-value">${vdCals} <span style="font-size:13px;color:var(--text2)">/ ${state.data.config.calorieTarget}</span></span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100,(vdCals/state.data.config.calorieTarget)*100)}%;background:${vdCals>state.data.config.calorieTarget?'var(--red)':'var(--green)'};box-shadow:0 0 8px ${vdCals>state.data.config.calorieTarget?'rgba(255,92,122,.5)':'rgba(61,245,160,.5)'}"></div></div>

const PHASES={
  cut:{key:'cut',label:'CUT',color:'var(--cyan)',tag:'Fat loss',
    blurb:'Strip fat, hold muscle. Calorie deficit, high protein, train heavy to keep every pound of muscle you own.',
    guide:'Deficit · 150g+ protein · train to retain'},
  leanbulk:{key:'leanbulk',label:'LEAN BULK',color:'var(--green)',tag:'Build',
    blurb:'Add muscle slowly and cleanly. Slight surplus, progressive overload. The scale goes UP on purpose — mostly muscle.',
    guide:'Slight surplus · progressive overload · ~2-3 lb/mo'},
  maintain:{key:'maintain',label:'MAINTAIN',color:'var(--yellow)',tag:'Hold',
    blurb:'Lock the physique in. Eat at maintenance, keep training hard, fine-tune with small cuts or builds.',
    guide:'Maintenance calories · hold the line'}
};
// Suggests a phase from the smoothed trend weight vs the user's targets.
function getPhaseStatus(){
  const cur=(state.data.config.phase)||'cut';
  const t=getTrajectory();
  const goal=state.data.config.goalWeight;
  const lean=state.data.config.leanTarget||Math.max(goal-40,200);
  const trend=t?t.smoothedLatest:getLatestWeight();
  let suggested=cur, reason='';
  if(trend!=null){
    // Once the trend is at/below the "reveal" (lean) weight, it's time to stop cutting.
    if(trend<=lean){ suggested='maintain'; reason=`Trend weight (${trend}) reached your reveal target (${lean}). Time to stop cutting — hold here, then build.`; }
    else { suggested='cut'; reason=`${round1(trend-lean)} lbs of trend weight to your reveal target (${lean}).`; }
  }
  const canFlip=suggested!==cur;
  // progress from start weight → lean target
  const start=state.data.config.startWeight||trend;
  const pct=(trend!=null&&start>lean)?Math.max(0,Math.min(100,round1(((start-trend)/(start-lean))*100))):0;
  return {cur,suggested,canFlip,reason,trend,lean,goal,pct};
}
function setPhase(p){ if(PHASES[p]){ state.data.config.phase=p; save(); render(); } }
function renderPhase(){
  const s=getPhaseStatus();
  const P=PHASES[s.cur]||PHASES.cut;
  return `<div class="card phase-card">
    <div class="card-title" style="display:flex;align-items:center;gap:7px;color:${P.color}">${ICON.phase} Phase</div>
    <div class="phase-head">
      <div>
        <div class="phase-label" style="color:${P.color};text-shadow:0 0 14px ${P.color}">${P.label}</div>
        <div class="phase-tag">${P.tag}</div>
      </div>
      <div class="phase-track">
        <div class="phase-track-bar"><div class="phase-track-fill" style="width:${s.pct}%;background:${P.color};box-shadow:0 0 10px ${P.color}"></div></div>
        <div class="phase-track-cap">${s.pct}% to reveal · ${s.lean} lbs</div>
      </div>
    </div>
    <p class="phase-blurb">${P.blurb}</p>
    <div class="phase-guide">${P.guide}</div>
    ${s.canFlip?`<div class="phase-flip">
        <div class="phase-flip-msg">${ICON.phase}<span>Suggested: flip to <b style="color:${PHASES[s.suggested].color}">${PHASES[s.suggested].label}</b> — ${s.reason}</span></div>
        <button class="btn btn-primary btn-sm" style="width:100%;margin-top:8px" onclick="setPhase('${s.suggested}')">Flip to ${PHASES[s.suggested].label}</button>
      </div>`:`<div class="phase-next">On track · ${s.reason}</div>`}
    <div class="phase-switch">
      ${Object.values(PHASES).map(x=>`<button class="phase-pill ${s.cur===x.key?'active':''}" style="${s.cur===x.key?`border-color:${x.color};color:${x.color}`:''}" onclick="setPhase('${x.key}')">${x.label}</button>`).join('')}
    </div>
  </div>`;
}

function logWeight(){
  const v=parseFloat(document.getElementById('weight-in')?.value);
  if(!v||v<50||v>600)return;
  // v10 sanity guard: flag any entry that differs from the most recent weigh-in by >5 lb
  const vdW=getVD();
  const dates=Object.keys(state.data.weights).filter(d=>d!==vdW&&d<=vdW).sort();
  if(dates.length){
    const last=state.data.weights[dates[dates.length-1]];
    const diff=Math.abs(round1(v)-last);

function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const imp=JSON.parse(ev.target.result);
      if(imp.config||imp.weights){
        const def=defaults();
        state.data={
          config:{...def.config,...(state.data.config||{}),...(imp.config||{})},
          weights:{...(state.data.weights||{}),...(imp.weights||{})},
          meals:(()=>{const a=state.data.meals||{},b=imp.meals||{},o={...a};Object.keys(b).forEach(d=>{const cur=(a[d]||[]).slice();const have={};cur.forEach(m=>{const k=m.name+'|'+m.calories+'|'+m.protein;have[k]=(have[k]||0)+1;});(b[d]||[]).forEach(m=>{const k=m.name+'|'+m.calories+'|'+m.protein;if(have[k]>0)have[k]--;else cur.push(m);});o[d]=cur;});return o;})(),
          workouts:{...(state.data.workouts||{}),...(imp.workouts||{})},
          focus:{...(state.data.focus||{}),...(imp.focus||{})},
          sleep:{...(state.data.sleep||{}),...(imp.sleep||{})},
          water:{...(state.data.water||{}),...(imp.water||{})},
          active:{...(state.data.active||{}),...(imp.active||{})},
          waist:{...(state.data.waist||{}),...(imp.waist||{})},
          resting:{...(state.data.resting||{}),...(imp.resting||{})},
          missionChecks:{...(state.data.missionChecks||{}),...(imp.missionChecks||{})},
          steps:{...(state.data.steps||{}),...(imp.steps||{})},neck:{...(state.data.neck||{}),...(imp.neck||{})},
          rivals:(Array.isArray(imp.rivals)&&imp.rivals.length)?imp.rivals:(state.data.rivals||[]),
          myFoods:(()=>{const a=Array.isArray(state.data.myFoods)?state.data.myFoods:[],b=Array.isArray(imp.myFoods)?imp.myFoods:[];const ids=new Set(a.map(f=>f.id));return a.concat(b.filter(f=>f&&!ids.has(f.id)));})(),
          lifts:(()=>{const a=state.data.lifts||{},b=imp.lifts||{},o={...a};Object.keys(b).forEach(d=>{o[d]={...(a[d]||{}),...b[d]};});return o;})(),
          photos:[...(Array.isArray(state.data.photos)?state.data.photos:[]),...(Array.isArray(imp.photos)?imp.photos:[])].map(p=>(p&&p.id)?p:{...p,id:genPhotoId(p&&p.ts)}),
          favorites:(Array.isArray(imp.favorites)&&imp.favorites.length)?imp.favorites:(Array.isArray(state.data.favorites)?state.data.favorites:[]),
          goals:{
            short:mergeGoals((state.data.goals||{}).short,(imp.goals||{}).short),
            long:mergeGoals((state.data.goals||{}).long,(imp.goals||{}).long)
          },
          soreness:{...(state.data.soreness||{}),...(imp.soreness||{})}
        };
        if(!(imp.config||{}).fix13)state.data.config.fix13=false;
        try{fixData13(state.data);}catch(e){console.warn('LOCK IN: v13 data fix skipped',e);}
        try{fixData131(state.data);}catch(e){}
        try{state.data.config.v132=false;fixData132(state.data);state.data.config.onboarded=true;pbCustomize();}catch(e){}
        Object.values(imp.meals||{}).forEach(a=>(a||[]).forEach(m=>{if(m&&m.t===undefined)m.t='';}));
        save();render();
        if(photosInIDB)idbPutAll(state.data.photos).catch(()=>{});
        alert('Data imported successfully!');
      }else{alert('Invalid backup file.');}
    }catch(err){alert('Error reading file.');}
  };
  reader.readAsText(file);
  e.target.value='';
}

function photoWeek(date){return Math.max(1,Math.ceil((daysBetween('2026-07-08',date)+1)/7))}

const POSES=['Front relaxed','Front flexed','Side relaxed','Side flexed','Back relaxed','Back flexed','45° pose'];

// ── Photo filtering: pose (single-select) + weeks (multi-select) ──
function photoWeekOf(p){return p.week||photoWeek(p.date||'2026-07-08');}
function filteredPhotos(){
  const photos=state.data.photos||[];
  const pose=state.photoFilter||'all';
  const weeks=Array.isArray(state.photoWeeks)?state.photoWeeks:[];
  return photos.map((p,i)=>({...p,_idx:i}))
    .filter(p=>pose==='all'||p.position===pose)
    .filter(p=>weeks.length===0||weeks.includes(photoWeekOf(p)));
}
function setPhotoFilter(f){state.photoFilter=f;render();}
function togglePhotoWeek(wk){
  if(!Array.isArray(state.photoWeeks))state.photoWeeks=[];
  const i=state.photoWeeks.indexOf(wk);
  if(i>=0)state.photoWeeks.splice(i,1); else state.photoWeeks.push(wk);
  render();
}
function clearPhotoWeeks(){state.photoWeeks=[];render();}

function renderPhotos(){
  const photos=state.data.photos||[];
  const latestW=getLatestWeight();
  const curWeek=photoWeek(getToday());
  const filter=state.photoFilter||'all';

  // Edit modal
  if(state.editingPhoto>=0&&photos[state.editingPhoto]){

    return `<div class="card">
      <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">Edit Photo <span style="cursor:pointer;font-size:18px;color:var(--text2)" onclick="state.editingPhoto=-1;render()">✕</span></div>
      <div style="text-align:center;margin-bottom:12px"><img src="${p.data}" style="max-width:100%;max-height:300px;border-radius:10px;object-fit:contain" alt=""></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="form-group"><label>Date</label><input type="date" id="edit-date" value="${p.date||''}" max="${getToday()}"></div>
        <div class="form-group"><label>Week</label><input type="number" id="edit-week" value="${p.week||photoWeek(p.date||'2026-07-08')}" min="1" max="52" inputmode="numeric"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="form-group"><label>Weight (lbs)</label><input type="number" id="edit-weight" value="${p.weight||''}" step="0.1" inputmode="decimal"></div>
        <div class="form-group"><label>Pose</label><select id="edit-position">${['<option value="">Select...</option>',...POSES.map(ps=>`<option value="${ps}" ${p.position===ps?'selected':''}>${ps}</option>`)].join('')}</select></div>
      </div>
      <div class="form-group"><label>Note</label><input type="text" id="edit-note" value="${p.note||''}" maxlength="80"></div>
      <button class="btn btn-primary" onclick="savePhotoEdit(${idx})">Save Changes</button>
      <button class="btn btn-danger btn-sm" style="margin-top:8px;width:100%" onclick="deletePhoto(${idx})">Delete Photo</button>
    </div>`;
  }

  // Weeks available for the currently-selected pose (so we never show empty week pills)
  const poseSet=photos.filter(p=>filter==='all'||p.position===filter);
  const availableWeeks=[...new Set(poseSet.map(photoWeekOf))].sort((a,b)=>a-b);

  // Prune any selected weeks that no longer apply to the current pose (prevents a stuck filter)
  let weeksSel=Array.isArray(state.photoWeeks)?state.photoWeeks:[];
  const pruned=weeksSel.filter(w=>availableWeeks.includes(w));
  if(pruned.length!==weeksSel.length){state.photoWeeks=pruned;weeksSel=pruned;}

  const filtered=filteredPhotos();
  const anyFilter=filter!=='all'||weeksSel.length>0;

  // Group by week
  const byWeek={};
  filtered.forEach(p=>{
    const wk=photoWeekOf(p);
    if(!byWeek[wk])byWeek[wk]=[];
    byWeek[wk].push(p);
  });
  const weekNums=Object.keys(byWeek).map(Number).sort((a,b)=>a-b);

  const galleryHTML=weekNums.map(wk=>{
    const wkPhotos=byWeek[wk].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    return `<div style="margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-family:var(--font-ui);font-size:15px;font-weight:700;color:var(--cyan);letter-spacing:1px">WEEK ${wk}</span>
        <span style="font-size:12px;color:var(--text2)">${wkPhotos.length} photo${wkPhotos.length!==1?'s':''}</span>
      </div>
      <div class="photo-grid">${wkPhotos.map(p=>`<div class="photo-card">
        <img src="${p.data}" onclick="viewPhoto(${p._idx})" alt="">
        <div class="photo-card-info">
          <div class="photo-card-date">${p.date?fmtDate(p.date):'No date'}</div>
          ${p.weight?`<div class="photo-card-note">${p.weight} lbs${p.position?' · '+p.position:''}</div>`:p.position?`<div class="photo-card-note">${p.position}</div>`:''}
          ${p.note?`<div class="photo-card-note">${p.note}</div>`:''}
          <div style="display:flex;gap:8px;margin-top:4px">
            <div class="photo-card-delete" onclick="state.editingPhoto=${p._idx};render()">✏ Edit</div>
            <div class="photo-card-delete" onclick="deletePhoto(${p._idx})">✕ Delete</div>
          </div>
        </div>
      </div>`).join('')}</div>
    </div>`;
  }).join('');

  // Pose filter pills (single-select)
  const posePills=['all',...POSES].map(f=>{
    const label=f==='all'?'All':f;
    const count=f==='all'?photos.length:photos.filter(p=>p.position===f).length;
    if(f!=='all'&&count===0)return '';
    return `<button class="pill ${filter===f?'active-pose':''}" onclick="setPhotoFilter('${f}')">${label}${f!=='all'?' ('+count+')':''}</button>`;
  }).filter(Boolean).join('');

  // Week filter pills (multi-select) — only meaningful when the pose spans 2+ weeks
  const weekPills=availableWeeks.length>1?`
    <div class="pill-label">Weeks · tap to compare</div>
    <div class="pill-row">
      <button class="pill ${weeksSel.length===0?'active-week':''}" onclick="clearPhotoWeeks()">All</button>
      ${availableWeeks.map(wk=>{
        const on=weeksSel.includes(wk);
        const c=poseSet.filter(p=>photoWeekOf(p)===wk).length;
        return `<button class="pill ${on?'active-week':''}" onclick="togglePhotoWeek(${wk})">W${wk} (${c})</button>`;
      }).join('')}
    </div>`:'';

  return `
    <div class="card">
      <div class="card-title">Add Progress Photo</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="form-group"><label>Date</label><input type="date" id="photo-date" value="${getVD()}" max="${getToday()}"></div>
        <div class="form-group"><label>Week</label><input type="number" id="photo-week" value="${curWeek}" min="1" max="52" inputmode="numeric"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="form-group"><label>Weight (lbs)</label><input type="number" id="photo-weight" value="${latestW||''}" step="0.1" inputmode="decimal" placeholder="${latestW||'---'}"></div>
        <div class="form-group"><label>Pose</label><select id="photo-position">${['<option value="">Select...</option>',...POSES.map(ps=>`<option value="${ps}">${ps}</option>`)].join('')}</select></div>
      </div>
      <div class="form-group"><label>Note (optional)</label><input type="text" id="photo-note" placeholder="e.g. Post-workout, morning, etc." maxlength="80"></div>
      <div style="display:flex;gap:8px">
        <label class="btn btn-primary" style="text-align:center;flex:1;cursor:pointer">
          📷 Take Photo
          <input type="file" accept="image/*" capture="environment" style="display:none" onchange="capturePhoto(event)">
        </label>
        <label class="btn btn-secondary" style="text-align:center;flex:1;cursor:pointer">
          🖼 Upload
          <input type="file" accept="image/*" style="display:none" onchange="capturePhoto(event)">
        </label>
      </div>
    </div>
    ${photos.length>0?`<div class="card"><div class="card-title" style="margin-bottom:8px">Gallery (${anyFilter?filtered.length+'/'+photos.length:photos.length})</div>
      <div class="pill-label">Pose</div>
      <div class="pill-row">${posePills}</div>
      ${weekPills}
      ${filtered.length>0?galleryHTML:'<div class="empty-state">No photos match this filter. Try "All" weeks or a different pose.</div>'}
    </div>`:'<div class="card"><div class="empty-state">No photos yet. Take your first progress photo — future you will thank you.</div></div>'}`;
}

function capturePhoto(e){
  const file=e.target.files[0];if(!file)return;
  const date=document.getElementById('photo-date')?.value||getToday();
  const week=parseInt(document.getElementById('photo-week')?.value)||photoWeek(date);
  const weight=parseFloat(document.getElementById('photo-weight')?.value)||null;
  const position=document.getElementById('photo-position')?.value||'';
  const note=document.getElementById('photo-note')?.value?.trim()||'';
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement('canvas');
      const maxW=800,maxH=1200;
      let w=img.width,h=img.height;
      if(w>maxW){h=h*(maxW/w);w=maxW;}
      if(h>maxH){w=w*(maxH/h);h=maxH;}
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      const data=canvas.toDataURL('image/jpeg',0.7);
      if(!Array.isArray(state.data.photos))state.data.photos=[];
      const photo={id:genPhotoId(),data,date,week,weight,position,note,ts:Date.now()};
      state.data.photos.push(photo);
      render();
      if(photosInIDB)persistPhoto(photo); else save();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value='';
}

// Top-set suggestion: progress from the last TOP SET when there is one; otherwise seed it from your best e1RM.
function topSetSuggestion(name,sc,before){
  const h=liftHistory(name,before);const key=bigLiftOf(name);
  const inc=/squat|deadlift/i.test(name)?10:5;
  const mid=Math.round(((sc.lo||5)+(sc.hi||5))/2);
  const lastTop=[...h].reverse().find(s=>s.role==='top');
  if(lastTop){
    const W=lastTop.topW;const best=Math.max(...lastTop.sets.filter(s=>+s.w===W).map(s=>+s.r||0));
    if(best>=sc.hi+2)return {w:W+2*inc,text:`${W}×${best} blew past ${sc.hi} → jump to ${W+2*inc} for ${sc.lo}–${sc.hi}.`};
    if(best>=sc.hi)return {w:W+inc,text:`Owned ${W}×${best} → go ${W+inc} for ${sc.lo}–${sc.hi}.`};
    if(best<sc.lo)return {w:floor5(W*0.95),text:`${W}×${best} fell under ${sc.lo} — reset to ${floor5(W*0.95)} and build back up.`};
    return {w:W,text:`Stay at ${W} — you got ${best}. Earn ${sc.hi}, then +${inc} lb.`};
  }
  const asOf=before?addDays(before,-1):getToday();
  const b=key?bestE1RM(key,asOf,60):null;
  if(b){const w=floor5(b.e1rm/(1+mid/30));return {w,text:`First top set — seeded from your e1RM ${b.e1rm} (${fmtShort(b.date)}): ${w} for ${sc.lo}–${sc.hi}, leave 1 rep in the tank.`};}

}

function padFit(end){
  if(PAD_CACHE[end]!==undefined)return PAD_CACHE[end];
  const def={pEst:0.3,pHome:0.15,ok:false};
  let res=def;
  if(profileReady()){
    const start=addDays(end,-27);const days=[];
    for(let i=0;i<28;i++){const d=addDays(start,i);if(dayIntake(d)>=800)days.push(d);}
    const weighs=Object.keys(state.data.weights).filter(d=>d>=start&&d<=end).sort().map(d=>({date:d,w:state.data.weights[d]}));
    if(days.length>=10&&weighs.length>=6&&daysBetween(weighs[0].date,weighs[weighs.length-1].date)>=14){
      const slope=theilSenSlope(weighs);let K=0,H=0,E=0,burn=0;
      days.forEach(d=>{const s=daySplit(d);K+=s.known;H+=s.home;E+=s.est;burn+=physBurn(d).tdee;});
      const n=days.length,need=burn+3500*slope*n;
      const den=0.5*H+E;let p=den>=150*n/7?(need-K-H-E)/den:0.3;
      const raw=p;p=Math.max(0,Math.min(1.2,p));
      const explained=K+H*(1+p/2)+E*(1+p);
      res={pEst:Math.round(p*100)/100,pHome:Math.round(p*50)/100,raw:Math.round(raw*100)/100,ok:true,n,slopeWk:round1(slope*7),
        burnAvg:Math.round(burn/n),loggedAvg:Math.round((K+H+E)/n),needAvg:Math.round(need/n),
        split:{known:Math.round(K/n),home:Math.round(H/n),est:Math.round(E/n)},unexplained:Math.round((need-explained)/n),start,end};
    }
  }
  return (PAD_CACHE[end]=res);
}
function padAt(date){const t=getToday();const e=addDays(date,14);return padFit(e>t?t:e);}
function adjIntakeOn(date){const s=daySplit(date),p=padAt(date);return Math.round(s.known+s.home*(1+p.pHome)+s.est*(1+p.pEst));}

// ── Apple Health import (Shortcut → clipboard → paste) ──
function parseHealth(txt){
  const out={};if(!txt)return out;
  String(txt).split(/[\n;|]+/).forEach(line=>{
    const m=line.match(/^\s*([a-z_ ]+?)\s*[=:]\s*(.+?)\s*$/i);if(!m)return;
    const k=m[1].toLowerCase().replace(/\s+/g,''),v=m[2];
    if(k==='date'){
      let d=null;const iso=v.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);const us=v.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if(iso)d=`${iso[1]}-${iso[2].padStart(2,'0')}-${iso[3].padStart(2,'0')}`;
      else if(us){const y=us[3].length===2?'20'+us[3]:us[3];d=`${y}-${us[1].padStart(2,'0')}-${us[2].padStart(2,'0')}`;}
      if(d)out.date=d;return;
    }
    if(/^sleep(min|minutes|hours|hrs)?$/.test(k)){const h=parseSleepVal(v,k);if(h!=null)out.sleep=h;return;}
    if(k==='sleepdate'){const iso=v.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(iso)out.sleepDate=`${iso[1]}-${iso[2].padStart(2,'0')}-${iso[3].padStart(2,'0')}`;return;}
    const num=parseFloat(v.replace(/,/g,'').match(/-?\d+(\.\d+)?/)?.[0]);if(isNaN(num))return;
    const key={rest:'rest',resting:'rest',restingenergy:'rest',basal:'rest',active:'active',activeenergy:'active',steps:'steps',step:'steps',weight:'weight',bodymass:'weight',exercise:'exmin',exmin:'exmin',exerciseminutes:'exmin'}[k];
    if(key)out[key]=num;
  });
  if(out.rest!=null&&!(out.rest>=800&&out.rest<=6000))delete out.rest;
  if(out.active!=null&&!(out.active>=0&&out.active<=6000))delete out.active;
  if(out.steps!=null&&!(out.steps>=0&&out.steps<=100000))delete out.steps;
  if(out.weight!=null&&!(out.weight>=80&&out.weight<=600))delete out.weight;
  return out;
}
// Sleep arrives as hours, minutes or seconds depending on how the Shortcut is built — normalise to hours.
function parseSleepVal(v,k){
  const t=String(v).replace(/,/g,'').trim();
  const hm=t.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);if(hm)return round1(+hm[1]+(+hm[2])/60);
  const hr=t.match(/(\d+(?:\.\d+)?)\s*h(?:r|rs|ours?)?\b(?:\s*(\d+)\s*m)?/i);if(hr)return round1(+hr[1]+(hr[2]?+hr[2]/60:0));
  const n=parseFloat((t.match(/-?\d+(\.\d+)?/)||[])[0]);if(isNaN(n)||n<=0)return null;
  let h=/min/.test(k)?n/60:/hour|hrs/.test(k)?n:n<=24?n:n<=1440?n/60:n/3600;
  h=round1(h);return (h>=1&&h<=16)?h:null;
}

// ── Weigh & Log (plate builder) ──
function foodById(id){return myFoods().find(f=>f.id===id)||null;}
function plateTotals(){let cal=0,pro=0;(state.plate||[]).forEach(p=>{const f=foodById(p.fid);if(!f)return;cal+=f.cal*(+p.amt||0);pro+=f.pro*(+p.amt||0);});return {cal:Math.round(cal),pro:Math.round(pro)};}
function openPlate(){if(!state.plate)state.plate=[];state.plateReturn=true;state.modal='plate';render();}
function plateAdd(fid){const f=foodById(fid);if(!f)return;(state.plate=state.plate||[]).push({fid,amt:f.unit==='oz'?'':1});state.plateQ='';render();setTimeout(()=>{const els=document.querySelectorAll('.pl-amt');const el=els[els.length-1];if(el)el.focus();},60);}
function plateAmt(i,v){if(!state.plate[i])return;state.plate[i].amt=v;const t=plateTotals();const f=foodById(state.plate[i].fid);
  const r=document.getElementById('pl-r-'+i);if(r&&f){const a=+v||0;r.textContent=`${Math.round(f.cal*a)} · ${Math.round(f.pro*a)}g`;}
  const T=document.getElementById('pl-total');if(T)T.textContent=`${t.cal} cal · ${t.pro}g protein`;}
function plateRemove(i){state.plate.splice(i,1);render();}
function plateSearch(q){state.plateQ=q;const el=document.getElementById('pl-results');if(el)el.innerHTML=plateResults(q);}
function plateResults(q){
  const L=myFoods();const ql=(q||'').toLowerCase().trim();
  const list=ql?L.filter(f=>f.name.toLowerCase().includes(ql)):L.slice(0,12);
  if(!list.length)return `<div class="empty-state" style="padding:10px">No match. <span class="edit-link" onclick="showModal('food-new')">Add "${escapeHTML(q)}" ▸</span></div>`;
  return list.slice(0,14).map(f=>`<div class="pl-food" onclick="plateAdd('${f.id}')"><span>${escapeHTML(f.name)}</span><span>${f.cal}·${f.pro}g /${f.unit}</span></div>`).join('');
}
function logPlate(){
  const P=(state.plate||[]).filter(p=>+p.amt>0&&foodById(p.fid));if(!P.length){alert('Add a food and an amount first.');return;}
  const t=plateTotals();
  const auto=P.map(p=>{const f=foodById(p.fid);return `${f.name.replace(/\s*\(.*?\)\s*/g,' ').trim()} ${+p.amt}${f.unit==='oz'?' oz':f.unit==='each'?'':' '+f.unit}`;}).join(' + ');
  const name=(document.getElementById('pl-name')?.value||'').trim()||auto;
  const vd=getVD();(state.data.meals[vd]=state.data.meals[vd]||[]).push({name,calories:t.cal,protein:t.pro,src:'known',items:P.map(p=>({fid:p.fid,amt:+p.amt}))});
  if(document.getElementById('pl-fav')?.checked)addFavorite(name,t.cal,t.pro);
  state.plate=[];save();closeModal();
}
function renderPlateModal(){
  const P=state.plate||[];const t=plateTotals();
  return {title:'Weigh & Log — '+fmtShort(getVD()),body:`
    <div class="form-group"><input type="text" id="pl-q" placeholder="Search your foods (chicken, rice, chili…)" value="${escapeHTML(state.plateQ||'')}" oninput="plateSearch(this.value)" autocomplete="off"></div>
    <div id="pl-results" class="pl-results">${plateResults(state.plateQ||'')}</div>
    <div style="display:flex;gap:8px;margin:8px 0 14px"><button class="btn btn-secondary btn-sm" style="flex:1" onclick="showModal('food-new')">+ New food</button><button class="btn btn-secondary btn-sm" style="flex:1" onclick="state.foodTab='scan';showModal('food-new')">▦ Barcode</button></div>
    ${P.length?`<div class="db-h" style="color:var(--cyan)">On the plate</div>${P.map((p,i)=>{const f=foodById(p.fid);if(!f)return '';const a=+p.amt||0;
      return `<div class="pl-row"><div class="pl-n">${escapeHTML(f.name)}</div><input class="pl-amt" type="number" inputmode="decimal" step="0.05" value="${p.amt}" placeholder="${f.unit}" oninput="plateAmt(${i},this.value)"><span class="pl-u">${f.unit}</span><span class="pl-r" id="pl-r-${i}">${Math.round(f.cal*a)} · ${Math.round(f.pro*a)}g</span><span class="meal-delete" onclick="plateRemove(${i})">✕</span></div>`;}).join('')}
      <div class="pl-total" id="pl-total">${t.cal} cal · ${t.pro}g protein</div>
      <div class="form-group" style="margin-top:10px"><input type="text" id="pl-name" placeholder="Meal name (optional — auto-named)"></div>
      <div class="checkbox-row"><input type="checkbox" id="pl-fav"><label for="pl-fav">★ Also save as a one-tap favorite</label></div>

function setFoodTab(t){stopScan();state.foodTab=t;render();}
function saveCustomFood(){
  const name=(document.getElementById('nf-name')?.value||'').trim();const unit=document.getElementById('nf-unit')?.value||'oz';
  const cal=parseFloat(document.getElementById('nf-cal')?.value),pro=parseFloat(document.getElementById('nf-pro')?.value)||0;
  if(!name||!(cal>=0)){alert('Name and calories are required.');return;}
  const id=addFood({name,unit,cal:round1(cal),pro:round1(pro),src:'custom'});afterFoodAdded(id);
}
function afterFoodAdded(id){stopScan();if(state.plateReturn===false){state.modal=null;render();return;}(state.plate=state.plate||[]).push({fid:id,amt:''});state.modal='plate';render();}
async function usdaSearch(){
  const q=(document.getElementById('usda-q')?.value||'').trim();if(!q)return;
  const out=document.getElementById('usda-out');if(out)out.innerHTML='<div class="empty-state">Searching USDA…</div>';
  const key=(state.data.config.usdaKey||'').trim()||'DEMO_KEY';
  const url=`https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(key)}&query=${encodeURIComponent(q)}&pageSize=12&dataType=${encodeURIComponent('Foundation,SR Legacy,Survey (FNDDS)')}`;
  try{
    const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();
    const foods=(j.foods||[]).map(f=>{const nut=(id,nm)=>{const x=(f.foodNutrients||[]).find(n=>n.nutrientId===id||(n.nutrientName===nm&&(n.unitName||'').toUpperCase()!=='KJ'));return x?+x.value:null;};
      const kcal=nut(1008,'Energy'),pro=nut(1003,'Protein');return kcal!=null?{name:f.description,cal:round1(kcal*0.2835),pro:round1((pro||0)*0.2835)}:null;}).filter(Boolean);
    state.usdaResults=foods;
    if(out)out.innerHTML=foods.length?foods.map((f,i)=>`<div class="pl-food" onclick="addUsda(${i})"><span>${escapeHTML(f.name)}</span><span>${f.cal}·${f.pro}g /oz</span></div>`).join(''):'<div class="empty-state">No results — try simpler words ("chicken breast roasted").</div>';
  }catch(e){if(out)out.innerHTML=`<div class="empty-state">USDA lookup failed (${escapeHTML(e.message)}). ${(state.data.config.usdaKey||'')?'':'The shared DEMO_KEY is rate-limited — add your free key in ⚙ Settings.'}</div>`;}
}
function addUsda(i){const f=(state.usdaResults||[])[i];if(!f)return;const nm=f.name.toLowerCase().replace(/(^|[\s,(])\w/g,c=>c.toUpperCase());const id=addFood({name:nm,unit:'oz',cal:f.cal,pro:f.pro,src:'usda'});afterFoodAdded(id);}
async function offLookup(code){
  code=String(code||document.getElementById('bc-code')?.value||'').replace(/\D/g,'');if(code.length<6){alert('Enter the barcode digits.');return;}
  const out=document.getElementById('bc-out');if(out)out.innerHTML='<div class="empty-state">Looking up '+code+'…</div>';
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,nutriments,serving_size`);const j=await r.json();
    if(!j||j.status!==1||!j.product)throw new Error('not in Open Food Facts');
    const p=j.product,n=p.nutriments||{};const nm=[p.brands&&p.brands.split(',')[0],p.product_name].filter(Boolean).join(' ')||('Barcode '+code);
    const opts=[];
    if(n['energy-kcal_serving']!=null)opts.push({unit:'each',cal:Math.round(n['energy-kcal_serving']),pro:round1(n.proteins_serving||0),lbl:`per serving${p.serving_size?' ('+p.serving_size+')':''}`});
    if(n['energy-kcal_100g']!=null)opts.push({unit:'oz',cal:round1(n['energy-kcal_100g']*0.2835),pro:round1((n.proteins_100g||0)*0.2835),lbl:'per oz (from 100 g)'});
    if(!opts.length)throw new Error('no calorie data on this product');
    state.offResult={name:nm,opts,code};
    if(out)out.innerHTML=`<div class="db-h" style="color:var(--green)">${escapeHTML(nm)}</div>`+opts.map((o,i)=>`<div class="pl-food" onclick="addOff(${i})"><span>${o.lbl}</span><span>${o.cal}·${o.pro}g</span></div>`).join('');
  }catch(e){if(out)out.innerHTML=`<div class="empty-state">${escapeHTML(e.message)}. Add it as a custom food from the label.</div>`;}
}
function addOff(i){const r=state.offResult;if(!r)return;const o=r.opts[i];const id=addFood({name:r.name,unit:o.unit,cal:o.cal,pro:o.pro,src:'label',barcode:r.code});afterFoodAdded(id);}
let SCAN=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('could not load scanner'));document.head.appendChild(s);});}
async function startScan(){
  const v=document.getElementById('scan-video');const msg=document.getElementById('scan-msg');if(!v)return;
  try{
    if('BarcodeDetector' in window){
      const det=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;await v.play();
      SCAN={stream};if(msg)msg.textContent='Point at the barcode…';
      const loop=async()=>{if(!SCAN)return;try{const c=await det.detect(v);if(c&&c.length){const code=c[0].rawValue;stopScan();const el=document.getElementById('bc-code');if(el)el.value=code;offLookup(code);return;}}catch(e){}requestAnimationFrame(loop);};loop();
    }else{
      if(!window.ZXing)await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js');
      const reader=new window.ZXing.BrowserMultiFormatReader();SCAN={reader};if(msg)msg.textContent='Point at the barcode…';
      reader.decodeFromVideoDevice(null,'scan-video',(res)=>{if(res&&SCAN){const code=res.getText();stopScan();const el=document.getElementById('bc-code');if(el)el.value=code;offLookup(code);}});
    }
  }catch(e){if(msg)msg.textContent='Camera unavailable ('+e.message+') — type the digits instead.';}
}
function stopScan(){if(!SCAN)return;try{if(SCAN.stream)SCAN.stream.getTracks().forEach(t=>t.stop());if(SCAN.reader)SCAN.reader.reset();}catch(e){}SCAN=null;}
function renderFoodNewModal(){
  const tab=state.foodTab||'custom';
  const tabs=[['custom','Custom'],['usda','USDA search'],['scan','Barcode']].map(([k,l])=>`<button class="range-pill ${tab===k?'on':''}" onclick="setFoodTab('${k}')">${l}</button>`).join('');
  let body='';
  if(tab==='custom')body=`<div class="form-group"><label>Food name</label><input type="text" id="nf-name" placeholder="e.g. Julia's turkey meatballs" value="${escapeHTML(state.plateQ||'')}"></div>
    <div class="form-group"><label>Unit</label><select id="nf-unit"><option value="oz">per oz (weigh it)</option><option value="each">per item / serving</option><option value="cup">per cup</option><option value="tbsp">per tbsp</option></select></div>
    <div style="display:flex;gap:8px"><div class="form-group" style="flex:1"><label>Calories</label><input type="number" id="nf-cal" step="0.1" inputmode="decimal"></div><div class="form-group" style="flex:1"><label>Protein (g)</label><input type="number" id="nf-pro" step="0.1" inputmode="decimal"></div></div>
    <p class="cal-note" style="margin-top:-4px">Homemade dish? Weigh the empty pot, then the full pot. Total recipe calories ÷ ounces of food = calories per oz.</p>
    <button class="btn btn-primary" onclick="saveCustomFood()">Save food</button>`;
  if(tab==='usda')body=`<div style="display:flex;gap:8px"><input type="text" id="usda-q" placeholder="e.g. sweet potato baked" style="flex:1;min-width:0" onkeydown="if(event.key==='Enter')usdaSearch()"><button class="btn btn-primary btn-sm" onclick="usdaSearch()">Search</button></div>
    <div id="usda-out" class="pl-results" style="margin-top:10px"></div>
    <p class="cal-note">USDA FoodData Central — lab-measured nutrition per 100 g, converted per oz. Tap a result to add it to My Foods.</p>`;
  if(tab==='scan')body=`<video id="scan-video" class="scan-video" playsinline muted></video>
    <div id="scan-msg" class="cal-note" style="margin:6px 0">Tap Start camera, or type the digits under the barcode.</div>
    <div style="display:flex;gap:8px"><button class="btn btn-secondary btn-sm" style="flex:1" onclick="startScan()">Start camera</button><button class="btn btn-secondary btn-sm" style="flex:1" onclick="stopScan()">Stop</button></div>
    <div style="display:flex;gap:8px;margin-top:10px"><input type="text" id="bc-code" inputmode="numeric" placeholder="Barcode digits" style="flex:1;min-width:0"><button class="btn btn-primary btn-sm" onclick="offLookup()">Look up</button></div>
    <div id="bc-out" class="pl-results" style="margin-top:10px"></div>
    <p class="cal-note">Open Food Facts — free, crowd-sourced. Double-check the numbers against the label the first time.</p>`;
  return {title:'Add a Food',body:`<div class="range-row">${tabs}</div>${body}${state.plateReturn===false?'':`<button class="btn btn-secondary btn-sm" style="width:100%;margin-top:12px" onclick="stopScan();state.modal='plate';render()">‹ Back to plate</button>`}`};
}

// Barbell & Smith: 45-lb bar, plates 45/35/25/10/5 (no 2.5s) → totals step 10 (45, 55, 65 … 305).
// Dumbbells: 5-lb steps, stop at 75 per hand. Fixed barbells: stop at 60 (total).
const PF={get dbMax(){return gymHome()?(homeEq().dbMax||50):gymFull()?150:75},get fixedBarMax(){return gymFull()?120:60},get plates(){return gymFull()?[45,35,25,10,5,2.5]:[45,35,25,10,5]},get barStep(){return gymFull()?5:10}};
function equipOf(name){
  const n=(name||'').toLowerCase();
  const heavy=/squat|deadlift|romanian|rdl|hip thrust/.test(n);
  if(/smith/.test(n))return {kind:'smith',step:gymFull()&&!heavy?5:10,label:'Smith machine'};
  if(/^reverse curls/.test(n))return {kind:'fixedbar',step:10,cap:PF.fixedBarMax,label:'fixed bar'};
  if(/\bdb\b|dumbbell|hammer curl|lateral raise|arnold|single-arm|goblet/.test(n))return {kind:'db',step:5,cap:PF.dbMax,perHand:true,label:'per hand'};
  if(/leg press|hack squat|calf|hip thrust|t-bar/.test(n))return {kind:'plates',step:gymFull()?5:10,label:'plates only'};
  if(/bench press|squat|deadlift|overhead press|barbell row|romanian|pendlay/.test(n))return {kind:'barbell',step:gymFull()&&!heavy?5:10,label:'Olympic bar'};
  if(/cable|pulldown|pushdown|face pull|machine|leg curl|leg extension|pec deck|abductor|adductor|seated .*row|lat /.test(n))return {kind:'stack',step:5,label:'stack'};
  return {kind:'other',step:5};
}
function isBarLoaded(name){const k=equipOf(name).kind;return k==='barbell'||k==='smith';}
function lxUnit(mode,name){if(mode==='assist')return 'assist lb';if(mode==='bw')return '+lb';const e=equipOf(name);return e.perHand?'lb / hand':e.kind==='barbell'||e.kind==='smith'?'lb total':'lb';}
function barRound(w){const s=PF.barStep;return Math.max(45,45+Math.round((w-45)/s)*s);}
function barFloor(w){const s=PF.barStep;return Math.max(45,45+Math.floor((w-45)/s+1e-9)*s);}
function legalWeight(name,w){
  const e=equipOf(name);
  if(e.kind==='barbell'||e.kind==='smith')return barRound(w);
  let v=Math.round(w/5)*5;if(e.cap)v=Math.min(e.cap,v);return v;
}
const CAP_SWAP={'Incline DB Press':'switch to the Smith Incline Press','Single-Arm DB Row':'switch to the Barbell Row','DB Shoulder Press':'slow the lowering to 3 seconds (your heavy pressing lives on the barbell now)','DB Curls':'switch to an Olympic-bar curl (45 bar + 10s)','Hammer Curls':'switch to a rope hammer curl on the cable','Reverse Curls':'switch to an Olympic bar (45 + two 10s = 65)','Lateral Raises':'switch to cable laterals','Arnold Press':'switch to the DB Shoulder Press'};
// overrides v11/v12 helpers (later declarations win)
function liftIncrement(name,mode){return equipOf(name).step;}
function platesPerSide(w){let side=(w-45)/2;if(side<=0)return [];const out=[];PF.plates.forEach(p=>{while(side>=p-1e-9){out.push(p);side-=p;}});return out;}
function warmupRamp(W){
  if(!(W>=95))return [];
  const steps=[[45,10],[W*0.4,5],[W*0.6,3],[W*0.75,2],[W*0.85,1]];const out=[];
  steps.forEach(([w,r])=>{const v=barRound(w);if(v<W&&(!out.length||v>out[out.length-1][0]))out.push([v,r]);});return out;
}
function liftSuggestion(name,scheme,before){
  const h=liftHistory(name,before);const last=h[h.length-1];const sc=scheme||{sets:3,lo:8,hi:12};const eq=equipOf(name);
  const unit=eq.perHand?' per hand':'';
  if(!last){
    if(sc.max)return {w:null,text:'First log — go to failure with clean reps. That number becomes the one to beat.'};
    if(defaultLiftMode(name)==='bw')return {w:null,text:`First log — bodyweight, clean reps in the ${sc.lo}${sc.hi!==sc.lo?'–'+sc.hi:''} range. Those reps become the number to beat.`};
    return {w:null,text:`First log — pick a weight${unit} you can do for ${sc.lo}${sc.hi!==sc.lo?'–'+sc.hi:''} clean reps with 1–2 left in the tank.`};
  }
  const mode=last.mode,inc=liftIncrement(name,mode);
  if(sc.max||mode==='bw'){const tot=last.sets.reduce((a,s)=>a+(+s.r||0),0);return {w:mode==='bw'?(+last.sets[0].w||0):null,text:`Beat last: best set ${last.bestReps} reps (${tot} total). One more rep on any set is progress.`};}
  if(mode==='assist'){
    const W=last.minAssist;const allHit=last.sets.length>=sc.sets&&last.sets.every(s=>s.r>=sc.hi);
    const ua=last.sets.filter(s=>+s.w===0).reduce((a,s)=>Math.max(a,+s.r||0),0);
    if(ua>=(sc.lo||8))return {w:0,text:`You did ${ua} unassisted — go bodyweight on every set. Own ${sc.hi} on all ${sc.sets}, then switch to Bodyweight mode and add weight.`};
    if(allHit){const nw=Math.max(0,W-inc);return {w:nw,text:nw===0?`You owned ${W} lb assist — try it UNASSISTED.`:`Hit ${sc.hi} on every set → drop assistance to ${nw} lb.`};}
    return {w:W,text:`Stay at ${W} lb assist — chase ${sc.hi} reps on all ${sc.sets} sets, then drop ${inc} lb.`};
  }
  const W=last.topW;const atW=last.sets.filter(s=>+s.w===W);
  const allHit=last.sets.length>=sc.sets&&atW.length>=sc.sets&&atW.every(s=>s.r>=sc.hi);
  const missed=atW.some(s=>s.r<sc.lo);
  if(eq.cap&&W>=eq.cap){
    const stretch=sc.hi+4;const atCapAll=atW.length>=sc.sets&&atW.every(s=>s.r>=stretch);
    const swap=gymHome()?'slow the lowering to 3 seconds and pause at the bottom (or get heavier dumbbells)':(CAP_SWAP[name]||'switch to a barbell or machine version');
    if(atCapAll)return {w:eq.cap,text:`${eq.cap}${unit} is ${gymHome()?'your heaviest pair':gymFull()?'the top of the rack':'Planet Fitness\'s ceiling'} and you own ${stretch} reps. Next time, ${swap}.`};
    return {w:eq.cap,text:`Maxed ${gymHome()?'your':gymFull()?'the':'PF'} ${eq.kind==='db'?'dumbbells':'fixed bars'} (${eq.cap}${unit}). Build reps instead: chase ${stretch} on all ${sc.sets} sets, then ${swap}.`.replace('Maxed the dumbbells',gymHome()?'Maxed your dumbbells':'Maxed the dumbbells')};
  }
  if(allHit){let nw=legalWeight(name,W+inc);if(eq.cap&&nw>eq.cap)nw=eq.cap;
    return {w:nw,text:`Hit ${sc.hi} on all ${sc.sets} sets at ${W}${unit} → go ${nw}${unit} today.`};}
  if(missed)return {w:W,text:`Hold ${W}${unit}. A set fell under ${sc.lo} last time — own this weight before adding.`};
  return {w:W,text:`Stay at ${W}${unit} — add a rep or two. Earn ${sc.hi} on all ${sc.sets} sets, then +${inc} lb${unit}.`};
}
// Top sets: 10-lb jumps, bar-legal numbers, seeded from your Smith squat / DB press when there's no free-bar history yet.
const TOP_SEEDS={squat:{from:'Smith Squat',factor:0.8,label:'your Smith squat'},ohp:{from:'DB Shoulder Press',factor:1.6,label:'your 75-lb DB press'}};
function topSetSuggestion(name,sc,before){
  const h=liftHistory(name,before);const key=bigLiftOf(name);const inc=equipOf(name).step||10;
  const mid=Math.round(((sc.lo||5)+(sc.hi||5))/2);
  const lastTop=[...h].reverse().find(s=>s.role==='top');
  if(lastTop){
    const W=lastTop.topW;const best=Math.max(...lastTop.sets.filter(s=>+s.w===W).map(s=>+s.r||0));
    if(best>=sc.hi+2)return {w:W+2*inc,text:`${W}×${best} blew past ${sc.hi} → jump to ${W+2*inc} for ${sc.lo}–${sc.hi}.`};
    if(best>=sc.hi)return {w:W+inc,text:`Owned ${W}×${best} → go ${W+inc} for ${sc.lo}–${sc.hi}.`};
    if(best<sc.lo){const r=barFloor(W*0.95);return {w:r,text:`${W}×${best} fell under ${sc.lo} — reset to ${r} and build back up.`};}
    return {w:W,text:`Stay at ${W} — you got ${best}. Earn ${sc.hi}, then +${inc} lb.`};
  }
  const asOf=before?addDays(before,-1):getToday();
  const b=key?bestE1RM(key,asOf,60):null;
  if(b){const w=barFloor(b.e1rm/(1+mid/30));return {w,text:`First top set — seeded from your e1RM ${b.e1rm} (${fmtShort(b.date)}): ${w} for ${sc.lo}–${sc.hi}, leave 1 rep in the tank.`};}
  const seed=key&&TOP_SEEDS[key];
  if(seed){const sh=liftHistory(seed.from,before).filter(s=>s.date>=addDays(asOf,-90)&&s.mode==='load');
    if(sh.length){const e=Math.max(...sh.map(s=>s.e1rm))*seed.factor;const w=barFloor(e/(1+mid/30));
      return {w,text:`First free-bar top set — estimated from ${seed.label}: ${w} for ${sc.lo}–${sc.hi}. If it moves fast, add 10 next time.`};}}
  return {w:null,text:`First top set — work up to a weight you could do ~${sc.hi+2} times, do ${mid}. That's the baseline.`};
}
function backoffSuggestion(e,sc,vd){
  const top=liftEntry(vd,e.of,false);let base=null,src='';
  if(top){const s=(top.sets||[]).filter(x=>x&&x.r>0);if(s.length){base=Math.max(...s.map(x=>+x.w||0));src='today\'s top set';}}
  if(base==null){const tsc=parseScheme((findExerciseDef(e.of)||{}).sets)||{lo:4,hi:6,sets:1};const t=topSetSuggestion(e.of,tsc,vd);base=t.w;src='today\'s planned top set';}
  if(!base)return {w:null,text:'Log the top set first — back-offs are ~90% of it.'};
  const pct=/deadlift/i.test(e.name)?0.87:0.9;const w=barRound(base*pct);
  return {w,text:`${Math.round(pct*100)}% of ${src} (${base}) → ${w} × ${sc.lo}–${sc.hi}.`};
}

// ── One-time data accuracy fixes (idempotent; only touches entries on/before Nov 9, 2026) ──
const FIX13_CUTOFF='2026-11-09';
function fixData13(d){
  if(!d||!d.lifts)return false;let changed=false;const L=d.lifts;
  const merge=(day,froms,to,opts)=>{
    const dayL=L[day];if(!dayL)return;
    froms.forEach(f=>{const e=dayL[f];if(!e)return;
      const t=dayL[to]||(dayL[to]={mode:(opts&&opts.mode)||e.mode||'load',sets:[]});
      const mapped=(e.sets||[]).filter(s=>s&&s.r>0).map(s=>({w:(opts&&opts.wf)?opts.wf(+s.w||0):(+s.w||0),r:+s.r}));
      // Re-importing an old backup brings the old names back: skip sets the merged entry already holds.
      const have={};(t.sets||[]).forEach(s=>{const k=(+s.w||0)+'x'+(+s.r);have[k]=(have[k]||0)+1;});
      const dup=mapped.length&&mapped.every(s=>{const k=s.w+'x'+s.r;if(have[k]>0){have[k]--;return true;}return false;});
      if(!dup)t.sets=(t.sets||[]).concat(mapped);
      if(opts&&opts.mode)t.mode=opts.mode;delete t.role;delete dayL[f];changed=true;});
  };
  Object.keys(L).sort().forEach(day=>{
    if(day>FIX13_CUTOFF)return;
    merge(day,['Barbell Curls'],'DB Curls');
    merge(day,['Overhead Press (Barbell)','Overhead Press (Barbell) · Back-off'],'DB Shoulder Press');
    merge(day,['Barbell Back Squat','Barbell Back Squat · Back-off'],'Smith Squat');
    merge(day,['Incline Barbell Press'],'Smith Incline Press');
    merge(day,['Barbell Row'],'Smith Row');
    merge(day,['Close-Grip Bench or Dips'],'Tricep Dips (Machine or Assisted)',{mode:'assist'});
  });
  const o26=L['2026-10-26']&&L['2026-10-26']['Incline DB Press'];
  if(o26&&(o26.sets||[]).every(s=>+s.w===77.5))merge('2026-10-26',['Incline DB Press'],'Smith Incline Press',{wf:w=>w*2});
  const n8=L['2026-11-08']&&L['2026-11-08']['Tricep Dips (Machine or Assisted)'];
  if(n8&&(n8.sets||[]).some(s=>+s.w===0&&s.r>=10)&&d.goals&&Array.isArray(d.goals.long)){
    const g=d.goals.long.find(x=>/10 unassisted tricep dips/i.test(x.text||''));
    if(g&&!g.done){g.done=true;g.completed='2026-11-08';changed=true;}
  }
  if(d.config&&!d.config.fix13){d.config.scoreBasis='physio';d.config.fix13=true;changed=true;}
  return changed;
}

  const L=state.data.lifts||{};
  Object.keys(L).forEach(d=>{if(d>asOf)return;Object.entries(L[d]||{}).forEach(([n,e])=>{
    if(!(e.sets||[]).some(s=>s&&s.r>0))return;

// ── Soreness-aware planner ──
const LOWER=['quads','hams','calves'];
const CARDIO_RX=/stairmaster|incline walk|treadmill|elliptical|recumbent|bike|rower|\bwalk\b|run\b|jog/i;
const CARDIO_OPTS=[
  {name:'Stairmaster or Incline Walk',load:{calves:1,quads:1}},
  {name:'Recumbent Bike (Zone 2)',load:{quads:1,calves:.3}},
  {name:'Rower (easy, Zone 2)',load:{back:1,quads:.5,biceps:.5,calves:.3}},
  {name:'Arm Bike / Upper-Body Ergometer',load:{shoulders:1,biceps:1,triceps:.5}},
  {name:'Flat Walk (easy pace)',load:{calves:.5}}
];
function cardioPick(sore){
  const cost=o=>Object.entries(o.load).reduce((a,[g,f])=>a+((sore[g]||0)**2)*f,0);
  return CARDIO_OPTS.map((o,i)=>({o,c:cost(o),i})).sort((a,b)=>a.c-b.c||a.i-b.i)[0].o;
}
function exPlan(e,sore){
  const lv=g=>sore[g]||0;
  if(CARDIO_RX.test(e.name)&&!parseScheme(e.sets)){
    const pick=cardioPick(sore);const orig=CARDIO_OPTS.find(o=>o.name===e.name);
    const origCost=orig?Object.entries(orig.load).reduce((a,[g,f])=>a+(lv(g)**2)*f,0):0;
    if(pick.name!==e.name&&origCost>0){const worst=Object.keys((orig||{}).load||{}).sort((a,b)=>lv(b)-lv(a))[0];
      return {status:'swap',swapTo:pick.name,why:`${SCAN_L[worst]} ${SORE_LV[lv(worst)][0].toLowerCase()} → ${pick.name.replace(/ \(.*\)/,'').toLowerCase()} instead`};}
    return {status:'ok'};
  }
  const groups=loadOf(e.name);let status='ok';const why=[];
  const bump=(s,w)=>{const rank={ok:0,light:1,skip:2};if(rank[s]>rank[status])status=s;if(w&&!why.includes(w))why.push(w);};
  groups.forEach(([g,f])=>{const s=lv(g);if(!s)return;const lab=`${SCAN_L[g]} ${SORE_LV[s][0].toLowerCase()}`;
    if(s>=2&&f>=1)bump('skip',lab);else if(s>=3&&f>=.3)bump('skip',lab);
    else if(s>=2&&f>=.5)bump('light',lab);else if(s===1&&f>=1)bump('light',lab);});
  const lw=LOWER.filter(g=>lv(g)>=3);
  if(status!=='skip'&&lw.length&&groups.some(([g,f])=>LOWER.includes(g)&&f>=.3))bump('skip',`${SCAN_L[lw[0]]} wrecked`);
  return {status,why:why.join(' · ')};
}
function planRoutine(r,sore){
  const items=r.exercises.map(e=>({ex:e,...exPlan(e,sore)}));
  const sets=e=>{const p=parseScheme(e.sets);return p?p.sets:2;};
  const total=items.reduce((a,i)=>a+sets(i.ex),0),skipped=items.filter(i=>i.status==='skip').reduce((a,i)=>a+sets(i.ex),0);
  const topSkipped=items.some(i=>i.ex.role==='top'&&i.status==='skip');
  return {r,items,viable:!topSkipped&&skipped/total<0.34,skippedFrac:skipped/total,topSkipped};
}
function recoveryRoutine(sore){
  const c=cardioPick(sore);
  return {id:'recovery',name:'Active Recovery',short:'RECOVER',desc:'Easy movement to push blood through sore muscles. Nothing heavy today.',muscles:[['cardio','p']],
    exercises:[{name:c.name,sets:'25-35 min',note:'Conversational pace. Blood flow is what clears soreness — this speeds you up for tomorrow.'},
      {name:'Mobility: hips, ankles, T-spine',sets:'10 min',note:'Slow, controlled ranges. No stretching into sharp pain.'},
      {name:'Foam roll the sore areas',sets:'5-10 min',note:'60–90 seconds per spot, moderate pressure.'}]};
}
function dailyPlan(){
  const n=nextUpPB();const sore=soreMap();const hasSore=Object.keys(sore).length>0;
  if(!n.routine)return null;
  if(!hasSore||n.isTomorrow){const p=planRoutine(n.routine,{});return {...p,n,adjusted:false,hasSore,reason:''};}
  const PO=pbOrder();const i0=Math.max(0,PO.indexOf(n.id));const order=[];
  for(let k=0;k<PO.length;k++){const id=PO[(i0+k)%PO.length];if(k===0||id!=='pb-cond')order.push(id);}
  if(!order.includes('pb-cond')&&goalDir()!=='bulk')order.push('pb-cond');
  const first=planRoutine(n.routine,sore);
  if(first.viable&&!n.rest){const changed=first.items.some(i=>i.status!=='ok');
    return {...first,n,adjusted:changed,hasSore,reason:changed?'Same day as planned, adjusted around what\'s sore.':''};}
  for(const id of order.slice(1)){const p=planRoutine(pbRoutine(id),sore);
    if(p.viable)return {...p,n,adjusted:true,hasSore,swappedFrom:n.routine,reason:`${n.routine.name} would ${first.topSkipped?'lose its top set':'lose too much work'} today — ${p.r.name} fits instead. ${n.routine.short} stays next in the rotation.`};}
  const rec=recoveryRoutine(sore);
  return {...planRoutine(rec,sore),r:rec,n,adjusted:true,hasSore,recovery:true,reason:'Too much is sore for a productive lift. Recover today and come back stronger tomorrow.'};
}

}

function weightChartSVG(range){

  const from=range==='all'?all[0].date:(addDays(today,-(+range))>all[0].date?addDays(today,-(+range)):all[0].date);
  const pts=all.filter(e=>e.date>=from),avg=roll.filter(r=>r.date>=from);
  const gd=state.data.config.goalDate;const end=gd&&gd>today&&daysBetween(today,gd)<=Math.max(45,+range||90)?gd:today;
  const proj=t&&end>today?round1(t.smoothedLatest+t.slope*daysBetween(today,end)):null;
  const ys=pts.map(p=>p.w).concat(avg.map(a=>a.avg));if(proj!=null)ys.push(proj);

  </svg>`;
}

function scanInfo(){
  const rec=scanRecency(getToday());const sore=soreMap();const plan=programMode()==='pb'?dailyPlan():null;
  const todayG=new Set();
  if(plan&&!plan.n.isTomorrow&&!(plan.n.rest&&!plan.adjusted)&&!plan.recovery)plan.items.forEach(i=>{if(i.status==='skip')return;loadOf(i.status==='swap'?i.swapTo:i.ex.name).forEach(([g,f])=>{if(f>=1)todayG.add(g);});});
  const info={};SCAN_G.forEach(g=>{const d=scanDays(rec,g);const r=readiness(d);const s=sore[g]||0;
    info[g]={days:d,key:r.key,label:r.label,color:s>=2?SORE_LV[s][1]:(r.key==='never'&&todayG.has(g))?C2.accent:READY_HEX[r.key],sore:s,today:todayG.has(g)};});
  return info;
}
function bodyFigure(view,info){
  const shape=(g,d,extra)=>{const m=info[g];const sore=m.sore>=2;const op=m.today?.42:.3;
    return `<path d="${d}" fill="${sore?'url(#hatch-'+m.sore+')':m.color}" fill-opacity="${sore?1:op}" stroke="${m.color}" stroke-width="${m.today?1.6:1.3}" ${m.today?'filter="url(#bglow)"':''} class="bm-hit" onclick="openSore('${g}')" ${extra||''}><title>${SCAN_L[g]}</title></path>`;};
  const both=(g,d,extra)=>shape(g,d,extra)+shape(g,mirrorPath(d),extra);
  const absG=info.core;const absFill=absG.sore>=2?`url(#hatch-${absG.sore})`:absG.color;
  let parts='';
  if(view==='rear'){
    parts=both('shoulders',P.delt)+shape('back',P.trap)+both('back',P.lat)+shape('back',P.low,'fill-opacity=".18"')+both('triceps',P.upper)+
      both('hams',P.glute)+both('hams',P.ham)+both('calves',P.calf)+
      `<g fill="#7FF3FB" fill-opacity=".08" stroke="#8CF0FF" stroke-opacity=".35">${'<path d="'+P.fore+'"/><path d="'+mirrorPath(P.fore)+'"/>'}</g>`;
  }else{
    parts=both('shoulders',P.delt)+both('chest',P.pec)+both('biceps',P.upper)+
      `<g fill="${info.biceps.color}" fill-opacity=".14" stroke="${info.biceps.color}" stroke-opacity=".55"><path d="${P.fore}"/><path d="${mirrorPath(P.fore)}"/></g>`+
      `<g fill="${absFill}" fill-opacity="${absG.sore>=2?1:absG.today?.42:.3}" stroke="${absG.color}" stroke-width="1.3" class="bm-hit" onclick="openSore('core')">${ABS}<path d="${P.oblique}"/><path d="${mirrorPath(P.oblique)}"/><title>Core</title></g>`+
      both('quads',P.thigh)+both('calves',P.shin);
  }
  return `<g transform="translate(69 30) scale(.9167)">
    <g fill="url(#glass)" stroke="#8CF0FF" stroke-opacity=".55" stroke-width="1.2">${BODY_GLASS}</g>

}

function estMinutes(ex){let m=8;ex.forEach(e=>{const sc=parseScheme(e.sets);if(sc)m+=sc.sets*(e.role==='top'?6:2.6);else{const mm=String(e.sets).match(/(\d+)(?:-(\d+))?\s*min/);m+=mm?+(mm[2]||mm[1]):6;}});return Math.round(m/5)*5;}
function renderPlanCard(){
  const p=dailyPlan();if(!p)return '';const n=p.n;const r=p.r;
  const lifts=pbOrder().filter(id=>id!=='pb-cond');const pos=lifts.indexOf(r.id);
  const kicker=p.recovery?'Recovery day':n.isTomorrow?'Up next · tomorrow':r.id==='pb-cond'?'Next up · optional day 6':`Next up · day ${pos+1} of 5`;
  const bars=pbOrder().map(id=>{const done=n.thisWeek.some(s=>s.id===id);const isNext=id===r.id;return `<span style="background:${done?C2.green:isNext?C2.accent:C2.line}"></span>`;}).join('');
  const ex=sessionExercises(p);const top=p.items.find(i=>i.ex.role==='top'&&i.status!=='skip');
  let topRow='';
  if(top){const sc=parseScheme(top.ex.sets);const s=topSetSuggestion(top.ex.name,sc,n.planDay);
    topRow=`<div class="pc-top"><div><span class="pc-k">TOP SET</span><b>${escapeHTML(top.ex.name)}</b></div><span class="mono pc-w">${s.w?s.w+' × ':'1 × '}${sc.lo}–${sc.hi}</span></div>`;}
  const adj=p.adjusted?`<div class="pc-adj">${ic('<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/>',C2.amber,16)}<span>${escapeHTML(p.reason)}</span></div>
    <div class="pl-list">${p.items.map(i=>`<div class="pl-item ${i.status}"><span>${i.status==='swap'?`<s>${escapeHTML(i.ex.name)}</s> → ${escapeHTML(i.swapTo)}`:escapeHTML(i.ex.name)}</span><em>${i.status==='skip'?'Skip · '+escapeHTML(i.why):i.status==='light'?'Go light · '+escapeHTML(i.why):i.status==='swap'?'Swapped':escapeHTML(i.ex.sets)}</em></div>`).join('')}</div>`:'';
  const restNote=n.rest&&!p.adjusted?`<p class="muted">${n.streak} lifting days in a row — today is a rest day. Walk, stretch, eat your protein. You can still start if you feel good.</p>`:'';
  const doneNote=n.doneToday.length?`<p class="muted" style="color:${C2.green}">✓ Today: ${n.doneToday.map(id=>(pbRoutine(id)||{}).name).join(' + ')} logged.</p>`:'';

  </section>`;
}

const SESS_KEY='lockin-session';
function sessLoad(){try{const s=localStorage.getItem(SESS_KEY);state.session=s?JSON.parse(s):null;}catch(e){state.session=null;}}
function sessSave(){try{if(state.session)localStorage.setItem(SESS_KEY,JSON.stringify(state.session));else localStorage.removeItem(SESS_KEY);}catch(e){}}
function startPlan(){
  if(state.session){resumeSession();return;}
  const p=dailyPlan();if(!p)return;
  beginSession(p.r.id,p.r.name,sessionExercises(p),p.adjusted,p.r.muscles);
}
function startSession(id){
  if(state.session&&state.session.rid===id){resumeSession();return;}
  if(state.session&&!confirm('A session is already running. Replace it? Sets you logged stay saved.'))return;
  const r=pbRoutine(id);if(!r)return;const p=planRoutine(r,soreMap());
  beginSession(r.id,r.name,sessionExercises(p),p.items.some(i=>i.status!=='ok'),r.muscles);
}
function beginSession(rid,name,ex,adjusted,muscles){
  state.session={rid,name,date:getVD(),start:Date.now(),idx:0,ex:ex.map(e=>({name:e.name,sets:e.sets,role:e.role||null,of:e.of||null,note:e.note||'',light:!!e.light,why:e.why||'',ladder:e.ladder||null})),ramp:{},done:{},draft:{},restEnd:0,restDur:0,adjusted:!!adjusted,muscles:muscles||null};
  state.sessMin=false;state.modal=null;sessSave();window.scrollTo(0,0);render();
}
function resumeSession(){state.sessMin=false;state.modal=null;window.scrollTo(0,0);render();}
function sessMinimize(){state.sessMin=true;render();}
function sessGo(i){const S=state.session;if(!S||i<0||i>=S.ex.length)return;S.idx=i;sessSave();window.scrollTo(0,0);render();}
function fmtElapsed(ms){const s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(ss).padStart(2,'0');}
function sessExCount(e){const ent=liftEntry(state.session.date,e.name,false);return ent?(ent.sets||[]).filter(s=>s&&s.r>0).length:0;}
function sessExDone(e){const sc=parseScheme(e.sets);if(!sc)return !!state.session.done[e.name];return sessExCount(e)>=(sc.sets||1);}
function sessSug(e,sc){const vd=state.session.date;return e.role==='top'?topSetSuggestion(e.name,sc,vd):e.role==='backoff'?backoffSuggestion(e,sc,vd):liftSuggestion(e.name,sc,vd);}
